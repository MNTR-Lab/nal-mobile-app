name: Update NAL Team Stats

on:
  workflow_dispatch:

  schedule:
    - cron: "52 */6 * * *"

permissions:
  contents: write

jobs:
  update-team-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Update team stats
        env:
          DIGITALSHIFT_AUTH_TICKET: ${{ secrets.DIGITALSHIFT_AUTH_TICKET }}
        run: python scripts/update_team_stats.py

      - name: Show generated team stats summary
        run: |
          python - <<'PY'
          import json

          path = "data/stats/2026/teams.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          print("======================================")
          print("NAL TEAM STATS UPDATE")
          print("======================================")
          print(f"Year: {data.get('year')}")
          print(f"Season: {data.get('season_label')}")
          print(f"Teams: {data.get('team_count')}")
          print(f"Teams with stats: {data.get('teams_with_stats')}")
          print()
          print("Category team counts:")

          for category, count in data.get(
              "category_team_counts",
              {}
          ).items():
              print(f"  {category}: {count}")

          print()
          print("Teams:")

          for team in data.get("teams", []):
              categories = ", ".join(
                  team.get("categories", [])
              )

              if not categories:
                  categories = "NO CATEGORIES"

              print(
                  f"  {team.get('team')} - "
                  f"{team.get('player_count')} players - "
                  f"{categories}"
              )
          PY

      - name: Commit updated team stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/stats/2026/teams.json

          if git diff --cached --quiet; then
            echo "No team stats changes detected."
            exit 0
          fi

          git commit -m "Update NAL 2026 Team Stats"
          git push
