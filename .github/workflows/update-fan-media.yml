name: Update Fan Media

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-fan-media:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test Monday fan media connection
        env:
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
        run: python scripts/update_fan_media.py
