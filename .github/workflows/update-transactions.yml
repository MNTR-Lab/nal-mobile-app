name: Update Transactions

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update-transactions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch NAL transactions
        env:
          DIGITALSHIFT_AUTH_TICKET: ${{ secrets.DIGITALSHIFT_AUTH_TICKET }}
        run: python scripts/update_transactions.py

      - name: Show generated transactions
        run: |
          echo "----- data/transactions.json -----"
          cat data/transactions.json

      - name: Commit transactions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/transactions.json

          if git diff --cached --quiet; then
            echo "No transaction changes to commit."
          else
            git commit -m "Update NAL transactions"
            git push
          fi
