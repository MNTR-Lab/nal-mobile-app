name: Update NAL News

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Fetch latest NAL news
        run: python scripts/update_news.py

      - name: Show generated news feed
        run: cat data/news.json

      - name: Save updated news feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json

          if git diff --cached --quiet; then
            echo "No news changes to commit."
          else
            git commit -m "Update NAL news feed"
            git push
          fi
