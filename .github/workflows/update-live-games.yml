name: Update Live Games

on:
  workflow_dispatch:

  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update-live-games:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Lightcast live events
        env:
          LIGHTCAST_PUEBLO_API_KEY: ${{ secrets.PUEBLO_PUNISHERS_LIVE }}
        run: python scripts/update_live_games.py

      - name: Show generated live games
        run: |
          echo "----- data/live-games.json -----"
          cat data/live-games.json

      - name: Commit live games
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/live-games.json

          if git diff --cached --quiet; then
            echo "No live game changes to commit."
          else
            git commit -m "Update Lightcast live games"
            git push
          fi
