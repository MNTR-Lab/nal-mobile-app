<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#061426">
  <title>NAL Latest News</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #061426;
      font-family: Arial, Helvetica, sans-serif;
    }

    .news-page {
      width: 100%;
      height: 100dvh;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #061426;
    }

    .news-bar {
      flex: 0 0 auto;
      height: 52px;
      padding: env(safe-area-inset-top) 14px 0;
      display: flex;
      align-items: center;
      gap: 12px;
      background: #061426;
      border-bottom: 3px solid #d71920;
      color: #fff;
    }

    .back-button {
      appearance: none;
      border: 0;
      background: transparent;
      color: #fff;
      padding: 8px 6px 8px 0;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .news-title {
      margin: 0;
      font-size: 16px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: .5px;
      text-transform: uppercase;
    }

    .frame-wrap {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      background: #fff;
    }

    .news-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }
  </style>
</head>
<body>
  <main class="news-page">
    <header class="news-bar">
      <button class="back-button" id="backButton" type="button" aria-label="Go back">‹ BACK</button>
      <h1 class="news-title">Latest News</h1>
    </header>

    <div class="frame-wrap">
      <iframe
        class="news-frame"
        src="https://www.thenationalarenaleague.com/news"
        title="National Arena League Latest News"
        loading="eager"
        referrerpolicy="no-referrer-when-downgrade"
        allow="fullscreen"
      ></iframe>
    </div>
  </main>

  <script>
    document.getElementById("backButton").addEventListener("click", function () {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = "index.html";
      }
    });
  </script>
</body>
</html>
