*{box-sizing:border-box}
body{margin:0;background:#07101f;color:white;font:16px system-ui,sans-serif}

iframe{width:100%;flex:1;min-height:0;border:0;background:#07101f}
nav{display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom);border-top:1px solid #37445b}
button,a{font:inherit;color:inherit}

dialog::backdrop{background:#040915a8}
.sheet-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
h2{margin:0;font-size:22px}
.close,.destination{background:#202d46;border:1px solid #43516b;border-radius:9px;cursor:pointer}
.close{padding:7px 12px}
.destination{display:block;text-align:left;width:100%;padding:12px;margin-top:8px;text-decoration:none}
.destination small{display:block;margin-top:2px;color:#c9d5e8}

.social-page[hidden],iframe[hidden]{display:none}
.social-page h1{margin:0;border-bottom:3px solid #e31b23;padding-bottom:12px}
.social-page article{margin:12px 0;padding:12px;background:#152640;border:1px solid #37445b;border-radius:10px}
.social-page article img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:6px;margin-bottom:8px}
.social-page article button,.social-page article a{display:block;margin-top:8px}
.social-team-grid,.social-channels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.social-team-card,.social-channel{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border:1px solid #43516b;border-radius:9px;background:#152640;text-align:center;text-decoration:none;cursor:pointer}
.social-team-card{flex-direction:column;border-bottom:3px solid var(--team-color,#e31b23);font-weight:700}
.social-team-card img{width:70px;height:62px;object-fit:contain}
.social-team-card small{color:#c9d5e8}
.social-player{margin:auto}
.social-player iframe,.social-player video{width:100%;aspect-ratio:16/9;display:block}

function socialChannelLinks(accounts) {
  return Object.entries(accounts).flatMap(([platform, url]) => {
    if (!url || !platformNames[platform]) return [];
    const link = document.createElement('a');
    link.className = 'social-channel';
    link.textContent = platformNames[platform] + ' ↗';
    link.href = url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    return [link];
  });
}

function renderSocialDirectory() {
  const dialog = document.getElementById('social-team-dialog');
  document.getElementById('social-league-channels').replaceChildren(...socialChannelLinks(leagueChannels));
  document.getElementById('social-team-grid').replaceChildren(...socialTeams.map(team => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'social-team-card';
    button.setAttribute('aria-haspopup', 'dialog');
    button.style.setProperty('--team-color', teamColors[team.slug]?.[1] || '#e31b23');
    const logo = document.createElement('img');
    logo.src = team.logo;
    logo.alt = '';
    logo.loading = 'lazy';
    const name = document.createElement('span');
    name.textContent = team.name;
    const label = document.createElement('small');
    label.textContent = 'Social accounts';
    button.append(logo, name, label);
    button.addEventListener('click', () => {
      document.getElementById('social-team-title').textContent = team.name;
      const links = socialChannelLinks(team.accounts);
      const host = document.getElementById('social-team-links');
      host.replaceChildren(...links);
      if (!links.length) host.textContent = 'Official social accounts are coming soon.';
      dialog.showModal();
    });
    return button;
  }));
}

function httpsUrl(raw) {
  try {
    const url = new URL(raw);
    return url.protocol === 'https:' ? url : null;
  } catch {
    return null;
  }
}

function youtubeId(url) {
  const host = url.hostname.replace(/^(www\.|m\.)/, '');
  const id = host === 'youtu.be' ? url.pathname.split('/')[1]
    : host === 'youtube.com' ? url.searchParams.get('v') || url.pathname.match(/^\/(?:shorts|embed|live)\/([^/]+)/)?.[1] : '';
  return /^[\w-]{11}$/.test(id || '') ? id : '';
}

function playSocialVideo(item, youtube) {
  document.getElementById('social-video-title').textContent = item.title || 'NAL video';
  const media = document.createElement(youtube ? 'iframe' : 'video');
  if (youtube) {
    media.src = 'https://www.youtube-nocookie.com/embed/' + youtube;
    media.title = item.title || 'NAL video';
    media.allow = 'encrypted-media; picture-in-picture';
    media.allowFullscreen = true;
  } else {
    media.src = socialApi + '/stream?id=' + encodeURIComponent(item.id);
    media.controls = true;
    media.playsInline = true;
  }
  socialMedia.replaceChildren(media);
  socialPlayer.showModal();
}

socialPlayer.addEventListener('close', () => socialMedia.replaceChildren());

async function loadSocial() {
  socialPosts.textContent = 'Loading the latest posts…';
  try {
    const response = await fetch(socialApi + '/social', {cache: 'no-store'});
    const feed = await response.json();
    if (!response.ok || !feed.ok || !Array.isArray(feed.videos)) throw new Error('Social feed unavailable');
    const posts = feed.videos.filter(item => item.status === 'Published'
      && String(item.team || '').split(/[,;]+/).some(team => team.trim() === 'Social Page')
      && /^\d{4}-\d{2}-\d{2}$/.test(item.publishDate || '') && httpsUrl(item.playbackUrl))
      .sort((a, b) => b.publishDate.localeCompare(a.publishDate)).slice(0, 6);
    socialPosts.replaceChildren(...posts.map(item => {
      const card = document.createElement('article');
      const thumbnail = httpsUrl(item.thumbnailUrl);
      if (thumbnail) {
        const image = document.createElement('img');
        image.src = thumbnail.href;
        image.alt = '';
        image.loading = 'lazy';
        card.append(image);
      }
      const title = document.createElement('strong');
      title.textContent = item.title || 'NAL Quick Hit';
      card.append(title);
      const url = httpsUrl(item.playbackUrl);
      const youtube = youtubeId(url);
      const external = /(^|\.)(facebook\.com|fb\.watch|instagram\.com|tiktok\.com|x\.com|twitter\.com|threads\.net|threads\.com|youtube\.com|youtu\.be)$/.test(url.hostname);
      const action = document.createElement(external && !youtube ? 'a' : 'button');
      action.className = 'close';
      if (external && !youtube) {
        action.textContent = 'Open original post ↗';
        action.href = url.href;
        action.target = '_blank';
        action.rel = 'noopener noreferrer';
      } else {
        action.type = 'button';
        action.textContent = 'Watch in app';
        action.onclick = () => playSocialVideo(item, youtube);
      }
      card.append(action);
      return card;
    }));
    if (!posts.length) socialPosts.textContent = 'New social posts are coming soon.';
    socialLoaded = true;
  } catch {
    socialPosts.textContent = 'Social posts are temporarily unavailable.';
    const retry = document.createElement('button');
    retry.className = 'close';
    retry.textContent = 'Try again';
    retry.onclick = loadSocial;
    socialPosts.append(' ', retry);
  }
}

function openScreen(screen, tab) {
  if (screen === 'social') {
    app.hidden = true;
    socialPage.hidden = false;
    selectTab(tab);
    if (!document.getElementById('social-team-grid').childElementCount) renderSocialDirectory();
    if (!socialLoaded) loadSocial();
    return;
  }
  const control = app.contentDocument?.querySelector('.bottom-nav ' + screens[screen])
    || app.contentDocument?.querySelector(screens[screen]);
  if (!control) return;
  socialPage.hidden = true;
  app.hidden = false;
  control.click();
  selectTab(tab);
}

  const detail = doc.getElementById('teamPage');
  const name = doc.getElementById('teamHeroName');
  if (!directory || !detail || !name) return;
  const styles = doc.createElement('style');
  styles.textContent = teamStyles;
  doc.head.append(styles);

  doc.querySelector('#teamsPage h1').textContent = 'OUR TEAMS';
  doc.querySelector('#teamsPage .teams-directory-head p').textContent = 'Find your team. Follow every moment.';

  function updateCards() {
    for (const card of directory.querySelectorAll('.teams-directory-card')) {
      if (card.querySelector('.teams-card-action')) continue;
      const logo = card.querySelector('.teams-directory-logo img');
      if (!logo) continue;
      const colors = teamColors[teamSlug(logo.alt)];
      if (colors) {
        card.style.setProperty('--card-primary', colors[0]);
        card.style.setProperty('--card-accent', colors[1]);
      }
      const watermark = logo.cloneNode();
      watermark.className = 'teams-card-watermark';
      watermark.alt = '';
      watermark.setAttribute('aria-hidden', 'true');
      card.prepend(watermark);
      const action = doc.createElement('span');
      action.className = 'teams-card-action';
      action.textContent = 'VIEW TEAM →';
      card.append(action);
    }
  }

  function updateDetail() {
    const slug = teamSlug(name.textContent);
    if (!teamColors[slug]) return;
    detail.dataset.websiteTeam = slug;
    const logo = doc.getElementById('teamHeroLogo');
    if (logo?.getAttribute('src')) {
      detail.style.setProperty('--website-team-logo', 'url(' + JSON.stringify(logo.src) + ')');
    }
  }

  const gridObserver = new MutationObserver(updateCards);
  gridObserver.observe(directory, {childList: true});
  const nameObserver = new MutationObserver(updateDetail);
  nameObserver.observe(name, {childList: true, characterData: true, subtree: true});
  updateCards();
  updateDetail();
}

app.addEventListener('load', () => {
  if (app.contentDocument) matchNetworkTeams(app.contentDocument);
  const appDocument = app.contentDocument;
  const home = appDocument?.getElementById('homePage');
  if (home && !home.querySelector('.preview-news-ticker')) {
    const ticker = appDocument.createElement('section');
    ticker.className = 'preview-news-ticker';
    ticker.setAttribute('aria-label', 'NAL news ticker');
    ticker.style.cssText = 'position:relative;height:34px;overflow:hidden;background:#06172b;border-top:3px solid #e31b23';
    const overlay = appDocument.createElement('iframe');
    overlay.title = 'Latest NAL news and announcements';
    overlay.tabIndex = -1;
    overlay.referrerPolicy = 'strict-origin-when-cross-origin';
    overlay.src = 'https://app.overlays.uno/output/4EmoGILY2NbR023pU403k1';
    // Crop the lower 7.6% of the 960 × 540 UNO output, as on NAL Network.
    const scale = 28 / (540 * 0.076);
    overlay.style.cssText = 'position:absolute;left:0;width:960px;height:540px;max-width:none;border:0;pointer-events:none;transform-origin:0 0';
    overlay.style.transform = 'scaleY(' + scale + ')';
    overlay.style.top = (3 - 540 * 0.924 * scale) + 'px';
    ticker.append(overlay);
    home.prepend(ticker);
  }
  const footer = app.contentDocument?.querySelector('.bottom-nav');
  if (footer) footer.hidden = true;
  if (footer) footer.style.setProperty('display', 'none', 'important');
});

tabs.forEach(button => button.addEventListener('click', () => {
  const key = button.dataset.tab;
  const menu = menus[key];
  if (!menu) {
    openScreen(key, key);
    return;
  }
  const [title, items] = menu;
  document.getElementById('sheet-title').textContent = title;
  destinations.replaceChildren(...items.map(([label, description, target]) => {
    const external = target.startsWith('https:');
    const item = document.createElement(external ? 'a' : 'button');
    item.className = 'destination';
    item.textContent = label;
    const detail = document.createElement('small');
    detail.textContent = description;
    item.append(detail);
    if (external) {
      item.href = target;
      item.target = '_blank';
      item.rel = 'noopener';
    } else {
      item.type = 'button';
      item.addEventListener('click', () => {
        sheet.close();
        openScreen(target, key);
      });
    }
    return item;
  }));
  sheet.showModal();
}));
</script>
</html>
