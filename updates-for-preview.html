<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAL Network on MNTR+</title>
<style>
html,body{margin:0;padding:0;}
body{background:#071522;}
*{box-sizing:border-box;}
</style>
<style>
.nal-watch-anywhere{
  margin:42px 0 8px;
  padding:0 14px 28px;
}
.nal-watch-anywhere-inner{
  background:linear-gradient(145deg,#071522 0%,#0b2235 55%,#101820 100%);
  border:1px solid rgba(255,255,255,.10);
  border-radius:18px;
  padding:34px 28px 30px;
  text-align:center;
  box-shadow:0 14px 36px rgba(0,0,0,.18);
}
.nal-watch-mntr-logo{
  display:block;
  max-width:118px;
  max-height:46px;
  object-fit:contain;
  margin:0 auto 18px;
}
.nal-watch-eyebrow{
  font-size:12px;
  font-weight:900;
  letter-spacing:2.2px;
  color:#e2232a;
  margin-bottom:7px;
}
.nal-watch-anywhere h2{
  margin:0;
  color:#fff;
  font-size:27px;
  line-height:1.12;
  font-weight:950;
  letter-spacing:-.4px;
}
.nal-watch-copy{
  margin:10px auto 24px;
  max-width:650px;
  color:rgba(255,255,255,.70);
  font-size:14px;
  line-height:1.5;
}
.nal-platform-grid{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:10px;
  max-width:930px;
  margin:0 auto 24px;
}
.nal-platform-card{
  min-height:116px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:12px;
  background:rgba(255,255,255,.055);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:14px 8px;
  color:#fff;
  text-decoration:none;
}
.nal-platform-link{
  cursor:pointer;
  transition:transform .15s ease,border-color .15s ease,background .15s ease;
}
.nal-platform-link:hover{
  transform:translateY(-2px);
  border-color:rgba(255,255,255,.30);
  background:rgba(255,255,255,.09);
}
.nal-platform-icon{
  height:32px;
  min-width:32px;
  padding:0 7px;
  border:1px solid rgba(255,255,255,.22);
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:9px;
  font-size:14px;
  font-weight:900;
  color:#fff;
}
.nal-platform-card strong{
  font-size:12px;
  line-height:1.15;
  letter-spacing:.45px;
}
.nal-platform-card span{
  margin-top:4px;
  color:rgba(255,255,255,.55);
  font-size:10px;
}
.nal-watch-download{
  display:inline-flex;
  min-height:42px;
  align-items:center;
  justify-content:center;
  padding:0 22px;
  border-radius:7px;
  background:#e2232a;
  color:#fff !important;
  text-decoration:none;
  font-size:12px;
  font-weight:950;
  letter-spacing:.6px;
}
.nal-watch-tagline{
  margin-top:22px;
  color:rgba(255,255,255,.45);
  font-size:10px;
  font-weight:800;
  letter-spacing:1.6px;
}
@media(max-width:800px){
  .nal-platform-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
  .nal-platform-card:last-child{grid-column:1 / -1;}
  .nal-watch-anywhere h2{font-size:22px;}
}
@media(max-width:480px){
  .nal-watch-anywhere{padding-left:8px;padding-right:8px;}
  .nal-watch-anywhere-inner{padding:28px 14px 24px;}
}
</style>
<style>
.nal-platform-grid.nal-platform-grid-four{
  grid-template-columns:repeat(4,minmax(0,1fr)) !important;
  max-width:940px;
}
.nal-platform-grid-four .nal-platform-card{
  min-height:132px;
}
.nal-brand-logo{
  height:38px;
  width:82px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:10px;
  color:#fff;
}
.nal-brand-logo svg{width:100%;height:100%;display:block}
.nal-brand-apple{width:40px}
.nal-brand-appletv{width:82px}
.nal-brand-word{
  height:38px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:10px;
  color:#fff;
  font-weight:950;
  line-height:1;
}
.nal-brand-roku{
  font-family:Arial,sans-serif;
  font-size:29px;
  letter-spacing:-1.8px;
}
.nal-brand-fire{
  font-family:Arial,sans-serif;
  font-size:25px;
  letter-spacing:-1px;
  text-transform:lowercase;
}
.nal-brand-fire span{
  font-weight:500;
  margin-left:3px;
}
.nal-platform-grid-four .nal-platform-card span{
  font-size:9px;
  letter-spacing:.35px;
}
.nal-platform-search{
  cursor:default;
}
.nal-watch-download{display:none !important}
@media(max-width:800px){
  .nal-platform-grid.nal-platform-grid-four{
    grid-template-columns:repeat(2,minmax(0,1fr)) !important;
  }
  .nal-platform-card:last-child{grid-column:auto !important;}
}
</style>
<style>
/* Compact single-row platform treatment */
.nal-watch-anywhere-inner{
  padding:28px 28px 24px !important;
}
.nal-watch-copy{
  margin-bottom:18px !important;
}
.nal-platform-grid.nal-platform-grid-four{
  display:grid !important;
  grid-template-columns:repeat(4,minmax(0,1fr)) !important;
  gap:8px !important;
  max-width:760px !important;
  margin:0 auto 18px !important;
}
.nal-platform-grid-four .nal-platform-card{
  min-height:82px !important;
  padding:10px 6px !important;
  border-radius:9px !important;
}
.nal-brand-logo,
.nal-brand-word{
  height:24px !important;
  margin-bottom:5px !important;
}
.nal-brand-apple{
  width:25px !important;
}
.nal-brand-appletv{
  width:54px !important;
}
.nal-brand-roku{
  font-size:20px !important;
  letter-spacing:-1px !important;
}
.nal-brand-fire{
  font-size:18px !important;
}
.nal-platform-grid-four .nal-platform-card strong{
  font-size:10px !important;
}
.nal-platform-grid-four .nal-platform-card span{
  margin-top:2px !important;
  font-size:7.5px !important;
}
@media(max-width:650px){
  .nal-platform-grid.nal-platform-grid-four{
    grid-template-columns:repeat(4,minmax(0,1fr)) !important;
    gap:4px !important;
  }
  .nal-platform-grid-four .nal-platform-card{
    min-height:72px !important;
    padding:8px 2px !important;
  }
  .nal-brand-logo,
  .nal-brand-word{
    transform:scale(.82);
    margin-bottom:2px !important;
  }
  .nal-platform-grid-four .nal-platform-card strong{
    font-size:8px !important;
  }
  .nal-platform-grid-four .nal-platform-card span{
    font-size:6.5px !important;
  }
}
</style>
</head>
<body>

<div class="nal-watch-anywhere-inner">
<img alt="MNTR+" class="nal-watch-mntr-logo" src="https://cdn.shopify.com/s/files/1/0719/1966/5231/files/Watermark_Small_3b6b2c6f-797b-4d5c-a870-65cdda47fba9.png?v=1782385986"/>

<svg viewbox="0 0 82 28"><path d="M15.5 23.3c-1.2 1.2-2.5 1-3.8.4-1.3-.6-2.6-.6-4 0-1.8.8-2.7.5-3.8-.4C-2.1 17.1-1.2 7.6 5.7 7.2c1.7.1 2.8.9 3.8 1 1.5-.3 2.9-1.2 4.4-1 1.9.1 3.3.9 4.2 2.2-3.9 2.3-3 7.4.6 8.8-.7 1.9-1.6 3.7-3.2 5.1M9.3 7.1C9.1 4.3 11.4 2 14 1.8c.4 3.2-2.9 5.6-4.7 5.3" fill="currentColor"></path><text fill="currentColor" font-family="Arial,sans-serif" font-size="19" font-weight="700" x="23" y="21">tv</text></svg>

<span>SEARCH “MNTR+” ON ROKU</span>
</div>

</section>
</body>
</html>
