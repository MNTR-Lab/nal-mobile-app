<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#07172b">

<title>National Arena League</title>

<style>

/* =========================================================
   GLOBAL
========================================================= */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --nal-blue: #07172b;
  --nal-blue-light: #102b4e;
  --nal-red: #e31b23;
  --white: #ffffff;
  --light: #f3f5f7;
  --gray: #6d7682;
  --border: #dfe3e8;
  --black: #101419;

  --nav-height: 80px;
  --header-height: 72px;

  /*
     KEEP THIS AT 72PX.
     This is the approved FootballShift article crop.
  */
  --footballshift-crop: 72px;
}

html,
body {
  min-height: 100%;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: #d9dde2;
  color: var(--black);
}

button,
a {
  -webkit-tap-highlight-color: transparent;
}

button {
  font-family: inherit;
}

.app {
  width: 100%;
  max-width: 600px;
  min-height: 100vh;
  margin: 0 auto;
  background: var(--light);
  padding-bottom: var(--nav-height);
  position: relative;
  overflow-x: hidden;
}


/* =========================================================
   TOP HEADER
========================================================= */

.topbar {
  height: var(--header-height);

  padding:
    max(8px, env(safe-area-inset-top))
    17px
    8px;

  background: var(--nal-blue);

  display: grid;
  grid-template-columns: 50px 1fr 50px;
  align-items: center;

  border-bottom: 3px solid var(--nal-red);

  position: sticky;
  top: 0;

  z-index: 3000;
}

.header-left,
.header-right {
  display: flex;
  align-items: center;
}

.header-left {
  justify-content: flex-start;
}

.header-right {
  justify-content: flex-end;
}

.header-logo {
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
}

.nal-logo {
  width: 76px;
  height: 52px;
  object-fit: contain;
  display: block;
}

.header-button {
  width: 38px;
  height: 38px;

  border: 0;
  background: transparent;

  color: white;

  display: flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;
}

.header-button svg {
  width: 24px;
  height: 24px;

  stroke: currentColor;
  fill: none;

  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.notification-button {
  position: relative;
}

.notification-dot {
  width: 7px;
  height: 7px;

  background: var(--nal-red);

  border-radius: 50%;

  position: absolute;

  top: 5px;
  right: 4px;
}


/* =========================================================
   PAGE SYSTEM
========================================================= */

.app-page {
  display: none;
}

.app-page.active {
  display: block;
}


/* =========================================================
   SEASON X HERO
========================================================= */

.season-x-hero {
  min-height: 300px;

  position: relative;
  overflow: hidden;

  display: flex;
  align-items: center;
  justify-content: center;

  background-color: var(--nal-blue);

  background-image:
    url("https://cdn.shopify.com/s/files/1/0719/1966/5231/files/NAL_Network_-_Game_Image_2.jpg?v=1789843442");

  background-size: cover;
  background-position: center;
}

.season-x-hero::before {
  content: "";

  position: absolute;
  inset: 0;

  background:
    radial-gradient(
      ellipse at center,
      rgba(7,23,43,.94) 0%,
      rgba(7,23,43,.88) 22%,
      rgba(7,23,43,.70) 45%,
      rgba(7,23,43,.42) 68%,
      rgba(7,23,43,.18) 100%
    );

  z-index: 1;
}

.season-x-hero::after {
  content: "";

  position: absolute;
  inset: 0;

  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.12) 0%,
      rgba(0,0,0,0) 30%,
      rgba(0,0,0,0) 65%,
      rgba(7,23,43,.45) 100%
    );

  z-index: 2;
}

.hero-red-glow {
  position: absolute;

  width: 320px;
  height: 190px;

  left: 50%;
  top: 50%;

  transform: translate(-50%, -50%);

  background: rgba(227,27,35,.10);

  filter: blur(75px);

  border-radius: 50%;

  z-index: 2;

  pointer-events: none;
}

.hero-content {
  width: 100%;

  padding: 24px 20px 36px;

  position: relative;

  z-index: 4;

  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: center;

  text-align: center;
}

.hero-eyebrow {
  color: rgba(255,255,255,.90);

  font-size: 9px;
  font-weight: 900;

  letter-spacing: 2.4px;

  text-transform: uppercase;

  margin-bottom: 9px;

  text-shadow: 0 2px 8px rgba(0,0,0,.8);
}

.national-bowl-logo {
  width: 340px;
  max-width: 88%;

  height: auto;

  object-fit: contain;

  display: block;

  margin: 0 auto;

  filter:
    drop-shadow(
      0 8px 14px rgba(0,0,0,.65)
    );
}

.hero-tagline {
  margin-top: 10px;

  color: #ffffff;

  font-size: 11px;
  font-weight: 900;

  letter-spacing: 1.8px;

  text-transform: uppercase;

  text-align: center;

  text-shadow: 0 2px 8px rgba(0,0,0,.85);
}

.hero-accent-line {
  position: absolute;

  left: 50%;
  bottom: 17px;

  transform: translateX(-50%);

  width: 58px;
  height: 3px;

  background: var(--nal-red);

  border-radius: 10px;

  z-index: 5;
}


/* =========================================================
   GENERAL SECTIONS
========================================================= */

.section {
  background: white;

  margin-top: 9px;

  padding: 20px 17px;
}

.section-header {
  display: flex;

  justify-content: space-between;
  align-items: center;

  gap: 10px;

  margin-bottom: 15px;
}

.section-title {
  font-size: 15px;

  font-weight: 900;

  letter-spacing: .8px;

  text-transform: uppercase;

  color: var(--nal-blue);
}

.section-link {
  color: var(--nal-red);

  text-decoration: none;

  font-size: 10px;

  font-weight: 900;

  white-space: nowrap;
}


/* =========================================================
   NEXT GAMES
========================================================= */

.schedule-placeholder {
  border: 1px solid var(--border);

  border-radius: 14px;

  min-height: 105px;

  background:
    linear-gradient(
      135deg,
      #f7f8fa,
      #eef1f4
    );

  display: flex;

  align-items: center;
  justify-content: center;

  text-align: center;

  padding: 20px;
}

.schedule-placeholder-title {
  color: var(--nal-blue);

  font-size: 13px;

  font-weight: 900;

  letter-spacing: .5px;

  text-transform: uppercase;
}

.schedule-placeholder-text {
  margin-top: 6px;

  color: var(--gray);

  font-size: 11px;

  line-height: 1.45;
}


/* =========================================================
   NAL NETWORK
========================================================= */

.network-placeholder {
  height: 150px;

  border-radius: 14px;

  overflow: hidden;

  background:
    radial-gradient(
      circle at center,
      #234d77 0%,
      #102b4e 48%,
      #07172b 100%
    );

  position: relative;

  display: flex;

  align-items: center;
  justify-content: center;

  text-align: center;
}

.network-placeholder::after {
  content: "";

  position: absolute;

  left: 0;
  right: 0;
  bottom: 0;

  height: 4px;

  background: var(--nal-red);
}

.network-placeholder-title {
  color: white;

  font-size: 18px;

  font-weight: 900;

  letter-spacing: 1px;
}

.network-placeholder-text {
  margin-top: 6px;

  color: rgba(255,255,255,.70);

  font-size: 10px;

  font-weight: 700;

  letter-spacing: .6px;
}


/* =========================================================
   NEWS
========================================================= */

.news-section {
  padding-right: 0;
}

.news-section .section-header {
  padding-right: 17px;
}

.news-loading {
  margin-right: 17px;

  min-height: 170px;

  border-radius: 16px;

  background:
    linear-gradient(
      135deg,
      #102b4e,
      #07172b
    );

  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: center;

  gap: 12px;

  color: white;

  font-size: 9px;
  font-weight: 900;

  letter-spacing: 1px;

  text-transform: uppercase;
}

.news-loading-logo {
  width: 95px;
  opacity: .7;
}

.news-spinner {
  width: 22px;
  height: 22px;

  border: 3px solid rgba(255,255,255,.22);

  border-top-color: white;

  border-radius: 50%;

  animation: spin .8s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

.news-error {
  margin-right: 17px;

  padding: 24px 18px;

  border-radius: 14px;

  background: #f5f6f8;

  border: 1px solid var(--border);

  text-align: center;
}

.news-error-title {
  color: var(--nal-blue);

  font-size: 13px;
  font-weight: 900;

  text-transform: uppercase;
}

.news-error-text {
  margin-top: 6px;

  color: var(--gray);

  font-size: 10px;

  line-height: 1.4;
}


/* =========================================================
   LEAD STORY
========================================================= */

.lead-story {
  margin-right: 17px;

  min-height: 265px;

  border-radius: 16px;

  overflow: hidden;

  background: var(--nal-blue);

  text-decoration: none;

  display: block;

  position: relative;

  box-shadow:
    0 7px 20px rgba(0,0,0,.14);
}

.lead-story-image {
  position: absolute;

  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: cover;

  display: block;

  z-index: 1;
}

.lead-story-fallback {
  position: absolute;

  inset: 0;

  display: flex;

  align-items: center;
  justify-content: center;

  background:
    radial-gradient(
      circle at 50% 35%,
      #244d77 0%,
      #102b4e 42%,
      #07172b 100%
    );
}

.lead-story-fallback img {
  width: 180px;

  max-width: 55%;

  opacity: .45;

  filter:
    drop-shadow(
      0 8px 12px rgba(0,0,0,.4)
    );
}

.lead-story-overlay {
  position: absolute;

  inset: 0;

  background:
    linear-gradient(
      180deg,
      rgba(7,23,43,.02) 0%,
      rgba(7,23,43,.10) 30%,
      rgba(7,23,43,.55) 62%,
      rgba(7,23,43,.98) 100%
    );

  z-index: 2;
}

.lead-story-content {
  position: absolute;

  left: 0;
  right: 0;
  bottom: 0;

  z-index: 3;

  padding: 60px 18px 18px;
}

.story-category {
  display: inline-flex;

  align-items: center;

  min-height: 20px;

  padding: 4px 8px;

  border-radius: 4px;

  background: var(--nal-red);

  color: white;

  font-size: 8px;

  font-weight: 900;

  letter-spacing: .8px;

  text-transform: uppercase;

  margin-bottom: 8px;
}

.lead-story-title {
  color: white;

  font-size: 19px;

  line-height: 1.08;

  font-weight: 900;

  text-transform: uppercase;

  max-width: 480px;
}

.lead-story-subtitle {
  margin-top: 8px;

  color: rgba(255,255,255,.78);

  font-size: 10px;

  line-height: 1.35;

  max-width: 450px;

  display: -webkit-box;

  -webkit-line-clamp: 2;

  -webkit-box-orient: vertical;

  overflow: hidden;
}

.read-story {
  margin-top: 10px;

  color: white;

  font-size: 9px;

  font-weight: 900;

  letter-spacing: .7px;

  text-transform: uppercase;
}


/* =========================================================
   NEWS CARDS
========================================================= */

.news-scroll {
  display: flex;

  gap: 12px;

  overflow-x: auto;

  padding: 15px 17px 7px 0;

  scrollbar-width: none;

  scroll-snap-type: x mandatory;
}

.news-scroll::-webkit-scrollbar {
  display: none;
}

.news-card {
  min-width: 220px;
  width: 220px;

  border: 1px solid var(--border);

  border-radius: 14px;

  overflow: hidden;

  background: white;

  text-decoration: none;

  scroll-snap-align: start;

  box-shadow:
    0 3px 12px rgba(0,0,0,.06);
}

.news-card-image-wrap {
  height: 128px;

  position: relative;

  overflow: hidden;

  background: var(--nal-blue);
}

.news-card-image {
  position: relative;

  z-index: 2;

  width: 100%;
  height: 100%;

  object-fit: cover;

  display: block;
}

.news-card-fallback {
  position: absolute;

  inset: 0;

  z-index: 1;

  display: flex;

  align-items: center;
  justify-content: center;

  background:
    radial-gradient(
      circle at center,
      #234d77,
      #07172b 75%
    );
}

.news-card-fallback img {
  width: 105px;

  max-width: 55%;

  opacity: .45;
}

.news-card-body {
  padding: 11px 12px 13px;
}

.news-card-date {
  color: var(--nal-red);

  font-size: 8px;

  font-weight: 900;

  letter-spacing: .7px;

  text-transform: uppercase;

  margin-bottom: 6px;
}

.news-card-title {
  color: var(--nal-blue);

  font-size: 12px;

  line-height: 1.27;

  font-weight: 900;

  text-transform: uppercase;

  display: -webkit-box;

  -webkit-line-clamp: 3;

  -webkit-box-orient: vertical;

  overflow: hidden;
}

.swipe-hint {
  padding: 4px 17px 0 0;

  display: flex;

  align-items: center;
  justify-content: flex-end;

  gap: 5px;

  color: #9aa2ab;

  font-size: 8px;

  font-weight: 900;

  letter-spacing: .7px;

  text-transform: uppercase;
}

.swipe-hint svg {
  width: 14px;
  height: 14px;

  fill: none;

  stroke: currentColor;

  stroke-width: 2;

  stroke-linecap: round;
  stroke-linejoin: round;
}


/* =========================================================
   FUTURE SECTIONS
========================================================= */

.future-section {
  background: white;

  margin-top: 9px;

  padding: 20px 17px;
}

.future-placeholder {
  border: 1px dashed #cfd5dc;

  border-radius: 12px;

  padding: 22px 15px;

  text-align: center;

  color: #9aa2ab;

  font-size: 10px;

  font-weight: 800;
    letter-spacing: .5px;
}


/* =========================================================
   STANDARD PLACEHOLDER PAGES
========================================================= */

.placeholder-page {
  padding: 30px 18px;
}

.placeholder-card {
  min-height: 260px;

  border-radius: 18px;

  background: white;

  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: center;

  text-align: center;

  padding: 30px 20px;

  border: 1px solid var(--border);
}

.placeholder-card h2 {
  color: var(--nal-blue);

  font-size: 20px;

  font-weight: 900;

  text-transform: uppercase;
}

.placeholder-card p {
  color: var(--gray);

  font-size: 11px;

  line-height: 1.5;

  margin-top: 8px;

  max-width: 320px;
}


/* =========================================================
   SHOP PAGE
========================================================= */

.shop-page {
  background: white;

  height:
    calc(
      100dvh -
      var(--header-height) -
      var(--nav-height)
    );

  min-height: 450px;

  overflow: hidden;
}

.shop-toolbar {
  height: 58px;

  padding: 0 15px;

  border-bottom: 1px solid var(--border);

  background: white;

  display: grid;

  grid-template-columns: 1fr 42px;

  align-items: center;
}

.shop-title {
  color: var(--nal-blue);

  font-size: 13px;

  font-weight: 900;

  letter-spacing: .8px;
}

.shop-subtitle {
  margin-top: 2px;

  color: var(--gray);

  font-size: 7px;

  font-weight: 800;

  letter-spacing: .5px;
}

.shop-external {
  width: 38px;
  height: 38px;

  display: flex;

  align-items: center;
  justify-content: center;

  color: var(--nal-blue);

  text-decoration: none;
}

.shop-external svg {
  width: 20px;
  height: 20px;

  fill: none;

  stroke: currentColor;

  stroke-width: 2;
}

.shop-frame {
  width: 100%;

  height:
    calc(
      100% - 58px
    );

  border: 0;

  background: #f2f2f2;
}


/* =========================================================
   IN-APP ARTICLE PAGE
========================================================= */

.article-page {
  background: #ffffff;

  height:
    calc(
      100dvh -
      var(--header-height) -
      var(--nav-height)
    );

  min-height: 450px;

  overflow: hidden;
}


/* =========================================================
   ARTICLE TOOLBAR
========================================================= */

.article-toolbar {
  height: 54px;

  padding: 0 14px;

  background: #ffffff;

  border-bottom: 1px solid var(--border);

  display: grid;

  grid-template-columns: 42px 1fr 42px;

  align-items: center;

  position: relative;

  z-index: 20;
}

.article-back,
.article-external {
  width: 38px;
  height: 38px;

  border: 0;

  border-radius: 50%;

  background: transparent;

  color: var(--nal-blue);

  display: flex;

  align-items: center;
  justify-content: center;

  cursor: pointer;

  text-decoration: none;
}

.article-back svg,
.article-external svg {
  width: 20px;
  height: 20px;

  fill: none;

  stroke: currentColor;

  stroke-width: 2;

  stroke-linecap: round;
  stroke-linejoin: round;
}

.article-toolbar-center {
  text-align: center;
}

.article-toolbar-title {
  color: var(--nal-blue);

  font-size: 12px;

  font-weight: 900;

  letter-spacing: 1px;
}

.article-toolbar-subtitle {
  margin-top: 2px;

  color: var(--gray);

  font-size: 7px;

  font-weight: 800;

  letter-spacing: .7px;
}

.article-frame-container {
  position: relative;

  height:
    calc(
      100% - 54px
    );

  overflow: hidden;

  background: white;
}

.article-frame {
  position: absolute;

  left: 0;

  top:
    calc(
      -1 *
      var(--footballshift-crop)
    );

  width: 100%;

  height:
    calc(
      100% +
      var(--footballshift-crop)
    );

  border: 0;

  background: white;

  display: block;

  z-index: 2;
}

.article-loading {
  position: absolute;

  inset: 0;

  z-index: 10;

  background: white;

  display: flex;

  flex-direction: column;

  align-items: center;
  justify-content: center;

  gap: 12px;
}

.article-loading-logo {
  width: 100px;
}

.article-spinner {
  width: 25px;
  height: 25px;

  border: 3px solid #dfe3e8;

  border-top-color: var(--nal-red);

  border-radius: 50%;

  animation: spin .8s linear infinite;
}

/* =========================================================
   TEAM CONTENT VIEWER
========================================================= */

.article-page.team-content-mode .article-toolbar {
  border-bottom: 4px solid var(--viewer-accent, var(--nal-red));
}

.article-page.team-content-mode .article-back,
.article-page.team-content-mode .article-toolbar-title {
  color: var(--viewer-primary, var(--nal-blue));
}

.article-page.team-content-mode .article-toolbar-subtitle {
  color: var(--viewer-accent, var(--nal-red));
}

.article-page.team-content-mode .article-spinner {
  border-top-color: var(--viewer-accent, var(--nal-red));
}

.article-page.team-content-mode .article-loading-text {
  color: var(--viewer-primary, var(--nal-blue));
}


.article-loading-text {
  color: var(--nal-blue);

  font-size: 8px;

  font-weight: 900;

  letter-spacing: 1px;
}


/* =========================================================
   BOTTOM NAVIGATION
========================================================= */

.bottom-nav {
  position: fixed;

  left: 50%;
  bottom: 0;

  transform: translateX(-50%);

  width: 100%;
  max-width: 600px;

  height:
    calc(
      var(--nav-height) +
      env(safe-area-inset-bottom)
    );

  padding:
    8px 6px
    max(
      8px,
      env(safe-area-inset-bottom)
    );

  background: white;

  border-top: 1px solid #d7dce2;

  display: grid;

  grid-template-columns:
    repeat(
      5,
      1fr
    );

  align-items: center;

  z-index: 4000;

  box-shadow:
    0 -4px 16px rgba(0,0,0,.08);
}

.nav-button {
  border: 0;

  background: transparent;

  color: #727b85;

  display: flex;

  flex-direction: column;

  align-items: center;
  justify-content: center;

  gap: 4px;

  height: 60px;

  cursor: pointer;
}

.nav-button svg {
  width: 22px;
  height: 22px;

  fill: none;

  stroke: currentColor;

  stroke-width: 2;

  stroke-linecap: round;
  stroke-linejoin: round;
}

.nav-button span {
  font-size: 7px;

  font-weight: 900;

  letter-spacing: .25px;

  white-space: nowrap;
}

.nav-button.active {
  color: var(--nal-red);
}

.watch-button {
  position: relative;

  top: -15px;
}

.watch-icon {
  width: 54px;
  height: 54px;

  border-radius: 50%;

  background: var(--nal-red);

  color: white;

  display: flex;

  align-items: center;
  justify-content: center;

  box-shadow:
    0 5px 14px rgba(227,27,35,.35);

  border: 5px solid white;
}

.watch-icon svg {
  width: 23px;
  height: 23px;
}

.watch-button span {
  color: var(--nal-blue);

  margin-top: -1px;
}
/* =========================================================
   NAL TEAMS — HOME SCREEN
   ========================================================= */

.teams-scroll-wrap {
  width: 100%;
  overflow: hidden;
}

.teams-scroll {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  overflow-y: hidden;
  padding: 4px 16px 12px;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}

.teams-scroll::-webkit-scrollbar {
  display: none;
}

.team-home-card {
flex: 0 0 calc((100vw - 72px) / 3.5);
  scroll-snap-align: start;
  background: #ffffff;
  border: 1px solid #e1e5ea;
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
  box-shadow: 0 3px 10px rgba(0, 0, 0, 0.06);
  transition:
    transform 0.2s ease,
    box-shadow 0.2s ease,
    border-color 0.2s ease;
}

.team-home-card:active {
  transform: scale(0.97);
}

.team-home-logo-area {
  width: 100%;
  aspect-ratio: 1 / 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 14px;
  box-sizing: border-box;
  background:
    linear-gradient(
      145deg,
      #ffffff 0%,
      #f7f8fa 100%
    );
}

.team-home-logo {
  width: 100%;
  height: 100%;
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  object-position: center;
  display: block;
}

.team-home-name {
  min-height: 42px;
  padding: 9px 7px 10px;
  border-top: 3px solid var(--nal-red);
  background: var(--nal-blue);
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-size: 9px;
  line-height: 1.15;
  font-weight: 900;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  box-sizing: border-box;
}

.teams-swipe-hint {
  padding: 0 17px 3px;
  color: #7b8490;
  font-size: 9px;
  line-height: 1;
  font-weight: 900;
  letter-spacing: 1.3px;
  text-align: right;
  text-transform: uppercase;
}
/* =========================================================
   TEAM HOME PAGE
   Reusable Team Home styling
   ========================================================= */

.team-hero {
  position: relative;
  min-height: 315px;
  padding: 18px 20px 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background:
    radial-gradient(
      circle at center,
      rgba(255,255,255,.12) 0%,
      rgba(255,255,255,.04) 28%,
      rgba(0,0,0,.18) 58%,
      rgba(0,0,0,.42) 100%
    ),
    var(--team-primary, #07172b);
  border-bottom: 5px solid var(--team-accent, #e31b23);
}

.team-hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.08) 0%,
      rgba(0,0,0,.12) 55%,
      rgba(0,0,0,.42) 100%
    );
  pointer-events: none;
}

.team-back-button {
  position: absolute;
  top: 16px;
  left: 16px;
  z-index: 4;
  border: 1px solid rgba(255,255,255,.35);
  border-radius: 999px;
  padding: 8px 12px;
  background: rgba(0,0,0,.32);
  color: #ffffff;
  font-size: 9px;
  line-height: 1;
  font-weight: 900;
  letter-spacing: 1px;
  text-transform: uppercase;
  cursor: pointer;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

.team-hero-content {
  position: relative;
  z-index: 2;
  width: 100%;
  padding-top: 30px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

.team-league-label {
  margin-bottom: 12px;
  color: rgba(255,255,255,.82);
  font-size: 8px;
  line-height: 1;
  font-weight: 900;
  letter-spacing: 1.7px;
  text-transform: uppercase;
}

.team-hero-logo {
  width: 155px;
  height: 135px;
  object-fit: contain;
  object-position: center;
  display: block;
  margin-bottom: 8px;
  filter: drop-shadow(0 8px 12px rgba(0,0,0,.35));
}

.team-hero-name {
  margin: 0;
  color: #ffffff;
  font-size: 27px;
  line-height: 1;
  font-weight: 950;
  letter-spacing: .8px;
  text-transform: uppercase;
  text-shadow: 0 3px 8px rgba(0,0,0,.4);
}

.team-hero-location {
  margin-top: 7px;
  color: rgba(255,255,255,.80);
  font-size: 9px;
  line-height: 1;
  font-weight: 900;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.team-news-section {

}

}

.team-news-lead-description {

.team-news-read {

.team-news-scroll {

.team-news-scroll::-webkit-scrollbar {

}

.team-news-card {

}

.team-news-card-image-wrap {

.team-news-card-image {

  z-index: 2;
  width: 100%;

}

.team-news-card-fallback {
  position: absolute;
  inset: 0;
  z-index: 1;

  align-items: center;

.team-news-card-fallback img {

.team-news-card-body {

.team-news-card-date {

}

.team-news-card-title {
  color: var(--team-primary, #07172b);
  font-size: 11px;
  line-height: 1.25;
  font-weight: 950;

}

.team-news-swipe-hint {
  padding: 4px 16px 0 0;
  color: #8b949e;
  font-size: 8px;
  font-weight: 950;

  text-align: right;
  text-transform: uppercase;
