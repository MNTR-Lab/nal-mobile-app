/* =========================================================
   NATIVE NAL TRANSACTIONS
   Source: data/transactions/{season}.json
========================================================= */
(function(){
  const TRANSACTION_SEASONS = ["2026"];
  let transactionSeason = "2026";
  let transactionView = "all";
  let transactionTeam = "";
  let transactionData = [];
  let transactionLoadedSeason = "";

  const TEAM_SLUGS = {
    "amarillo warbirds":"amarillo-warbirds",
    "colorado spartans":"colorado-spartans",
    "dallas apex":"dallas-apex",
    "louisiana rouxgaroux":"louisiana-rouxgaroux",
    "omaha beef":"omaha-beef",
    "pueblo punishers":"pueblo-punishers",
    "salina liberty":"salina-liberty",
    "sioux city bandits":"sioux-city-bandits",
    "southwest kansas storm":"southwest-kansas-storm",
    "wheeling miners":"wheeling-miners"
  };

  function txEscape(value){
    if (typeof escapeHTML === "function") return escapeHTML(String(value ?? ""));
    return String(value ?? "")
      .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
      .replaceAll('"',"&quot;").replaceAll("'","&#039;");
  }

  function txNormalize(value){
    return String(value || "").trim().toLowerCase().replace(/\s+/g," ");
  }

  function txLogo(name, fallback){
    const slug = TEAM_SLUGS[txNormalize(name)] || "";
    if (slug && typeof TEAM_LOGO_OVERRIDES !== "undefined" && TEAM_LOGO_OVERRIDES[slug]) {
      return TEAM_LOGO_OVERRIDES[slug];
    }
    return fallback || (typeof NAL_LOGO !== "undefined" ? NAL_LOGO : "");
  }

  function txPerson(tx){
    return tx?.person?.name || tx?.coach?.name || "NAL TRANSACTION";
  }

  function txTeamName(tx){
    return tx?.team?.name || "NATIONAL ARENA LEAGUE";
  }

  function txDate(value){
    if (!value) return "";
    const parts = String(value).slice(0,10).split("-");
    if (parts.length !== 3) return String(value);
    const d = new Date(Date.UTC(Number(parts[0]), Number(parts[1])-1, Number(parts[2]), 12));
    if (Number.isNaN(d.getTime())) return String(value);
    return new Intl.DateTimeFormat("en-US",{month:"short",day:"numeric",year:"numeric",timeZone:"UTC"}).format(d).toUpperCase();
  }

  function txIsTrade(tx){
    return !!(tx?.traded_team?.name);
  }

  function txTeams(){
    const map = new Map();
    transactionData.forEach(tx => {
      if (tx?.team?.name && !map.has(tx.team.name)) {
        map.set(tx.team.name,{name:tx.team.name,logo:txLogo(tx.team.name,tx.team.logo)});
      }
      if (tx?.traded_team?.name && !map.has(tx.traded_team.name)) {
        map.set(tx.traded_team.name,{name:tx.traded_team.name,logo:txLogo(tx.traded_team.name,tx.traded_team.logo)});
      }
    });
    return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name));
  }

  function txCard(tx){
    const teamName = txTeamName(tx);
    const logo = txLogo(teamName,tx?.team?.logo);
    const trade = txIsTrade(tx);
    const tradedName = tx?.traded_team?.name || "";
    const tradedLogo = trade ? txLogo(tradedName,tx?.traded_team?.logo) : "";
    return `
      <article class="nal-transaction-card${trade ? " trade" : ""}">
        <div class="nal-transaction-cardbar"></div>
        <div class="nal-transaction-main">
          <div class="nal-transaction-logo"><img src="${txEscape(logo)}" alt="${txEscape(teamName)} logo"></div>
          <div>
            <div class="nal-transaction-date">${txEscape(txDate(tx?.date))}</div>
            <div class="nal-transaction-person">${txEscape(txPerson(tx))}</div>
            <div class="nal-transaction-team">${txEscape(teamName)}</div>
          </div>
        </div>
        ${trade ? `
          <div class="nal-transaction-trade">
            <div class="nal-transaction-trade-team"><img src="${txEscape(tradedLogo)}" alt=""><span>${txEscape(tradedName)}</span></div>
            <div class="nal-transaction-arrow">→</div>
            <div class="nal-transaction-trade-team"><img src="${txEscape(logo)}" alt=""><span>${txEscape(teamName)}</span></div>
          </div>` : ""}
        <div class="nal-transaction-desc">${txEscape(tx?.description || "Transaction")}</div>
      </article>`;
  }

  function renderTransactions(){
    const content = document.getElementById("nalTransactionsContent");
    if (!content) return;

    document.querySelectorAll("[data-transactions-view]").forEach(btn => {
      btn.classList.toggle("active",btn.dataset.transactionsView === transactionView);
    });

    if (!transactionData.length) {
      content.innerHTML = `<div class="nal-transactions-empty"><strong>NO TRANSACTIONS FOUND</strong>No ${txEscape(transactionSeason)} transaction records are currently available.</div>`;
      return;
    }

    let records = transactionData;
    let teamStrip = "";

    if (transactionView === "team") {
      const teams = txTeams();
      if (!transactionTeam && teams.length) transactionTeam = teams[0].name;
      records = transactionData.filter(tx =>
        tx?.team?.name === transactionTeam || tx?.traded_team?.name === transactionTeam
      );
      teamStrip = `<div class="nal-transactions-teamstrip">${teams.map(team => `
        <button type="button" class="nal-transactions-teamchoice${team.name===transactionTeam?" active":""}" data-transaction-team="${txEscape(team.name)}">
          <span class="nal-transactions-mini"><img src="${txEscape(team.logo)}" alt="${txEscape(team.name)} logo"></span>
          <small>${txEscape(team.name.replace(/^(Southwest Kansas|Sioux City|Louisiana|Colorado|Amarillo|Pueblo|Salina|Omaha|Wheeling|Dallas)\s+/,""))}</small>
        </button>`).join("")}</div>`;
    }

    content.innerHTML = `
      ${teamStrip}
      <div class="nal-transactions-summary">
        <b>${transactionView==="team" ? txEscape(transactionTeam) : txEscape(transactionSeason+" TRANSACTIONS")}</b>
        <span>${records.length} RECORD${records.length===1?"":"S"}</span>
      </div>
      ${records.length ? records.map(txCard).join("") :
        `<div class="nal-transactions-empty"><strong>NO TRANSACTIONS</strong>No records were found for this team.</div>`}
    `;
  }

  async function loadTransactions(season=transactionSeason){
    transactionSeason = String(season || "2026");
    const content = document.getElementById("nalTransactionsContent");
    if (content) content.innerHTML = `<div class="nal-transactions-empty"><strong>LOADING TRANSACTIONS</strong>Connecting to the ${txEscape(transactionSeason)} NAL transaction archive…</div>`;

    if (transactionLoadedSeason === transactionSeason && transactionData.length) {
      renderTransactions();
      return;
    }

    try {
      const response = await fetch(`data/transactions/${encodeURIComponent(transactionSeason)}.json?v=${Date.now()}`,{cache:"no-store"});
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const payload = await response.json();
      transactionData = Array.isArray(payload?.transactions) ? payload.transactions : [];
      transactionLoadedSeason = transactionSeason;
      if (transactionView !== "team") transactionTeam = "";
      renderTransactions();
    } catch (error) {
      console.error("Unable to load NAL transactions:",error);
      transactionData = [];
      if (content) content.innerHTML = `<div class="nal-transactions-empty"><strong>TRANSACTIONS UNAVAILABLE</strong>The ${txEscape(transactionSeason)} archive could not be loaded. Please try again.</div>`;
    }
  }

  document.addEventListener("click",event=>{
    const view = event.target.closest("[data-transactions-view]");
    if (view) {
      transactionView = view.dataset.transactionsView || "all";
      renderTransactions();
      return;
    }
    const team = event.target.closest("[data-transaction-team]");
    if (team) {
      transactionTeam = team.dataset.transactionTeam || "";
      renderTransactions();
    }
  });

  document.getElementById("nalTransactionsSeason")?.addEventListener("change",event=>{
    loadTransactions(event.target.value);
  });

  window.openNalTransactions = function(teamName=""){
    const requested = String(teamName || "").trim();
    if (requested) {
      transactionView = "team";
      transactionTeam = requested;
    }
    if (typeof showPage === "function") showPage("transactionsPage");
    const afterLoad = loadTransactions(transactionSeason);
    Promise.resolve(afterLoad).then(()=>{
      if (requested) {
        transactionView = "team";
        transactionTeam = requested;
        renderTransactions();
      }
      window.scrollTo({top:0,left:0,behavior:"instant"});
    });
    return afterLoad;
  };
  window.renderNalTransactions = renderTransactions;
})();


/* =========================================================
   NATIVE NAL STATS
   Sources:
   data/stats/{season}/leaders.json
   data/stats/{season}/players.json
   data/stats/{season}/teams.json
========================================================= */
(function(){
  let statsSeason="2026", statsView="leaders", leaderSection="Passing", leaderCategory="";
  let playerCategory="all", playerSearch="", teamCategory="passing", teamId="";
  let leadersData=null, playersData=null, teamsData=null, loadedSeason="";
  const STAT_ORDER=["passing","rushing","receiving","offensive","defensive","returning","kicking"];
  const STAT_LABELS={passing:"Passing",rushing:"Rushing",receiving:"Receiving",offensive:"Offensive",defensive:"Defensive",returning:"Returning",kicking:"Kicking"};
  const TEAM_SLUGS_STATS={"amarillo warbirds":"amarillo-warbirds","colorado spartans":"colorado-spartans","dallas apex":"dallas-apex","louisiana rouxgaroux":"louisiana-rouxgaroux","omaha beef":"omaha-beef","pueblo punishers":"pueblo-punishers","salina liberty":"salina-liberty","sioux city bandits":"sioux-city-bandits","southwest kansas storm":"southwest-kansas-storm","wheeling miners":"wheeling-miners"};
  function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
  function norm(v){return String(v||"").trim().toLowerCase().replace(/\s+/g," ")}
  function logo(name,fallback=""){const slug=TEAM_SLUGS_STATS[norm(name)]||"";return (slug&&typeof TEAM_LOGO_OVERRIDES!=="undefined"&&TEAM_LOGO_OVERRIDES[slug])||fallback||(typeof NAL_LOGO!=="undefined"?NAL_LOGO:"")}
  function shortTeam(name){return String(name||"").replace(/^(Southwest Kansas|Sioux City|Louisiana|Colorado|Amarillo|Pueblo|Salina|Omaha|Wheeling|Dallas)\s+/,"")}
  function pretty(k){return String(k||"").replaceAll("_"," ").replace(/\b\w/g,c=>c.toUpperCase()).replace("Pct","%").replace("Yds","Yds").replace("Gp","GP").replace("Td","TD").replace("Pat","PAT").replace("Fg","FG")}
  function teamForPlayer(p){return p?.teams?.[0]?.team||"NAL"}
  function render(){
    document.querySelectorAll("[data-stats-view]").forEach(b=>b.classList.toggle("active",b.dataset.statsView===statsView));
    if(statsView==="leaders") renderLeaders(); else if(statsView==="players") renderPlayers(); else renderTeams();
  }
  function renderLeaders(){
    const c=document.getElementById("nalStatsContent"); if(!c)return;
    const sections=Array.isArray(leadersData?.sections)?leadersData.sections:[];
    if(!sections.length){c.innerHTML='<div class="nal-stats-empty"><strong>NO LEAGUE LEADERS</strong>No leader data is available for this season.</div>';return}
    if(!sections.some(x=>x.name===leaderSection)) leaderSection=sections[0].name;
    const section=sections.find(x=>x.name===leaderSection)||sections[0], cats=section.categories||[];
    if(!cats.some(x=>x.name===leaderCategory)) leaderCategory=cats[0]?.name||"";
    const cat=cats.find(x=>x.name===leaderCategory)||cats[0], leaders=cat?.leaders||[];
    const sectionPills=sections.map(x=>`<button class="nal-stats-pill${x.name===leaderSection?' active':''}" data-leader-section="${esc(x.name)}">${esc(x.name)}</button>`).join("");
    const catPills=cats.map(x=>`<button class="nal-stats-pill${x.name===leaderCategory?' active':''}" data-leader-category="${esc(x.name)}">${esc(x.name)}</button>`).join("");
    const first=leaders[0];
    let cards="";
    if(first){const img=first.player_image||logo(first.team,first.source_team_logo);cards+=`<article class="nal-leader-feature"><div class="nal-leader-rank"><img class="${first.player_image?'player-photo':''}" src="${esc(img)}" alt=""></div><div><div class="nal-leader-name">${esc(first.name)}</div><div class="nal-leader-team">#${esc(first.number)}${first.position?' • '+esc(first.position):''} • ${esc(first.team)}</div></div><div class="nal-leader-value">${esc(first.value)}<small>${esc(first.unit||cat.unit||"")}</small></div></article>`}
    cards+=leaders.slice(1).map(p=>`<article class="nal-leader-row"><div class="nal-leader-row-rank">${esc(p.rank)}</div><div class="nal-leader-row-logo"><img src="${esc(logo(p.team,p.source_team_logo))}" alt=""></div><div><div class="nal-leader-row-name">${esc(p.name)}</div><div class="nal-leader-row-team">${esc(p.team)}</div></div><div class="nal-leader-row-value">${esc(p.value)}<small>${esc(p.unit||cat?.unit||"")}</small></div></article>`).join("");
    c.innerHTML=`<div class="nal-stats-pills">${sectionPills}</div><div class="nal-stats-pills">${catPills}</div><div class="nal-stats-sectionhead"><b>${esc(cat?.name||leaderSection)}</b><span>TOP ${leaders.length}<br>REGULAR SEASON</span></div>${cards}`;
  }
  function filteredPlayers(){let a=Array.isArray(playersData?.players)?playersData.players:[]; if(playerCategory!=="all")a=a.filter(p=>(p.categories||[]).includes(playerCategory)); const q=norm(playerSearch); if(q)a=a.filter(p=>norm(p.name).includes(q)||norm(teamForPlayer(p)).includes(q)||String(p.number||"").includes(q)); return a.sort((a,b)=>String(a.name).localeCompare(String(b.name)))}
  function statBoxes(row){const omit=new Set(["team_id","team","number","name","pos"]);return Object.entries(row||{}).filter(([k,v])=>!omit.has(k)&&v!==""&&v!=null).map(([k,v])=>`<div class="nal-stat-box"><b>${esc(v)}</b><small>${esc(pretty(k))}</small></div>`).join("")}
  function playerCard(p){const team=teamForPlayer(p);const details=(p.categories||[]).map(cat=>{const rows=p.stats?.[cat]||[];return rows.map(row=>`<div class="nal-player-category">${esc(STAT_LABELS[cat]||cat)}${row.team&&row.team!==team?' • '+esc(row.team):''}</div><div class="nal-stat-grid">${statBoxes(row)}</div>`).join("")}).join("");return `<article class="nal-player-card" data-player-card><button class="nal-player-summary" type="button" data-player-toggle><span class="nal-player-logo"><img src="${esc(logo(team))}" alt=""></span><span><span class="nal-player-name">${esc(p.name)}</span><span class="nal-player-meta">#${esc(p.number)} • ${esc(p.position||'—')} • ${esc(team)}</span></span><span class="nal-player-expand">+</span></button><div class="nal-player-detail">${details}</div></article>`}
  function renderPlayers(){const c=document.getElementById("nalStatsContent");if(!c)return;const players=filteredPlayers();c.innerHTML=`<div class="nal-stats-tools"><input id="nalPlayerSearch" class="nal-stats-search" type="search" placeholder="Search player or team" value="${esc(playerSearch)}"><select id="nalPlayerCategory" class="nal-stats-select"><option value="all">ALL STATS</option>${STAT_ORDER.map(x=>`<option value="${x}"${x===playerCategory?' selected':''}>${STAT_LABELS[x].toUpperCase()}</option>`).join("")}</select></div><div class="nal-stats-sectionhead"><b>PLAYER STATS</b><span>${players.length} PLAYER${players.length===1?'':'S'}</span></div>${players.length?players.map(playerCard).join(""):'<div class="nal-stats-empty"><strong>NO PLAYERS FOUND</strong>Try another player, team, or category.</div>'}`; const inp=document.getElementById("nalPlayerSearch");if(inp){inp.focus({preventScroll:true});inp.setSelectionRange(inp.value.length,inp.value.length)}}
  function teamRows(team,cat){return team?.stats?.[cat]||[]}
  function renderTeams(){const c=document.getElementById("nalStatsContent");if(!c)return;const teams=Array.isArray(teamsData?.teams)?teamsData.teams:[];if(!teams.length){c.innerHTML='<div class="nal-stats-empty"><strong>NO TEAM STATS</strong>No team statistics are available.</div>';return} if(!teamId)teamId=String((teams.find(t=>t.player_count>0)||teams[0]).team_id);const team=teams.find(t=>String(t.team_id)===String(teamId))||teams[0];const available=team.categories||[];if(!available.includes(teamCategory))teamCategory=available[0]||"passing";const rows=teamRows(team,teamCategory);const keys=rows.length?Object.keys(rows[0].stats||{}).filter(k=>!["number","name","pos"].includes(k)):[];const strip=teams.map(t=>`<button class="nal-team-choice${String(t.team_id)===String(team.team_id)?' active':''}" data-stats-team="${esc(t.team_id)}"><span class="nal-team-choice-logo"><img src="${esc(logo(t.team))}" alt=""></span><small>${esc(shortTeam(t.team))}</small></button>`).join("");const cats=STAT_ORDER.filter(x=>available.includes(x)).map(x=>`<button class="nal-stats-pill${x===teamCategory?' active':''}" data-team-category="${x}">${STAT_LABELS[x]}</button>`).join("");const table=rows.length?`<div class="nal-team-tablewrap"><table class="nal-team-table"><thead><tr><th>PLAYER</th>${keys.map(k=>`<th>${esc(pretty(k))}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr><td>#${esc(r.number)} ${esc(r.name)}</td>${keys.map(k=>`<td>${esc(r.stats?.[k]??'')}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`:`<div class="nal-stats-empty"><strong>NO ${esc((STAT_LABELS[teamCategory]||teamCategory).toUpperCase())} STATS</strong>No records are available for this category.</div>`;c.innerHTML=`<div class="nal-team-strip">${strip}</div><div class="nal-team-stats-banner"><img src="${esc(logo(team.team))}" alt=""><div><b>${esc(team.team)}</b><span>${team.player_count} PLAYER${team.player_count===1?'':'S'} WITH 2026 STATS</span></div></div>${available.length?`<div class="nal-stats-pills">${cats}</div>`:''}${team.player_count?table:'<div class="nal-stats-empty"><strong>NO 2026 STATS</strong>This team has no Regular Season statistics in the 2026 archive.</div>'}`}
  async function load(season=statsSeason){statsSeason=String(season||"2026");const c=document.getElementById("nalStatsContent");if(c)c.innerHTML='<div class="nal-stats-loading"><strong>LOADING STATS</strong>Connecting to the official NAL statistics archive…</div>';if(loadedSeason===statsSeason&&leadersData&&playersData&&teamsData){render();return}try{const base=`data/stats/${encodeURIComponent(statsSeason)}`;const stamp=Date.now();const [lr,pr,tr]=await Promise.all([fetch(`${base}/leaders.json?v=${stamp}`,{cache:"no-store"}),fetch(`${base}/players.json?v=${stamp}`,{cache:"no-store"}),fetch(`${base}/teams.json?v=${stamp}`,{cache:"no-store"})]);if(!lr.ok||!pr.ok||!tr.ok)throw new Error(`Stats HTTP ${lr.status}/${pr.status}/${tr.status}`);[leadersData,playersData,teamsData]=await Promise.all([lr.json(),pr.json(),tr.json()]);loadedSeason=statsSeason;render()}catch(e){console.error("Unable to load NAL stats:",e);if(c)c.innerHTML=`<div class="nal-stats-empty"><strong>STATS UNAVAILABLE</strong>The ${esc(statsSeason)} statistics archive could not be loaded. Please try again.</div>`}}
  document.addEventListener("click",e=>{const view=e.target.closest("[data-stats-view]");if(view){statsView=view.dataset.statsView;render();return}const sec=e.target.closest("[data-leader-section]");if(sec){leaderSection=sec.dataset.leaderSection;leaderCategory="";renderLeaders();return}const cat=e.target.closest("[data-leader-category]");if(cat){leaderCategory=cat.dataset.leaderCategory;renderLeaders();return}const pc=e.target.closest("[data-player-toggle]");if(pc){const card=pc.closest("[data-player-card]");if(card){card.classList.toggle("open");const ex=pc.querySelector(".nal-player-expand");if(ex)ex.textContent=card.classList.contains("open")?'−':'+'}return}const team=e.target.closest("[data-stats-team]");if(team){teamId=team.dataset.statsTeam;renderTeams();return}const tc=e.target.closest("[data-team-category]");if(tc){teamCategory=tc.dataset.teamCategory;renderTeams()}});
  document.addEventListener("input",e=>{if(e.target?.id==="nalPlayerSearch"){playerSearch=e.target.value;renderPlayers()}});
  document.addEventListener("change",e=>{if(e.target?.id==="nalPlayerCategory"){playerCategory=e.target.value;renderPlayers()}if(e.target?.id==="nalStatsSeason")load(e.target.value)});
  window.openNalStats=function(view="leaders",teamName=""){
    statsView=["leaders","players","teams"].includes(view)?view:"leaders";
    const requestedTeam=norm(teamName);
    if(requestedTeam && Array.isArray(teamsData?.teams)){

      if(match) teamId=String(match.team_id);
    }
    if(typeof showPage==="function")showPage("statsPage");
    const afterLoad=load(statsSeason);
    if(requestedTeam){
      Promise.resolve(afterLoad).then(()=>{
        const match=Array.isArray(teamsData?.teams)?teamsData.teams.find(t=>norm(t.team)===requestedTeam):null;
        if(match) teamId=String(match.team_id);
        statsView="teams";
        render();
        window.scrollTo({top:0,left:0,behavior:"instant"});
      });

    return afterLoad;

  window.renderNalStats=render;
