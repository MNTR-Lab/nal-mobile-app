<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NAL Network — Team Channels</title>
<style>
:root{--navy:#071b33;--navy2:#0b2748;--red:#d71920;--white:#fff;--muted:#aeb8c5;--line:rgba(255,255,255,.14)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#061426;color:#fff;font-family:Arial,Helvetica,sans-serif}
button{font:inherit}
.page{max-width:1500px;margin:0 auto;padding:28px 24px 60px}
.head{display:flex;align-items:end;justify-content:space-between;gap:20px;border-bottom:3px solid var(--red);padding-bottom:14px;margin-bottom:24px}
.head h1{margin:0;font-size:clamp(28px,4vw,48px);letter-spacing:.02em}
.head p{margin:6px 0 0;color:#c8d0da}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px}
.card{border:0;padding:0;background:transparent;color:#fff;text-align:left;cursor:pointer}
.card img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;border-radius:12px;border:1px solid var(--line);transition:.18s transform,.18s border-color}
.card:hover img,.card:focus-visible img{transform:translateY(-2px);border-color:#fff}
.card span{display:block;margin-top:8px;font-size:13px;font-weight:800;letter-spacing:.02em}
.modal[hidden]{display:none!important}
.modal{position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.86);overflow:auto;padding:24px}
.shell{max-width:1280px;margin:0 auto;background:#081a31;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.5)}
.bar{position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:16px;background:#061426;padding:14px 18px;border-bottom:1px solid var(--line)}
.bar h2{font-size:18px;margin:0}
.close{border:1px solid var(--line);background:#132a46;color:#fff;border-radius:999px;padding:9px 14px;cursor:pointer;font-weight:800}
.content{padding:20px}
.hero{margin-bottom:24px}
.hero img{width:100%;display:block;border-radius:12px;max-height:460px;object-fit:cover}
.section{margin:28px 0}
.section-head{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--red);padding-bottom:8px;margin-bottom:12px}
.section-head h3{margin:0;font-size:18px}
.row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.video{border:1px solid var(--line);background:#0d2440;color:#fff;border-radius:10px;overflow:hidden;padding:0;text-align:left;cursor:pointer}
.video img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#02070c}
.video strong{display:block;padding:10px 11px 4px;font-size:13px}
.video small{display:block;padding:0 11px 11px;color:var(--muted)}
.empty{grid-column:1/-1;padding:20px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);text-align:center}
.player{aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
.player iframe{width:100%;height:100%;border:0}
.back{margin:0 0 14px;border:0;background:transparent;color:#fff;font-weight:800;cursor:pointer;padding:0}
.status{color:var(--muted);font-size:12px;margin-top:8px}
@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}.row{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){.page{padding:20px 14px 40px}.grid{grid-template-columns:repeat(2,1fr);gap:12px}.row{grid-template-columns:1fr}.modal{padding:0}.shell{min-height:100vh;border-radius:0}.content{padding:14px}}
</style>
</head>
<body>
<main class="page">
  <div class="head">
    <div><h1>TEAM CHANNELS</h1><p>Get all your favorite team content in one place.</p></div>
  </div>
  <div class="grid" id="teamGrid"></div>
</main>

<div class="modal" id="teamModal" hidden>
  <div class="shell">
    <div class="bar"><h2 id="modalTitle">TEAM CHANNEL</h2><button class="close" id="closeModal" type="button">CLOSE ×</button></div>
    <div class="content" id="modalContent"></div>
  </div>
</div>

<script>
const API="https://qpavspvpdebtbbffdcmo.supabase.co/functions/v1/lightcast-catalog";
const TEAMS={
"amarillo-warbirds":{name:"AMARILLO WARBIRDS",banner:"https://cdn.shopify.com/s/files/1/0719/1966/5231/files/Amarillo_Warbirds3.png?v=1790256854",sources:{latest:{label:"LATEST GAMES (V.O.D.)",channelId:"72115",subId:"29680"},archives:{label:"ARCHIVES",channelId:"72121",subId:"30656"},coaches:{label:"COACHES' SHOW",channelId:"72123",subId:"30723"}}},
"colorado-spartans":{name:"COLORADO SPARTANS",banner:"https://cdn.shopify.com/s/files/1/0719/1966/5231/files/Colorado_Spartans_3c044d01-0658-40e9-be80-ce08e59945fc.png?v=1790208460",sources:{latest:{label:"LATEST GAMES (V.O.D.)",channelId:"72115",subId:"29681"},archives:{label:"ARCHIVES",channelId:"72121",subId:"30657"},coaches:{label:"COACHES' SHOW",channelId:"72123",subId:"30724"}}},
"dallas-apex":{name:"DALLAS APEX",banner:"https://cdn.shopify.com/s/files/1/0719/1966/5231/files/Dallas_Apex_da6cbdd6-f226-4a20-8e83-34317cd45e5e.png?v=1790208460",sources:{latest:{label:"LATEST GAMES (V.O.D.)",channelId:"72115",subId:"30550"},archives:{label:"ARCHIVES",channelId:"72121",subId:"30665"},coaches:{label:"COACHES' SHOW",channelId:"72123",subId:"30726"}}},
"louisiana-rouxgaroux":{name:"LOUISIANA ROUXGAROUX",banner:"https://cdn.shopify.com/s/files/1/0719/1966/5231/files/Louisiana_Rougaroux.png?v=1789958784",sources:{latest:{label:"LATEST GAMES (V.O.D.)",channelId:"72115",subId:"29682"},archives:{label:"ARCHIVES",channelId:"72121",subId:"30664"},coaches:{label:"COACHES' SHOW",channelId:"72123",subId:"30727"}}},
"omaha-beef":{name:"OMAHA BEEF",banner:"https://cdn.shopify.com/s/files/1/0719/1966/5231/files/Omaha_Beef_9853fbad-f3a0-49d6-9a8f-aaa1a85b28f8.png?v=1790208460",sources:{latest:{label:"LATEST GAMES (V.O.D.)",channelId:"72115",subId:"29683"},archives:{label:"ARCHIVES",channelId:"72121",subId:"30663"},coaches:{label:"COACHES' SHOW",channelId:"72123",subId:"30728"}}},
"pueblo-punishers":{name:"PUEBLO PUNISHERS",banner:"https://cdn.shopify.com/s/files/1/0719/1966/5231/files/Pueblo_Punishers_30eafc0a-763a-412b-838b-321dd9088d96.png?v=1790208460",sources:{latest:{label:"LATEST GAMES (V.O.D.)",channelId:"72115",subId:"29684"},archives:{label:"ARCHIVES",channelId:"72121",subId:"30662"},coaches:{label:"COACHES' SHOW",channelId:"72123",subId:"30729"}}},
"salina-liberty":{name:"SALINA LIBERTY",banner:"https://cdn.shopify.com/s/files/1/0719/1966/5231/files/Salina_Liberty_87f2d951-a969-4ce6-930b-1b0094c7bd4d.png?v=1790208460",sources:{latest:{label:"LATEST GAMES (V.O.D.)",channelId:"72115",subId:"29685"},archives:{label:"ARCHIVES",channelId:"72121",subId:"30661"},coaches:{label:"COACHES' SHOW",channelId:"72123",subId:"30730"}}},
"sioux-city-bandits":{name:"SIOUX CITY BANDITS",banner:"https://cdn.shopify.com/s/files/1/0719/1966/5231/files/Sioux_City_Bandits_5e3eba6e-6998-4c9a-9b73-3999b5e5d875.png?v=1790208460",sources:{latest:{label:"LATEST GAMES (V.O.D.)",channelId:"72115",subId:"29686"},archives:{label:"ARCHIVES",channelId:"72121",subId:"30660"},coaches:{label:"COACHES' SHOW",channelId:"72123",subId:"30732"}}},
"southwest-kansas-storm":{name:"SOUTHWEST KANSAS STORM",banner:"https://cdn.shopify.com/s/files/1/0719/1966/5231/files/SW_Kansas_Storm_3eff88a7-a61e-48bf-8673-7b03e554d827.png?v=1790208460",sources:{latest:{label:"LATEST GAMES (V.O.D.)",channelId:"72115",subId:"29687"},archives:{label:"ARCHIVES",channelId:"72121",subId:"30659"},coaches:{label:"COACHES' SHOW",channelId:"72123",subId:"30731"}}},
"wheeling-miners":{name:"WHEELING MINERS",banner:"https://cdn.shopify.com/s/files/1/0719/1966/5231/files/Wheeling_Miners_a547bbd0-e575-4512-9ad6-47e081cb1fc3.png?v=1790208460",sources:{latest:{label:"LATEST GAMES (V.O.D.)",channelId:"72115",subId:null},archives:{label:"ARCHIVES",channelId:"72121",subId:"30658"},coaches:{label:"COACHES' SHOW",channelId:"72123",subId:"30721"}}}
};
const grid=document.getElementById("teamGrid"), modal=document.getElementById("teamModal"), content=document.getElementById("modalContent"), title=document.getElementById("modalTitle");
let activeSlug=null, buckets={};

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function itemsFrom(payload){
  if(Array.isArray(payload)) return payload;
  for(const k of ["items","media","videos","results","data"]){
    if(Array.isArray(payload?.[k])) return payload[k];
    if(Array.isArray(payload?.data?.[k])) return payload.data[k];
  }
  return [];
}
function imageFor(item){return item?.thumbnail_url||item?.thumbnail||item?.image_url||item?.image||item?.poster||""}
function nameFor(item){return item?.title||item?.name||item?.media_title||"NAL Network Video"}
function mediaIdFor(item){return String(item?.media_id||item?.id||"").trim()}
async function fetchCatalog(source){
  const q=new URLSearchParams({view:"media",channelId:source.channelId});
  if(source.subId) q.set("subId",source.subId);
  const r=await fetch(`${API}?${q.toString()}`);
  if(!r.ok) throw new Error(`Catalog ${r.status}`);
  const p=await r.json();
  if(p?.success===false) throw new Error(p?.error||"Catalog request failed");
  return itemsFrom(p);
}
function cardHTML(item,key,i){
  const img=imageFor(item), n=nameFor(item);
  return `<button class="video" type="button" data-play="${key}" data-index="${i}">${img?`<img src="${esc(img)}" alt="">`:""}<strong>${esc(n)}</strong><small>WATCH NOW</small></button>`;
}
async function loadRow(slug,key){
  const team=TEAMS[slug], source=team.sources[key], row=document.getElementById(`row-${key}`);
  if(!source||!row) return;
  row.innerHTML='<div class="empty">LOADING…</div>';
  try{
    const items=await fetchCatalog(source);
    buckets[key]=items;
    row.innerHTML=items.length?items.slice(0,6).map((x,i)=>cardHTML(x,key,i)).join(""):'<div class="empty">COMING SOON</div>';
  }catch(e){
    row.innerHTML='<div class="empty">CONTENT UNAVAILABLE</div>';
    console.error(e);
  }
}
function openTeam(slug){
  const team=TEAMS[slug]; if(!team)return;
  activeSlug=slug;buckets={};title.textContent=team.name;
  content.innerHTML=`<div class="hero"><img src="${esc(team.banner)}" alt="${esc(team.name)}"></div>
  ${Object.entries(team.sources).map(([key,s])=>`<section class="section"><div class="section-head"><h3>${esc(s.label)}</h3></div><div class="row" id="row-${key}"><div class="empty">LOADING…</div></div></section>`).join("")}
  <section class="section"><div class="section-head"><h3>HIGHLIGHTS</h3></div><div class="row"><div class="empty">COMING SOON</div></div></section>
  <section class="section"><div class="section-head"><h3>FEATURES &amp; INTERVIEWS</h3></div><div class="row"><div class="empty">COMING SOON</div></div></section>`;
  modal.hidden=false;document.body.style.overflow="hidden";
  history.replaceState(null,"",`#team-${slug}`);
  Object.keys(team.sources).forEach(k=>loadRow(slug,k));
}
function closeTeam(){
  modal.hidden=true;document.body.style.overflow="";activeSlug=null;
  if(location.hash.startsWith("#team-")) history.replaceState(null,"",location.pathname+location.search);
}
function play(key,index){
  const team=TEAMS[activeSlug], source=team?.sources?.[key], item=buckets[key]?.[index];
  if(!source||!item)return;
  const id=mediaIdFor(item);if(!id)return;
  const src=`https://www.lightcast.com/embed/player.php?id=${encodeURIComponent(id)}&channelId=${encodeURIComponent(source.channelId)}`;
  title.textContent=`${team.name} — ${source.label}`;
  content.innerHTML=`<button class="back" type="button" id="backHub">‹ BACK TO ${esc(team.name)}</button><div class="player"><iframe src="${src}" allow="fullscreen; picture-in-picture" allowfullscreen></iframe></div><div class="status">${esc(nameFor(item))}</div>`;
  document.getElementById("backHub").onclick=()=>openTeam(activeSlug);
}
Object.entries(TEAMS).forEach(([slug,t])=>{
  const b=document.createElement("button");b.type="button";b.className="card";b.dataset.team=slug;
  b.innerHTML=`<img src="${esc(t.banner)}" alt="${esc(t.name)}"><span>${esc(t.name)}</span>`;
  grid.appendChild(b);
});
grid.addEventListener("click",e=>{const b=e.target.closest("[data-team]");if(b)openTeam(b.dataset.team)});
content.addEventListener("click",e=>{const b=e.target.closest("[data-play]");if(b)play(b.dataset.play,Number(b.dataset.index))});
document.getElementById("closeModal").addEventListener("click",closeTeam);
modal.addEventListener("click",e=>{if(e.target===modal)closeTeam()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!modal.hidden)closeTeam()});
const initial=location.hash.match(/^#team-(.+)$/);if(initial&&TEAMS[initial[1]])openTeam(initial[1]);
</script>
</body>
</html>
