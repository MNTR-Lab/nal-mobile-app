<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NAL Network</title>
<style>

/* =========================================================
   GLOBAL
========================================================= */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --nal-blue: #07172b;
  --nal-blue-light: #102b4e;
  --nal-red: #e31b23;
  --white: #ffffff;
  --light: #f3f5f7;
  --gray: #6d7682;
  --border: #dfe3e8;
  --black: #101419;

  --nav-height: 80px;
  --header-height: 72px;

  /*
     KEEP THIS AT 72PX.
     This is the approved FootballShift article crop.
  */
  --footballshift-crop: 72px;
}

html,
body {
  min-height: 100%;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: #d9dde2;
  color: var(--black);
}

button,
a {
  -webkit-tap-highlight-color: transparent;
}

button {
  font-family: inherit;
}

.app {
  width: 100%;
  max-width: 600px;
  min-height: 100vh;
  margin: 0 auto;
  background: var(--light);
  padding-bottom: var(--nav-height);
  position: relative;
  overflow-x: hidden;
}


/* =========================================================
   TOP HEADER
========================================================= */

.topbar {
  height: var(--header-height);

  padding:
    max(8px, env(safe-area-inset-top))
    17px
    8px;

  background: var(--nal-blue);

  display: grid;
  grid-template-columns: 50px 1fr 50px;
  align-items: center;

  border-bottom: 3px solid var(--nal-red);

  position: sticky;
  top: 0;

  z-index: 3000;
}

.header-left,
.header-right {
  display: flex;
  align-items: center;
}

.header-left {
  justify-content: flex-start;
}

.header-right {
  justify-content: flex-end;
}

.header-logo {
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
}

.nal-logo {
  width: 76px;
  height: 52px;
  object-fit: contain;
  display: block;
}

.header-button {
  width: 38px;
  height: 38px;

  border: 0;
  background: transparent;

  color: white;

  display: flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;
}

.header-button svg {
  width: 24px;
  height: 24px;

  stroke: currentColor;
  fill: none;

  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.notification-button {
  position: relative;
}

.notification-dot {
  width: 7px;
  height: 7px;

  background: var(--nal-red);

  border-radius: 50%;

  position: absolute;

  top: 5px;
  right: 4px;
}


/* =========================================================
   PAGE SYSTEM
========================================================= */

.app-page {
  display: none;
}

.app-page.active {
  display: block;
}


/* =========================================================
   SEASON X HERO
========================================================= */

.season-x-hero {
  min-height: 300px;

  position: relative;
  overflow: hidden;

  display: flex;
  align-items: center;
  justify-content: center;

  background-color: var(--nal-blue);

  background-image:
    url("https://cdn.shopify.com/s/files/1/0719/1966/5231/files/NAL_Network_-_Game_Image_2.jpg?v=1789843442");

  background-size: cover;
  background-position: center;
}

.season-x-hero::before {
  content: "";

  position: absolute;
  inset: 0;

  background:
    radial-gradient(
      ellipse at center,
      rgba(7,23,43,.94) 0%,
      rgba(7,23,43,.88) 22%,
      rgba(7,23,43,.70) 45%,
      rgba(7,23,43,.42) 68%,
      rgba(7,23,43,.18) 100%
    );

  z-index: 1;
}

.season-x-hero::after {
  content: "";

  position: absolute;
  inset: 0;

  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.12) 0%,
      rgba(0,0,0,0) 30%,
      rgba(0,0,0,0) 65%,
      rgba(7,23,43,.45) 100%
    );

  z-index: 2;
}

.hero-red-glow {
  position: absolute;

  width: 320px;
  height: 190px;

  left: 50%;
  top: 50%;

  transform: translate(-50%, -50%);

  background: rgba(227,27,35,.10);

  filter: blur(75px);

  border-radius: 50%;

  z-index: 2;

  pointer-events: none;
}

.hero-content {
  width: 100%;

  padding: 24px 20px 36px;

  position: relative;

  z-index: 4;

  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: center;

  text-align: center;
}

.hero-eyebrow {
  color: rgba(255,255,255,.90);

  font-size: 9px;
  font-weight: 900;

  letter-spacing: 2.4px;

  text-transform: uppercase;

  margin-bottom: 9px;

  text-shadow: 0 2px 8px rgba(0,0,0,.8);
}

.national-bowl-logo {
  width: 340px;
  max-width: 88%;

  height: auto;

  object-fit: contain;

  display: block;

  margin: 0 auto;

  filter:
    drop-shadow(
      0 8px 14px rgba(0,0,0,.65)
    );
}

.hero-tagline {
  margin-top: 10px;

  color: #ffffff;

  font-size: 11px;
  font-weight: 900;

  letter-spacing: 1.8px;

  text-transform: uppercase;

  text-align: center;

  text-shadow: 0 2px 8px rgba(0,0,0,.85);
}

.hero-accent-line {
  position: absolute;

  left: 50%;
  bottom: 17px;

  transform: translateX(-50%);

  width: 58px;
  height: 3px;

  background: var(--nal-red);

  border-radius: 10px;

  z-index: 5;
}


/* =========================================================
   GENERAL SECTIONS
========================================================= */

.section {
  background: white;

  margin-top: 9px;

  padding: 20px 17px;
}

.section-header {
  display: flex;

  justify-content: space-between;
  align-items: center;

  gap: 10px;

  margin-bottom: 15px;
}

.section-title {
  font-size: 15px;

  font-weight: 900;

  letter-spacing: .8px;

  text-transform: uppercase;

  color: var(--nal-blue);
}

.section-link {
  color: var(--nal-red);

  text-decoration: none;

  font-size: 10px;

  font-weight: 900;

  white-space: nowrap;
}


/* =========================================================
   NEXT GAMES
========================================================= */

.schedule-placeholder {
  border: 1px solid var(--border);

  border-radius: 14px;

  min-height: 105px;

  background:
    linear-gradient(
      135deg,
      #f7f8fa,
      #eef1f4
    );

  display: flex;

  align-items: center;
  justify-content: center;

  text-align: center;

  padding: 20px;
}

.schedule-placeholder-title {
  color: var(--nal-blue);

  font-size: 13px;

  font-weight: 900;

  letter-spacing: .5px;

  text-transform: uppercase;
}

.schedule-placeholder-text {
  margin-top: 6px;

  color: var(--gray);

  font-size: 11px;

  line-height: 1.45;
}


/* =========================================================
   NAL NETWORK
========================================================= */

.network-placeholder {
  height: 150px;

  border-radius: 14px;

  overflow: hidden;

  background:
    radial-gradient(
      circle at center,
      #234d77 0%,
      #102b4e 48%,
      #07172b 100%
    );

  position: relative;

  display: flex;

  align-items: center;
  justify-content: center;

  text-align: center;
}

.network-placeholder::after {
  content: "";

  position: absolute;

  left: 0;
  right: 0;
  bottom: 0;

  height: 4px;

  background: var(--nal-red);
}

.network-placeholder-title {
  color: white;

  font-size: 18px;

  font-weight: 900;

  letter-spacing: 1px;
}

.network-placeholder-text {
  margin-top: 6px;

  color: rgba(255,255,255,.70);

  font-size: 10px;

  font-weight: 700;

  letter-spacing: .6px;
}


/* =========================================================
   NEWS
========================================================= */

.news-section {
  padding-right: 0;
}

.news-section .section-header {
  padding-right: 17px;
}

.news-loading {
  margin-right: 17px;

  min-height: 170px;

  border-radius: 16px;

  background:
    linear-gradient(
      135deg,
      #102b4e,
      #07172b
    );

  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: center;

  gap: 12px;

  color: white;

  font-size: 9px;
  font-weight: 900;

  letter-spacing: 1px;

  text-transform: uppercase;
}

.news-loading-logo {
  width: 95px;
  opacity: .7;
}

.news-spinner {
  width: 22px;
  height: 22px;

  border: 3px solid rgba(255,255,255,.22);

  border-top-color: white;

  border-radius: 50%;

  animation: spin .8s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

.news-error {
  margin-right: 17px;

  padding: 24px 18px;

  border-radius: 14px;

  background: #f5f6f8;

  border: 1px solid var(--border);

  text-align: center;
}

.news-error-title {
  color: var(--nal-blue);

  font-size: 13px;
  font-weight: 900;

  text-transform: uppercase;
}

.news-error-text {
  margin-top: 6px;

  color: var(--gray);

  font-size: 10px;

  line-height: 1.4;
}


/* =========================================================
   LEAD STORY
========================================================= */

.lead-story {
  margin-right: 17px;

  min-height: 265px;

  border-radius: 16px;

  overflow: hidden;

  background: var(--nal-blue);

  text-decoration: none;

  display: block;

  position: relative;

  box-shadow:
    0 7px 20px rgba(0,0,0,.14);
}

.lead-story-image {
  position: absolute;

  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: cover;

  display: block;

  z-index: 1;
}

.lead-story-fallback {
  position: absolute;

  inset: 0;

  display: flex;

  align-items: center;
  justify-content: center;

  background:
    radial-gradient(
      circle at 50% 35%,
      #244d77 0%,
      #102b4e 42%,
      #07172b 100%
    );
}

.lead-story-fallback img {
  width: 180px;

  max-width: 55%;

  opacity: .45;

  filter:
    drop-shadow(
      0 8px 12px rgba(0,0,0,.4)
    );
}

.lead-story-overlay {
  position: absolute;

  inset: 0;

  background:
    linear-gradient(
      180deg,
      rgba(7,23,43,.02) 0%,
      rgba(7,23,43,.10) 30%,
      rgba(7,23,43,.55) 62%,
      rgba(7,23,43,.98) 100%
    );

  z-index: 2;
}

.lead-story-content {
  position: absolute;

  left: 0;
  right: 0;
  bottom: 0;

  z-index: 3;

  padding: 60px 18px 18px;
}

.story-category {
  display: inline-flex;

  align-items: center;

  min-height: 20px;

  padding: 4px 8px;

  border-radius: 4px;

  background: var(--nal-red);

  color: white;

  font-size: 8px;

  font-weight: 900;

  letter-spacing: .8px;

  text-transform: uppercase;

  margin-bottom: 8px;
}

.lead-story-title {
  color: white;

  font-size: 19px;

  line-height: 1.08;

  font-weight: 900;

  text-transform: uppercase;

  max-width: 480px;
}

.lead-story-subtitle {
  margin-top: 8px;

  color: rgba(255,255,255,.78);

  font-size: 10px;

  line-height: 1.35;

  max-width: 450px;

  display: -webkit-box;

  -webkit-line-clamp: 2;

  -webkit-box-orient: vertical;

  overflow: hidden;
}

.read-story {
  margin-top: 10px;

  color: white;

  font-size: 9px;

  font-weight: 900;

  letter-spacing: .7px;

  text-transform: uppercase;
}


/* =========================================================
   NEWS CARDS
========================================================= */

.news-scroll {
  display: flex;

  gap: 12px;

  overflow-x: auto;

  padding: 15px 17px 7px 0;

  scrollbar-width: none;

  scroll-snap-type: x mandatory;
}

.news-scroll::-webkit-scrollbar {
  display: none;
}

.news-card {
  min-width: 220px;
  width: 220px;

  border: 1px solid var(--border);

  border-radius: 14px;

  overflow: hidden;

  background: white;

  text-decoration: none;

  scroll-snap-align: start;

  box-shadow:
    0 3px 12px rgba(0,0,0,.06);
}

.news-card-image-wrap {
  height: 128px;

  position: relative;

  overflow: hidden;

  background: var(--nal-blue);
}

.news-card-image {
  position: relative;

  z-index: 2;

  width: 100%;
  height: 100%;

  object-fit: cover;

  display: block;
}

.news-card-fallback {
  position: absolute;

  inset: 0;

  z-index: 1;

  display: flex;

  align-items: center;
  justify-content: center;

  background:
    radial-gradient(
      circle at center,
      #234d77,
      #07172b 75%
    );
}

.news-card-fallback img {
  width: 105px;

  max-width: 55%;

  opacity: .45;
}

.news-card-body {
  padding: 11px 12px 13px;
}

.news-card-date {
  color: var(--nal-red);

  font-size: 8px;

  font-weight: 900;

  letter-spacing: .7px;

  text-transform: uppercase;

  margin-bottom: 6px;
}

.news-card-title {
  color: var(--nal-blue);

  font-size: 12px;

  line-height: 1.27;

  font-weight: 900;

  text-transform: uppercase;

  display: -webkit-box;

  -webkit-line-clamp: 3;

  -webkit-box-orient: vertical;

  overflow: hidden;
}

.swipe-hint {
  padding: 4px 17px 0 0;

  display: flex;

  align-items: center;
  justify-content: flex-end;

  gap: 5px;

  color: #9aa2ab;

  font-size: 8px;

  font-weight: 900;

  letter-spacing: .7px;

  text-transform: uppercase;
}

.swipe-hint svg {
  width: 14px;
  height: 14px;

  fill: none;

  stroke: currentColor;

  stroke-width: 2;

  stroke-linecap: round;
  stroke-linejoin: round;
}


/* =========================================================
   FUTURE SECTIONS
========================================================= */

.future-section {
  background: white;

  margin-top: 9px;

  padding: 20px 17px;
}

.future-placeholder {
  border: 1px dashed #cfd5dc;

  border-radius: 12px;

  padding: 22px 15px;

  text-align: center;

  color: #9aa2ab;

  font-size: 10px;

  font-weight: 800;

  letter-spacing: .5px;
}


/* =========================================================
   STANDARD PLACEHOLDER PAGES
========================================================= */

.placeholder-page {
  padding: 30px 18px;
}

.placeholder-card {
  min-height: 260px;

  border-radius: 18px;

  background: white;

  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: center;

  text-align: center;

  padding: 30px 20px;

  border: 1px solid var(--border);
}

.placeholder-card h2 {
  color: var(--nal-blue);

  font-size: 20px;

  font-weight: 900;

  text-transform: uppercase;
}

.placeholder-card p {
  color: var(--gray);

  font-size: 11px;

  line-height: 1.5;

  margin-top: 8px;

  max-width: 320px;
}


/* =========================================================
   SHOP PAGE
========================================================= */

.shop-page {
  background: white;

  height:
    calc(
      100dvh -
      var(--header-height) -
      var(--nav-height)
    );

  min-height: 450px;

  overflow: hidden;
}

.shop-toolbar {
  height: 58px;

  padding: 0 15px;

  border-bottom: 1px solid var(--border);

  background: white;

  display: grid;

  grid-template-columns: 1fr 42px;

  align-items: center;
}

.shop-title {
  color: var(--nal-blue);

  font-size: 13px;

  font-weight: 900;

  letter-spacing: .8px;
}

.shop-subtitle {
  margin-top: 2px;

  color: var(--gray);

  font-size: 7px;

  font-weight: 800;

  letter-spacing: .5px;
}

.shop-external {
  width: 38px;
  height: 38px;

  display: flex;

  align-items: center;
  justify-content: center;

  color: var(--nal-blue);

  text-decoration: none;
}

.shop-external svg {
  width: 20px;
  height: 20px;

  fill: none;

  stroke: currentColor;

  stroke-width: 2;
}

.shop-frame {
  width: 100%;

  height:
    calc(
      100% - 58px
    );

  border: 0;

  background: #f2f2f2;
}


/* =========================================================
   IN-APP ARTICLE PAGE
========================================================= */

.article-page {
  background: #ffffff;

  height:
    calc(
      100dvh -
      var(--header-height) -
      var(--nav-height)
    );

  min-height: 450px;

  overflow: hidden;
}


/* =========================================================
   ARTICLE TOOLBAR
========================================================= */

.article-toolbar {
  height: 54px;

  padding: 0 14px;

  background: #ffffff;

  border-bottom: 1px solid var(--border);

  display: grid;

  grid-template-columns: 42px 1fr 42px;

  align-items: center;

  position: relative;

  z-index: 20;
}

.article-back,
.article-external {
  width: 38px;
  height: 38px;

  border: 0;

  border-radius: 50%;

  background: transparent;

  color: var(--nal-blue);

  display: flex;

  align-items: center;
  justify-content: center;

  cursor: pointer;

  text-decoration: none;
}

.article-back svg,
.article-external svg {
  width: 20px;
  height: 20px;

  fill: none;

  stroke: currentColor;

  stroke-width: 2;

  stroke-linecap: round;
  stroke-linejoin: round;
}

.article-toolbar-center {
  text-align: center;
}

.article-toolbar-title {
  color: var(--nal-blue);

  font-size: 12px;

  font-weight: 900;

  letter-spacing: 1px;
}

.article-toolbar-subtitle {
  margin-top: 2px;

  color: var(--gray);

  font-size: 7px;

  font-weight: 800;

  letter-spacing: .7px;
}

.article-frame-container {
  position: relative;

  height:
    calc(
      100% - 54px
    );

  overflow: hidden;

  background: white;
}

.article-frame {
  position: absolute;

  left: 0;

  top:
    calc(
      -1 *
      var(--footballshift-crop)
    );

  width: 100%;

  height:
    calc(
      100% +
      var(--footballshift-crop)
    );

  border: 0;

  background: white;

  display: block;

  z-index: 2;
}

.article-loading {
  position: absolute;

  inset: 0;

  z-index: 10;

  background: white;

  display: flex;

  flex-direction: column;

  align-items: center;
  justify-content: center;

  gap: 12px;
}

.article-loading-logo {
  width: 100px;
}

.article-spinner {
  width: 25px;
  height: 25px;

  border: 3px solid #dfe3e8;

  border-top-color: var(--nal-red);

  border-radius: 50%;

  animation: spin .8s linear infinite;
}

/* =========================================================
   TEAM CONTENT VIEWER
========================================================= */

.article-page.team-content-mode .article-toolbar {
  border-bottom: 4px solid var(--viewer-accent, var(--nal-red));
}

.article-page.team-content-mode .article-back,
.article-page.team-content-mode .article-toolbar-title {
  color: var(--viewer-primary, var(--nal-blue));
}

.article-page.team-content-mode .article-toolbar-subtitle {
  color: var(--viewer-accent, var(--nal-red));
}

.article-page.team-content-mode .article-spinner {
  border-top-color: var(--viewer-accent, var(--nal-red));
}

.article-page.team-content-mode .article-loading-text {
  color: var(--viewer-primary, var(--nal-blue));
}


.article-loading-text {
  color: var(--nal-blue);

  font-size: 8px;

  font-weight: 900;

  letter-spacing: 1px;
}


/* =========================================================
   BOTTOM NAVIGATION
========================================================= */

.bottom-nav {
  position: fixed;

  left: 50%;
  bottom: 0;

  transform: translateX(-50%);

  width: 100%;
  max-width: 600px;

  height:
    calc(
      var(--nav-height) +
      env(safe-area-inset-bottom)
    );

  padding:
    8px 6px
    max(
      8px,
      env(safe-area-inset-bottom)
    );

  background: white;

  border-top: 1px solid #d7dce2;

  display: grid;

  grid-template-columns:
    repeat(
      5,
      1fr
    );

  align-items: center;

  z-index: 4000;

  box-shadow:
    0 -4px 16px rgba(0,0,0,.08);
}

.nav-button {
  border: 0;

  background: transparent;

  color: #727b85;

  display: flex;

  flex-direction: column;

  align-items: center;
  justify-content: center;

  gap: 4px;

  height: 60px;

  cursor: pointer;
}

.nav-button svg {
  width: 22px;
  height: 22px;

  fill: none;

  stroke: currentColor;

  stroke-width: 2;

  stroke-linecap: round;
  stroke-linejoin: round;
}

.nav-button span {
  font-size: 7px;

  font-weight: 900;

  letter-spacing: .25px;

  white-space: nowrap;
}

.nav-button.active {
  color: var(--nal-red);
}

.watch-button {
  position: relative;

  top: -15px;
}

.watch-icon {
  width: 54px;
  height: 54px;

  border-radius: 50%;

  background: var(--nal-red);

  color: white;

  display: flex;

  align-items: center;
  justify-content: center;

  box-shadow:
    0 5px 14px rgba(227,27,35,.35);

  border: 5px solid white;
}

.watch-icon svg {
  width: 23px;
  height: 23px;
}

.watch-button span {
  color: var(--nal-blue);

  margin-top: -1px;
}
/* =========================================================
   NAL TEAMS — HOME SCREEN
   ========================================================= */

.teams-scroll-wrap {
  width: 100%;
  overflow: hidden;
}

.teams-scroll {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  overflow-y: hidden;

/* =========================================================

function showPage(pageId) {

  pages.forEach(page => {
    page.classList.remove("active");
    page.style.display = "none";
  });

  const page =
    document.getElementById(
      pageId
    );

  if (page) {
    page.style.display = "block";
    page.classList.add("active");
  }


  navButtons.forEach(button => {
    button.classList.remove("active");
  });


  const navButton =
    document.querySelector(
      `[data-page="${pageId}"]`
    );

  if (navButton) {
    navButton.classList.add("active");
  }


  window.scrollTo({
    top: 0,
    behavior: "instant"
  });

}


navButtons.forEach(button => {

  button.addEventListener(
    "click",
    () => {

      const pageId =
        button.dataset.page;

      /*

         as the team football pages.
      */
      if (pageId === "scoresPage") {

        openArticle(
          SCORES_URL,
          {
            mode: "team",
            title: "NAL SCORES",
            subtitle: "SEASON X",
            loadingText: "LOADING NAL SCORES",
            brand: {
              primary: "#07172b",
              accent: "#e31b23"

            navPage: "scoresPage"
          }
        );

        return;
      }

      if (pageId === "shopPage") {
        window.location.href = SHOP_URL;
        return;
      }

      if (pageId === "watchPage") {
        if (articleFrame.src !== "about:blank") {
          articleFrame.src = "about:blank";

        showPage("watchPage");
        return;
      }

      if (
        articleFrame.src !==
        "about:blank"
      ) {

          "about:blank";
      }

      showPage(pageId);

    }
  );

});

/* =========================================================
   ARTICLE READER
========================================================= */

let previousPage =
  "homePage";

let previousScrollPosition =
  0;


function openArticle(url, options = {}) {

  if (!url) {
    return;
  }

  const activePage =
    document.querySelector(
      ".app-page.active"
    );

  previousPage =
    activePage
      ? activePage.id
      : "homePage";

  previousScrollPosition =
    window.scrollY;

  const isTeamContent =
    options.mode === "team";

  const title =
    options.title || "NAL NEWS";

  const subtitle =
    options.subtitle || "NATIONAL ARENA LEAGUE";

  const loadingText =
    options.loadingText ||
    (isTeamContent
      ? `LOADING ${title}`
      : "LOADING NAL NEWS");

  if (articleToolbarTitle) {
    articleToolbarTitle.textContent =
      title.toUpperCase();
  }

  if (articleToolbarSubtitle) {
    articleToolbarSubtitle.textContent =
      subtitle.toUpperCase();
  }

  if (articleLoadingText) {
    articleLoadingText.textContent =
      loadingText.toUpperCase();
  }

  if (isTeamContent && options.brand) {
    articlePage.style.setProperty(
      "--viewer-primary",
      options.brand.primary
    );

    articlePage.style.setProperty(
      "--viewer-accent",
      options.brand.accent
    );

    articlePage.classList.add(
      "team-content-mode"
    );
  } else {
    articlePage.style.removeProperty(
      "--viewer-primary"
    );

    articlePage.style.removeProperty(
      "--viewer-accent"
    );

    articlePage.classList.remove(
      "team-content-mode"
    );
  }

  if (articleExternal) {
    articleExternal.href = url;
    articleExternal.style.display =
      isTeamContent ? "none" : "flex";
  }

  pages.forEach(page => {
    page.classList.remove("active");
    page.style.display = "none";
  });

  /* Keep the active page class and inline display state in sync. */
  articlePage.style.display = "block";
  articlePage.classList.add("active");

  navButtons.forEach(button => {
    button.classList.remove("active");
  });

  const viewerNavPage =
    options.navPage || "homePage";

  const viewerNavButton =
    document.querySelector(
      `[data-page="${viewerNavPage}"]`
    );

  if (viewerNavButton) {
    viewerNavButton.classList.add("active");
  }

  articleLoading.style.display =
    "flex";

  articleFrame.title =
    isTeamContent
      ? `${subtitle} - ${title}`
      : "NAL News Article";

  articleFrame.src = url;

  window.scrollTo({
    top: 0,
    behavior: "instant"
  });
}


articleFrame.addEventListener(

    if (

articleBack.addEventListener(

      previous.classList.add(
        "active"
      );
    }


    navButtons.forEach(button => {

/* =========================================================
   NEWS HELPERS
========================================================= */

function escapeHTML(value = "") {

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


function formatNewsDate(
  value
) {

  if (!value) {
    return "NAL NEWS";
  }


  const date =
    new Date(value);


  if (
    Number.isNaN(
      date.getTime()
    )
  ) {

    return value;

  }


  return date
    .toLocaleDateString(
      "en-US",
      {
        month: "short",
        day: "numeric",
        year: "numeric"
      }
    )
    .toUpperCase();

}


function imageMarkup(
  article,
  className
) {

  if (!article.image) {
    return "";
  }


  return `
    <img
      class="${className}"
      src="${escapeHTML(article.image)}"
      alt="${escapeHTML(article.title)}"
      loading="lazy"
      onerror="this.style.display='none'"
    >
  `;

}


/* =========================================================
   RENDER LIVE NEWS
========================================================= */

function renderNews(
  articles
) {

  if (
    !Array.isArray(articles) ||
    articles.length === 0
  ) {

    showNewsError();

    return;

  }


  const lead =
    articles[0];


  const additional =
    articles.slice(
      1,
      5
    );


  const leadDescription =
    lead.description || "";


  let html = `

    <a
      class="lead-story"
      href="${escapeHTML(lead.url)}"
      data-news-story="true"
    >

      <div class="lead-story-fallback">

        <img
          src="${NAL_LOGO}"
          alt=""
        >

      </div>

      ${imageMarkup(
        lead,
        "lead-story-image"
      )}

      <div class="lead-story-overlay"></div>

      <div class="lead-story-content">

        <div class="story-category">
          ${escapeHTML(
            lead.category ||
            "NAL NEWS"
          )}
        </div>

        <div class="lead-story-title">
          ${escapeHTML(
            lead.title
          )}
        </div>

        ${
          leadDescription
          ? `
            <div class="lead-story-subtitle">
              ${escapeHTML(
                leadDescription
              )}
            </div>
          `
          : ""
        }

        <div class="read-story">
          READ STORY →
        </div>

      </div>

    </a>

  `;


  if (
    additional.length > 0
  ) {

    html += `
      <div class="news-scroll">
    `;


    additional.forEach(
      article => {

        html += `

          <a
            class="news-card"
            href="${escapeHTML(article.url)}"
            data-news-story="true"
          >

            <div class="news-card-image-wrap">

              <div class="news-card-fallback">

                <img
                  src="${NAL_LOGO}"
                  alt=""
                >

              </div>

              ${imageMarkup(
                article,
                "news-card-image"
              )}

            </div>


            <div class="news-card-body">

              <div class="news-card-date">
                ${escapeHTML(
                  formatNewsDate(
                    article.date
                  )
                )}
              </div>

              <div class="news-card-title">
                ${escapeHTML(
                  article.title
                )}
              </div>

            </div>

          </a>

        `;

      }
    );


    html += `
      </div>

      <div class="swipe-hint">

        SWIPE FOR MORE

        <svg viewBox="0 0 24 24">
          <path d="M5 12h14"></path>
          <path d="M13 6l6 6-6 6"></path>
        </svg>

      </div>
    `;

  }


  newsContent.innerHTML =
    html;

}


/* =========================================================
   NEWS ERROR
========================================================= */

function showNewsError() {

  newsContent.innerHTML = `

    <div class="news-error">

      <div class="news-error-title">
        NAL News
      </div>

      <div class="news-error-text">
        Latest league news is temporarily unavailable.
        Please check back shortly.
      </div>

    </div>

  `;

}



/* =========================================================
   NATIVE NEWS PAGE
========================================================= */
let nalNewsArticles = [];

function renderNativeNews() {
  const target = document.getElementById("nativeNewsContent");
  if (!target) return;

  const articles = Array.isArray(nalNewsArticles) ? nalNewsArticles : [];
  if (!articles.length) {
    target.innerHTML = '<div class="native-news-error">Latest league news is temporarily unavailable. Please check back shortly.</div>';
    return;
  }

  const sorted = [...articles].sort((a,b) => new Date(b.date || 0) - new Date(a.date || 0));
  const lead = sorted[0];
  const rest = sorted.slice(1);

  const featureImage = lead.image
    ? `<img class="native-news-feature-image" src="${escapeHTML(lead.image)}" alt="${escapeHTML(lead.title || "")}" onerror="this.style.display='none'">`
    : "";

  let output = `
    <a class="native-news-feature" href="${escapeHTML(lead.url || "#")}" data-native-news-story="true">
      ${featureImage}
      <div class="native-news-feature-body">
        <div class="native-news-meta">
          <span class="native-news-badge">${escapeHTML(lead.category || "NAL NEWS")}</span>
          <span class="native-news-date">${escapeHTML(formatNewsDate(lead.date))}</span>
        </div>
        <h2>${escapeHTML(lead.title || "NAL NEWS")}</h2>
        <div class="native-news-read">READ STORY →</div>
      </div>
    </a>
  `;

  if (rest.length) {
    output += '<div class="native-news-section-head">LATEST NEWS</div><div class="native-news-list">';
    rest.forEach(article => {
      const image = article.image
        ? `<img src="${escapeHTML(article.image)}" alt="${escapeHTML(article.title || "")}" loading="lazy" onerror="this.style.display='none'">`
        : "";
      output += `
        <a class="native-news-card" href="${escapeHTML(article.url || "#")}" data-native-news-story="true">
          ${image}
          <div class="native-news-card-body">
            <div class="native-news-meta">
              <span class="native-news-badge">${escapeHTML(article.category || "NAL NEWS")}</span>
              <span class="native-news-date">${escapeHTML(formatNewsDate(article.date))}</span>
            </div>
            <h3>${escapeHTML(article.title || "NAL NEWS")}</h3>
            <div class="native-news-read">READ →</div>
          </div>
        </a>
      `;
    });
    output += '</div>';
  }

  target.innerHTML = output;
}

document.addEventListener("click", function(event) {
  const story = event.target.closest('[data-native-news-story="true"]');
  if (!story) return;
  const url = story.getAttribute("href");
  if (!url || url === "#") return;
  event.preventDefault();
  openArticle(url);
});

/* =========================================================
   LOAD NEWS.JSON
========================================================= */

async function loadNews() {

  try {

    /*
       Cache-busting timestamp ensures the app
       checks GitHub Pages for the newest JSON
       instead of displaying an old cached copy.
    */

    const response =
      await fetch(
        `${NEWS_FEED}?v=${Date.now()}`,
        {
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        `News request failed: ${response.status}`
      );

    }


    const feed =
      await response.json();


    if (
      !feed ||
      !Array.isArray(
        feed.articles
      )
    ) {

      throw new Error(
        "Invalid news feed"
      );

    }


    nalNewsArticles = feed.articles;
    renderNews(
      feed.articles
    );
    renderNativeNews();


  } catch (error) {

    console.error(
      "Unable to load NAL news:",
      error
    );


    showNewsError();

function normalizeTeamNewsFeed(feed) {
  if (Array.isArray(feed)) {
    return feed;
  }

  if (feed && Array.isArray(feed.articles)) {
    return feed.articles;
  }

  return [];
}


function teamNewsImageMarkup(article, className) {
  if (!article || !article.image) {
    return "";
  }

  return `
    <img
      class="${className}"
      src="${escapeHTML(article.image)}"
      alt="${escapeHTML(article.title || "")}"
      loading="lazy"
      onerror="this.style.display='none'"
    >
  `;
}


function renderTeamNews(team, articles) {
  const section =
    document.getElementById("teamNewsSection");

  const content =
    document.getElementById("teamNewsContent");

  if (!section || !content) {
    return;
  }

  if (
    !Array.isArray(articles) ||
    articles.length === 0
  ) {
    section.style.display = "none";
    content.innerHTML = "";
    return;
  }

  section.style.display = "";

  const lead = articles[0];
  const additional = articles.slice(1, 5);
  const fallbackLogo =
    getTeamLogo(team);

  let html = `
    <a
      class="team-news-lead"
      href="${escapeHTML(lead.url || "")}"
      data-team-news-story="true"
    >
      <div class="team-news-lead-fallback">
        <img
          src="${escapeHTML(fallbackLogo)}"
          alt=""
        >
      </div>

      ${teamNewsImageMarkup(
        lead,
        "team-news-lead-image"
      )}

      <div class="team-news-lead-overlay"></div>

      <div class="team-news-lead-content">
        <div class="team-news-category">
          ${escapeHTML(
            lead.category ||
            team.name ||
            "TEAM NEWS"
          )}
        </div>

        <div class="team-news-lead-title">
          ${escapeHTML(lead.title || "TEAM NEWS")}
        </div>

        ${
          lead.description
            ? `
              <div class="team-news-lead-description">
                ${escapeHTML(lead.description)}
              </div>
            `
            : ""
        }

        <div class="team-news-read">
          READ STORY →
        </div>
      </div>
    </a>
  `;

  if (additional.length > 0) {
    html += `
      <div class="team-news-scroll">
    `;

    additional.forEach(article => {
      html += `
        <a
          class="team-news-card"
          href="${escapeHTML(article.url || "")}"
          data-team-news-story="true"
        >
          <div class="team-news-card-image-wrap">
            <div class="team-news-card-fallback">
              <img
                src="${escapeHTML(fallbackLogo)}"
                alt=""
              >
            </div>

            ${teamNewsImageMarkup(
              article,
              "team-news-card-image"
            )}
          </div>

          <div class="team-news-card-body">
            <div class="team-news-card-date">
              ${escapeHTML(
                formatNewsDate(article.date)
              )}
            </div>

            <div class="team-news-card-title">
              ${escapeHTML(
                article.title || "TEAM NEWS"
              )}
            </div>
          </div>
        </a>
      `;
    });

    html += `
      </div>

      <div class="team-news-swipe-hint">
        SWIPE FOR MORE →
      </div>
    `;
  }

  content.innerHTML = html;
}


async function loadTeamNews(team) {
  const section =
    document.getElementById("teamNewsSection");

  const content =
    document.getElementById("teamNewsContent");

  const loadingLogo =
    document.getElementById("teamNewsLoadingLogo");

  if (!section || !content || !team) {
    return;
  }

  /*
     Colorado does not currently use the FootballShift
     team-news source, so its news section stays hidden.
  */
  if (team.slug === "colorado-spartans") {
    section.style.display = "none";
    content.innerHTML = "";
    return;
  }

  section.style.display = "";

  if (loadingLogo) {
    loadingLogo.src =
      getTeamLogo(team);
  }

  content.innerHTML = `
    <div class="team-news-loading">
      <img
        class="team-news-loading-logo"
        src="${escapeHTML(getTeamLogo(team))}"
        alt=""
      >
      <div class="team-news-spinner"></div>
      <div>Loading ${escapeHTML(team.name || "Team")} News</div>
    </div>
  `;

  try {
    const response = await fetch(
      `data/team-news/${encodeURIComponent(team.slug)}.json?v=${Date.now()}`,
      {
        cache: "no-store"
      }
    );

    if (!response.ok) {
      throw new Error(
        `Team news request failed: ${response.status}`
      );
    }

    const feed = await response.json();
    const articles =
      normalizeTeamNewsFeed(feed);

    /*
       Protect against a user switching teams before
       this team's request finishes.
    */
    if (
      !activeTeam ||
      activeTeam.slug !== team.slug
    ) {
      return;
    }

    renderTeamNews(
      team,
      articles
    );

  } catch (error) {
    console.error(
      `Unable to load team news for ${team.name}:`,
      error
    );

    /*
       A missing/empty team feed should not create an
       error box in the app. We simply hide the section.
    */
    if (
      activeTeam &&
      activeTeam.slug === team.slug
    ) {
      section.style.display = "none";
      content.innerHTML = "";
    }
  }
}

async function openTeam(teamSlug) {

  try {

    const response = await fetch(
      `data/teams.json?v=${Date.now()}`,
      {
        cache: "no-store"
      }
    );

    if (!response.ok) {
      throw new Error(
        `Unable to load team data: ${response.status}`
      );
    }

    const teamData = await response.json();

    if (
      !teamData ||
      !Array.isArray(teamData.teams)
    ) {
      throw new Error("Invalid teams.json data");
    }

    const team = teamData.teams.find(
      item => item.slug === teamSlug
    );

    if (!team) {
      throw new Error(
        `Team not found: ${teamSlug}`
      );
    }

    console.log(
      "Opening Team Home:",
      team.name
    );

    openTeamHome(team);

  } catch (error) {

    console.error(
      "Unable to open team:",
      error
    );

  }

}

  teamPage.style.setProperty(
    "--team-third",
    brand.third || "#ffffff"
  );

  /* Approved preview contrast behavior: light team colors use dark copy. */
  const teamContrast = (hex) => {
    const raw = String(hex || "#000000").replace("#", "");
    const h = raw.length === 3
      ? raw.split("").map(c => c + c).join("")
      : raw.padEnd(6, "0").slice(0, 6);
    const n = parseInt(h, 16);
    const r = (n >> 16) & 255;
    const g = (n >> 8) & 255;
    const b = n & 255;
    const luminance = (0.299 * r) + (0.587 * g) + (0.114 * b);
    return luminance > 165 ? "#07172b" : "#ffffff";
  };

  teamPage.style.setProperty("--team-primary-text", teamContrast(brand.primary));
  teamPage.style.setProperty("--team-accent-text", teamContrast(brand.accent));

    .querySelectorAll(

    .forEach(button => {

          const destination =
            button.dataset.teamLink;

          /* Native Team Home routing */
          if (destination === "schedule" && typeof window.openNalTeamSchedule === "function") {
            window.openNalTeamSchedule(team.name || shortName);
            return;
          }

          if (destination === "stats" && typeof window.openNalStats === "function") {
            window.openNalStats("teams", team.name || shortName);
            return;
          }

          if (destination === "standings") {
            if (typeof openNalStandings === "function") {
              openNalStandings();
            } else if (typeof showPage === "function") {
              showPage("standingsPage");
              if (typeof renderNalStandings === "function") renderNalStandings();
              window.scrollTo({top:0,left:0,behavior:"instant"});
            }
            return;
          }

          if (destination === "roster" && typeof window.openNalRoster === "function") {
            window.openNalRoster(team.name || shortName);
            return;
          }

          if (destination === "transactions" && typeof window.openNalTransactions === "function") {
            window.openNalTransactions(team.name || shortName);
            return;
          }

          const url =
            team.footballShift &&
            team.footballShift[
              destination
            ];

          if (!url) {

            console.log(
              "No team URL available:",
              destination,
              team.name
            );

            return;
          }

          const sectionTitle =
            destination === "schedule"
              ? "SCHEDULE"
              : destination === "roster"
              ? "ROSTER"
              : destination === "stats"
              ? "STATS"
              : destination === "standings"
              ? "STANDINGS"
              : destination === "transactions"
              ? "TRANSACTIONS"
              : destination === "tickets"
              ? "TICKETS"
              : destination.toUpperCase();

          openArticle(
            url,
            {
              mode: "team",
              title: sectionTitle,
              subtitle: team.name || shortName,
              loadingText: `LOADING ${sectionTitle}`,
              brand: brand
            }
          );

        };

    });


  /* =====================================================
     SWITCH NAL HOME → TEAM HOME
     ===================================================== */

  pages.forEach(page => {

    page.classList.remove(
      "active"
    );

  });


  /* Teams directory uses inline display states, so explicitly restore Team Home. */
  teamPage.style.display = "block";
  teamPage.classList.add(
    "active"
  );


  /* Keep HOME highlighted in the bottom navigation */
  navButtons.forEach(button => {

    button.classList.remove(
      "active"
    );

  });


  const homeButton =
    document.querySelector(
      '[data-page="homePage"]'
    );


  if (homeButton) {

    homeButton.classList.add(
      "active"
    );

  }


  window.scrollTo({
    top: 0,
    left: 0,
    behavior: "instant"
  });

}

const NAL_POLL_SUPABASE_URL = "https://rcoaprzmutcwlpugobry.supabase.co";
const NAL_POLL_SUPABASE_KEY = "sb_publishable_tHzWH6oFoUemOrdLs_h9bw_UOLBP-yb";

let activeFanPoll = null;
let fanPollOptions = [];
let selectedFanPollOption = null;

function fanPollHeaders(extra = {}){
  return {
    "Accept": "application/json",
    ...extra
  };
}

function fanPollApiUrl(pathAndQuery){
  const separator = pathAndQuery.includes("?") ? "&" : "?";
  return `${NAL_POLL_SUPABASE_URL}/rest/v1/${pathAndQuery}${separator}apikey=${encodeURIComponent(NAL_POLL_SUPABASE_KEY)}`;
}

function getFanPollVoterId(){
  const key = "nal_fan_poll_voter_id";
  let voterId = localStorage.getItem(key);
  if (!voterId){
    voterId = (window.crypto && crypto.randomUUID)
      ? crypto.randomUUID()
      : "nal-" + Date.now() + "-" + Math.random().toString(36).slice(2);
    localStorage.setItem(key, voterId);
  }
  return voterId;
}

function fanPollVoteStorageKey(pollId){
  return "nal_fan_poll_voted_" + pollId;
}

function hasLocalFanPollVote(pollId){
  return !!localStorage.getItem(fanPollVoteStorageKey(pollId));
}

function rememberLocalFanPollVote(pollId, optionId){
  localStorage.setItem(fanPollVoteStorageKey(pollId), String(optionId));
}

function setFanPollStatus(message = "", isError = false){

async function loadActiveFanPoll(){
  const optionsHost = document.getElementById("fanPollOptions");
  const submit = document.getElementById("fanPollSubmit");
  const note = document.getElementById("fanPollResultsNote");
  const question = document.getElementById("fanPollQuestion");

  selectedFanPollOption = null;
  if (submit){
    submit.disabled = true;
    submit.hidden = false;
    submit.textContent = "SUBMIT VOTE";
  }
  if (note) note.hidden = true;
  if (optionsHost) optionsHost.innerHTML = '<div class="fan-poll-loading">LOADING POLL...</div>';
  setFanPollStatus("");

  try{
    const pollResponse = await fetch(
      fanPollApiUrl("polls?status=eq.active&select=id,question&order=id.desc&limit=1"),
      { method:"GET", mode:"cors", headers: fanPollHeaders(), cache:"no-store" }
    );
    if (!pollResponse.ok) {
      const detail = await pollResponse.text();
      throw new Error(`Poll connection error (${pollResponse.status})${detail ? ": " + detail.slice(0,120) : ""}`);
    }
    const polls = await pollResponse.json();
    if (!polls.length) throw new Error("There is no active fan poll right now.");

    activeFanPoll = polls[0];
    if (question) question.textContent = activeFanPoll.question;

    const optionResponse = await fetch(
      fanPollApiUrl(`poll_options?poll_id=eq.${activeFanPoll.id}&select=id,poll_id,option_name,image_url,display_order&order=display_order.asc`),
      { method:"GET", mode:"cors", headers: fanPollHeaders(), cache:"no-store" }
    );
    if (!optionResponse.ok) throw new Error("Unable to load poll choices.");
    fanPollOptions = await optionResponse.json();

    if (hasLocalFanPollVote(activeFanPoll.id)){
      await showFanPollResults();
    } else {
      renderFanPollChoices();
    }
  }catch(error){
    if (optionsHost) optionsHost.innerHTML = '<div class="fan-poll-loading">FAN POLL UNAVAILABLE</div>';
    if (submit) submit.hidden = true;
    const message = error && error.message ? error.message : "Unable to load the fan poll.";
    setFanPollStatus(message === "Load failed" || message === "Failed to fetch"
      ? "Unable to reach the Fan Poll server. Please refresh and try again."
      : message, true);
  }
}

function renderFanPollChoices(){
  const host = document.getElementById("fanPollOptions");
  const submit = document.getElementById("fanPollSubmit");
  if (!host) return;

  host.innerHTML = fanPollOptions.map(option => `
    <button class="fan-poll-option" type="button" data-poll-option="${option.id}" onclick="selectFanPollOption(${option.id})">
      <span class="fan-poll-option-media">
        <img src="${option.image_url || ""}" alt="${option.option_name}" loading="lazy">
      </span>
      <span class="fan-poll-option-name">${option.option_name}</span>
      <span class="fan-poll-check">✓</span>
    </button>
  `).join("");

  if (submit){
    submit.hidden = false;
    submit.disabled = true;
    submit.textContent = "SUBMIT VOTE";
  }
  setFanPollStatus("SELECT ONE TEAM TO CAST YOUR VOTE.");
}

function selectFanPollOption(optionId){
  selectedFanPollOption = Number(optionId);
  document.querySelectorAll("#fanPollOptions .fan-poll-option").forEach(button => {
    button.classList.toggle("selected", Number(button.dataset.pollOption) === selectedFanPollOption);
  });
  const submit = document.getElementById("fanPollSubmit");
  if (submit) submit.disabled = false;
  setFanPollStatus("");
}

async function submitFanPollVote(){
  if (!activeFanPoll || !selectedFanPollOption) return;

  const submit = document.getElementById("fanPollSubmit");
  if (submit){
    submit.disabled = true;
    submit.textContent = "SUBMITTING...";
  }

  try{
    let signedInUserId = null;
    let accessToken = null;

    try{
      const client = getNalAccountClient();
      const { data } = await client.auth.getSession();
      signedInUserId = data?.session?.user?.id || null;
      accessToken = data?.session?.access_token || null;
    }catch(accountError){
      signedInUserId = null;
      accessToken = null;
    }

    const votePayload = {
      poll_id: activeFanPoll.id,
      option_id: selectedFanPollOption,
      voter_id: getFanPollVoterId()
    };

    if (signedInUserId){
      votePayload.user_id = signedInUserId;
    }

    const requestHeaders = fanPollHeaders({
      "Content-Type":"application/json"
    });
    if (accessToken){
      requestHeaders.Authorization = `Bearer ${accessToken}`;
    }

    const response = await fetch(fanPollApiUrl("poll_votes"), {
      method:"POST",
      mode:"cors",
      headers: requestHeaders,
      body:JSON.stringify(votePayload)
    });

    if (!response.ok){
      const body = await response.text();
      if (response.status === 409 || body.includes("one_vote_per_poll_per_device")){
        rememberLocalFanPollVote(activeFanPoll.id, selectedFanPollOption);
        await showFanPollResults();
        setFanPollStatus("A vote from this device has already been recorded.");
        return;
      }
      throw new Error("Your vote could not be submitted. Please try again.");
    }

    rememberLocalFanPollVote(activeFanPoll.id, selectedFanPollOption);
    await showFanPollResults();
    if (signedInUserId) await loadNalVotingActivity();
    setFanPollStatus("VOTE COUNTED — THANK YOU FOR VOTING!");
  }catch(error){
    if (submit){
      submit.disabled = false;
      submit.textContent = "SUBMIT VOTE";
    }
    setFanPollStatus(error.message || "Unable to submit vote.", true);
  }
}

async function showFanPollResults(){
  if (!activeFanPoll) return;
  const host = document.getElementById("fanPollOptions");
  const submit = document.getElementById("fanPollSubmit");
  const note = document.getElementById("fanPollResultsNote");

  const response = await fetch(
    fanPollApiUrl(`poll_results?poll_id=eq.${activeFanPoll.id}&select=option_id,poll_id,option_name,image_url,display_order,votes&order=display_order.asc`),
    { method:"GET", mode:"cors", headers: fanPollHeaders(), cache:"no-store" }
  );
  if (!response.ok) throw new Error("Unable to load live poll results.");

  const results = await response.json();
  const totalVotes = results.reduce((sum,item) => sum + Number(item.votes || 0), 0);

  host.innerHTML = results.map(item => {
    const votes = Number(item.votes || 0);
    const percent = totalVotes ? Math.round((votes / totalVotes) * 100) : 0;
    return `
      <div class="fan-poll-result">
        <div class="fan-poll-result-top">
          <img class="fan-poll-result-logo" src="${item.image_url || ""}" alt="${item.option_name}" loading="lazy">
          <div class="fan-poll-result-name">${item.option_name}</div>
          <div class="fan-poll-result-count"><strong>${percent}%</strong>${votes} ${votes === 1 ? "VOTE" : "VOTES"}</div>
        </div>
        <div class="fan-poll-result-bar"><span style="width:${percent}%"></span></div>
      </div>
    `;
  }).join("");

  if (submit) submit.hidden = true;
  if (note){
    note.hidden = false;
    note.textContent = `LIVE FAN RESULTS • ${totalVotes} ${totalVotes === 1 ? "VOTE" : "VOTES"}`;
  }
}

    button.addEventListener("click", () => openNalForumCategory(button.dataset.forumCategory));
  });
}

async function openNalForumCategory(slug){
  const category = nalForumCategories.find(item => String(item.slug || item.id || "") === String(slug));
  if (!category) return;
  activeNalForumCategory = category;

  const section = document.getElementById("fanForumCategorySection");
  const name = document.getElementById("fanForumCategoryName");
  const description = document.getElementById("fanForumCategoryDescription");
  if (section) section.textContent = nalForumSectionLabel(category.section);
  if (name) name.textContent = category.name || "NAL COMMUNITY";

  closeNalForumComposer();
  showNalForumPage("fanForumCategoryPage");
  updateNalForumStartButton();

}

function updateNalForumStartButton(){
  const button = document.getElementById("fanForumStartButton");
  if (!button) return;
  const role = String(nalAccountProfile?.role || "fan").toLowerCase();
  const restricted = activeNalForumCategory?.section === "ask-the-nal" && !["moderator","admin"].includes(role);
  button.hidden = restricted;
}

function forumTopicValue(topic, names, fallback=""){
  for (const name of names){
    if (topic && topic[name] !== undefined && topic[name] !== null) return topic[name];
  }
  return fallback;
}

function formatNalForumTime(value){
  if (!value) return "";
  const d = new Date(value);
  if (Number.isNaN(d.getTime())) return "";
  const date = d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});
  const time = d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
  return `${date} at ${time}`;
}

function nalForumAuthorData(item){
  const profile = item?._forum_author || {};
  const name = profile.display_name || forumTopicValue(item,["author_display_name","display_name","author_name"],"NAL Fan");
  const avatar = profile.avatar_url || forumTopicValue(item,["avatar_url","author_avatar_url"],"");
  return { name:String(name || "NAL Fan"), avatar:String(avatar || "") };
}

function nalForumAuthorHTML(item,created){
  const author = nalForumAuthorData(item);
  const initial = (author.name.trim().charAt(0) || "N").toUpperCase();
  const avatar = author.avatar
    ? `<span class="fan-forum-author-avatar"><img src="${escapeHTML(author.avatar)}" alt="" loading="lazy"></span>`
    : `<span class="fan-forum-author-avatar" aria-hidden="true">${escapeHTML(initial)}</span>`;
  return `<div class="fan-forum-author-row">${avatar}<div class="fan-forum-author-copy"><span class="fan-forum-author-name">${escapeHTML(author.name)}</span>${created ? `<span class="fan-forum-author-time">${escapeHTML(created)}</span>` : ""}</div></div>`;
}

async function enrichNalForumAuthors(items){
  const rows = Array.isArray(items) ? items : [];
  const ids = [...new Set(rows.map(item => String(forumTopicValue(item,["user_id","author_id"],"") || "").trim()).filter(Boolean))];
  if (!ids.length) return rows;
  try{
    const client = getNalAccountClient();
    if (!client) return rows;
    const { data, error } = await client.from("profiles").select("id,display_name,avatar_url").in("id",ids);
    if (error) throw error;
    const profiles = new Map((Array.isArray(data)?data:[]).map(profile => [String(profile.id),profile]));
    rows.forEach(item => {
      const id = String(forumTopicValue(item,["user_id","author_id"],"") || "");
      if (profiles.has(id)) item._forum_author = profiles.get(id);
    });
  }catch(error){
    console.warn("Unable to load NAL Forum member display details:",error);
  }
  return rows;
}

async function loadNalForumTopics(){
  const host = document.getElementById("fanForumTopics");
  if (!host || !activeNalForumCategory) return;
  host.innerHTML = '<div class="fan-forum-loading">LOADING CONVERSATIONS…</div>';
  try{
    const client = getNalAccountClient();
    if (!client) throw new Error("NAL community connection unavailable.");
    const { data, error } = await client
      .from("forum_topics")
      .select("*")
      .eq("category_id", activeNalForumCategory.id)
      .order("is_pinned", { ascending:false })
      .order("created_at", { ascending:false });
    if (error) throw error;
    nalForumTopics = Array.isArray(data) ? data : [];
    await enrichNalForumAuthors(nalForumTopics);
    renderNalForumTopics();
  }catch(error){
    console.error("Unable to load NAL Forum topics:", error);
    host.innerHTML = '<div class="fan-forum-empty">Conversations are temporarily unavailable. Please try again.</div>';
  }
}

function renderNalForumTopics(){
  const host = document.getElementById("fanForumTopics");
  if (!host) return;
  const visible = nalForumTopics.filter(topic => !forumTopicValue(topic,["is_hidden","hidden"],false));
  if (!visible.length){
    host.innerHTML = '<div class="fan-forum-empty"><strong style="display:block;color:#07172b;margin-bottom:4px;">NO CONVERSATIONS YET</strong>Be the first to start one.</div>';
    return;
  }
  host.innerHTML = visible.map(topic => {
    const title = forumTopicValue(topic,["title","topic_title"],"NAL Conversation");
    const body = forumTopicValue(topic,["body","content","message"],"");
    const replies = Number(forumTopicValue(topic,["reply_count","replies_count"],0)) || 0;
    const created = formatNalForumTime(forumTopicValue(topic,["created_at","posted_at"],""));
    const tag = forumTopicValue(topic,["tag","tag_name","topic_tag"],"");
    const pinned = !!forumTopicValue(topic,["is_pinned","pinned"],false);
    const locked = !!forumTopicValue(topic,["is_locked","locked"],false);
    const topicId = escapeHTML(String(forumTopicValue(topic,["id"],"")));
    return `<article class="fan-forum-topic-card" role="button" tabindex="0" data-forum-topic="${topicId}">
      ${(pinned || locked || tag) ? `<div class="fan-forum-topic-flags">${pinned?'<span class="fan-forum-topic-flag red">PINNED</span>':''}${locked?'<span class="fan-forum-topic-flag">LOCKED</span>':''}${tag?`<span class="fan-forum-topic-flag">${escapeHTML(String(tag).toUpperCase())}</span>`:''}</div>` : ''}
      <h3>${escapeHTML(title)}</h3>
      ${body ? `<p class="fan-forum-topic-preview">${escapeHTML(body)}</p>` : ''}
      ${nalForumAuthorHTML(topic,created)}
      <div class="fan-forum-topic-meta">${replies} ${replies===1?'REPLY':'REPLIES'}</div>
    </article>`;
  }).join("");

  host.querySelectorAll("[data-forum-topic]").forEach(card => {
    const open = () => openNalForumThread(card.dataset.forumTopic);
    card.addEventListener("click", open);
    card.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " "){ event.preventDefault(); open(); }
    });
  });
}

function closeNalForumThread(){
  activeNalForumTopic = null;
  nalForumReplies = [];
  nalForumReactions = [];
  showNalForumPage("fanForumCategoryPage");
}

function updateNalForumReplyComposer(){
  const signedIn = document.getElementById("fanForumReplySignedIn");
  const login = document.getElementById("fanForumReplyLogin");
  const prompt = document.getElementById("fanForumReplyPrompt");
  const locked = !!forumTopicValue(activeNalForumTopic,["is_locked","locked"],false);
  if (locked){
    if (signedIn) signedIn.hidden = true;
    if (login) login.hidden = true;
    if (prompt) prompt.textContent = "This conversation is locked and is no longer accepting replies.";
    return;
  }
  if (nalAccountUser){
    if (signedIn) signedIn.hidden = false;
    if (login) login.hidden = true;
    if (prompt) prompt.textContent = "Add your reply below.";
  }else{
    if (signedIn) signedIn.hidden = true;
    if (login) login.hidden = false;
    if (prompt) prompt.textContent = "Sign in to post a reply.";
  }
}

  if (!topic) return;
  activeNalForumTopic = topic;

  const category = document.getElementById("fanForumThreadCategory");

  showNalForumPage("fanForumThreadPage");
  nalForumReactions = [];
  renderNalForumThreadPost();
  updateNalForumReplyComposer();
  await loadNalForumReplies();
  await loadNalForumReactions();
}

function renderNalForumThreadPost(){
  const host = document.getElementById("fanForumThreadPost");
  if (!host || !activeNalForumTopic) return;

  const locked = !!forumTopicValue(activeNalForumTopic,["is_locked","locked"],false);
  host.innerHTML = `${(pinned || locked) ? `<div class="fan-forum-topic-flags">${pinned?'<span class="fan-forum-topic-flag red">PINNED</span>':''}${locked?'<span class="fan-forum-topic-flag">LOCKED</span>':''}</div>` : ''}<h1>${escapeHTML(title)}</h1>${nalForumAuthorHTML(activeNalForumTopic,created)}${body ? `<div class="fan-forum-thread-body">${escapeHTML(body)}</div>` : ''}${nalForumReactionHTML("topic",activeNalForumTopic.id)}`;

async function loadNalForumReplies(){
  const host = document.getElementById("fanForumReplies");

    if (error) throw error;

    await enrichNalForumAuthors(nalForumReplies);

  }catch(error){

    host.innerHTML = '<div class="fan-forum-empty">Replies are temporarily unavailable. Please try again.</div>';
  }
}

function renderNalForumReplies(){
  const host = document.getElementById("fanForumReplies");
  const count = document.getElementById("fanForumReplyCount");
  if (!host) return;
  const visible = nalForumReplies.filter(reply => !forumTopicValue(reply,["is_hidden","hidden"],false));
  if (count) count.textContent = `${visible.length} ${visible.length===1?"REPLY":"REPLIES"}`;

function nalForumReactionRows(type,id){
  const key = type === "topic" ? "topic_id" : "reply_id";
  return nalForumReactions.filter(row => String(row?.[key]) === String(id));
}

function nalForumReactionHTML(type,id){
  const rows = nalForumReactionRows(type,id);
  const liked = !!nalAccountUser && rows.some(row => String(row.user_id) === String(nalAccountUser.id));
  const pendingKey = `${type}:${id}`;
  return `<div class="fan-forum-reactions"><button type="button" class="fan-forum-like${liked ? " liked" : ""}" data-forum-reaction-type="${type}" data-forum-reaction-id="${escapeHTML(String(id))}" aria-pressed="${liked ? "true" : "false"}"${nalForumReactionPending.has(pendingKey) ? " disabled" : ""}><span class="fan-forum-like-icon" aria-hidden="true">👍</span><span>${liked ? "LIKED" : "LIKE"}</span><span class="fan-forum-like-count">${rows.length}</span></button><button type="button" class="fan-forum-report" data-forum-report-type="${type}" data-forum-report-id="${escapeHTML(String(id))}"><span class="fan-forum-report-icon" aria-hidden="true">⚑</span><span>REPORT</span></button></div>`;
}

function bindNalForumReactionButtons(root){
  if (!root) return;
  root.querySelectorAll("[data-forum-reaction-type][data-forum-reaction-id]").forEach(button => {
    button.addEventListener("click", event => {
      event.preventDefault();
      event.stopPropagation();
      toggleNalForumReaction(button.dataset.forumReactionType,button.dataset.forumReactionId);
    });
  });
  root.querySelectorAll("[data-forum-report-type][data-forum-report-id]").forEach(button => {
    button.addEventListener("click", event => {
      event.preventDefault();
      event.stopPropagation();
      openNalForumReport(button.dataset.forumReportType,button.dataset.forumReportId);
    });
  });
}

let nalForumReportTarget = null;

async function openNalForumReport(type,id){
  if (!nalAccountUser){ await openFanAccount(); return; }
  if (type !== "topic" && type !== "reply") return;
  nalForumReportTarget = {type,id};
  let modal = document.getElementById("fanForumReportModal");
  if (!modal){
    modal = document.createElement("div");
    modal.id = "fanForumReportModal";
    modal.className = "fan-forum-report-modal";
    modal.hidden = true;
    modal.innerHTML = `<div class="fan-forum-report-dialog" role="dialog" aria-modal="true" aria-labelledby="fanForumReportTitle">
      <h3 id="fanForumReportTitle">REPORT CONTENT</h3>
      <p>Tell the NAL moderation team why this content should be reviewed. Reporting does not automatically remove the content.</p>
      <label for="fanForumReportReason">REASON FOR REPORT</label>
      <select id="fanForumReportReason">
        <option value="">Select a reason...</option>
        <option value="Spam">Spam</option>
        <option value="Harassment / Inappropriate Content">Harassment / Inappropriate Content</option>
        <option value="Offensive Language">Offensive Language</option>
        <option value="Impersonation">Impersonation</option>
        <option value="Other">Other</option>
      </select>
      <div class="fan-forum-report-actions">
        <button type="button" class="fan-forum-report-cancel" onclick="closeNalForumReport()">CANCEL</button>
        <button id="fanForumReportSubmit" type="button" class="fan-forum-report-submit" onclick="submitNalForumReport()">SUBMIT REPORT</button>
      </div>
      <div id="fanForumReportStatus" class="fan-forum-report-status" aria-live="polite"></div>
    </div>`;
    modal.addEventListener("click", event => { if (event.target === modal) closeNalForumReport(); });
    document.body.appendChild(modal);
  }
  const reason = document.getElementById("fanForumReportReason");
  const status = document.getElementById("fanForumReportStatus");
  const submit = document.getElementById("fanForumReportSubmit");
  if (reason) reason.value = "";
  if (status){ status.textContent = ""; status.className = "fan-forum-report-status"; }
  if (submit) submit.disabled = false;
  modal.hidden = false;
  setTimeout(() => reason?.focus(),0);
}

function closeNalForumReport(){
  const modal = document.getElementById("fanForumReportModal");
  if (modal) modal.hidden = true;
  nalForumReportTarget = null;
}

async function submitNalForumReport(){
  if (!nalAccountUser){ closeNalForumReport(); await openFanAccount(); return; }
  if (!nalForumReportTarget) return;
  const reason = String(document.getElementById("fanForumReportReason")?.value || "").trim();
  const status = document.getElementById("fanForumReportStatus");
  const submit = document.getElementById("fanForumReportSubmit");
  if (!reason){
    if (status){ status.textContent = "Please select a reason for the report."; status.className = "fan-forum-report-status error"; }
    return;
  }
  if (submit) submit.disabled = true;
  if (status){ status.textContent = "Submitting report…"; status.className = "fan-forum-report-status"; }
  try{
    const client = getNalAccountClient();
    if (!client) throw new Error("NAL community connection unavailable.");
    const {type,id} = nalForumReportTarget;
    let check = client.from("forum_reports").select("id").eq("reporter_user_id",nalAccountUser.id);
    check = type === "topic" ? check.eq("topic_id",id) : check.eq("reply_id",id);
    const {data:existing,error:checkError} = await check.limit(1);
    if (checkError) throw checkError;
    if (Array.isArray(existing) && existing.length){
      if (status){ status.textContent = "You have already reported this content. Our moderation team will review it."; status.className = "fan-forum-report-status success"; }
      if (submit) submit.disabled = false;
      return;
    }
    const payload = {reporter_user_id:nalAccountUser.id,topic_id:null,reply_id:null,reason};
    if (type === "topic") payload.topic_id = id;
    else payload.reply_id = id;
    const {error} = await client.from("forum_reports").insert(payload);
    if (error) throw error;
    if (status){ status.textContent = "Report submitted. Our moderation team will review it."; status.className = "fan-forum-report-status success"; }
    if (submit) submit.disabled = true;
    setTimeout(closeNalForumReport,1200);
  }catch(error){
    console.error("Unable to submit NAL Forum report:",error);
    if (status){ status.textContent = error?.message || "Your report could not be submitted. Please try again."; status.className = "fan-forum-report-status error"; }
    if (submit) submit.disabled = false;
  }
}

async function loadNalForumReactions(){
  if (!activeNalForumTopic) return;
  try{
    const client = getNalAccountClient();
    if (!client) throw new Error("NAL community connection unavailable.");
    const replyIds = nalForumReplies.map(reply => reply.id).filter(id => id !== null && id !== undefined);
    const topicRequest = client.from("forum_reactions").select("id,user_id,topic_id,reply_id").eq("topic_id",activeNalForumTopic.id);
    const replyRequest = replyIds.length
      ? client.from("forum_reactions").select("id,user_id,topic_id,reply_id").in("reply_id",replyIds)
      : Promise.resolve({data:[],error:null});
    const [topicResult,replyResult] = await Promise.all([topicRequest,replyRequest]);
    if (topicResult.error) throw topicResult.error;
    if (replyResult.error) throw replyResult.error;
    nalForumReactions = [...(topicResult.data || []),...(replyResult.data || [])];
    renderNalForumThreadPost();
    renderNalForumReplies();
  }catch(error){
    console.error("Unable to load NAL Forum reactions:",error);
  }
}

async function toggleNalForumReaction(type,id){
  if (!nalAccountUser){ await openFanAccount(); return; }
  if (type !== "topic" && type !== "reply") return;
  const pendingKey = `${type}:${id}`;
  if (nalForumReactionPending.has(pendingKey)) return;
  nalForumReactionPending.add(pendingKey);
  renderNalForumThreadPost();
  renderNalForumReplies();
  try{
    const client = getNalAccountClient();
    if (!client) throw new Error("NAL community connection unavailable.");
    const rows = nalForumReactionRows(type,id);
    const existing = rows.find(row => String(row.user_id) === String(nalAccountUser.id));
    if (existing){
      const { error } = await client.from("forum_reactions").delete().eq("id",existing.id).eq("user_id",nalAccountUser.id);
      if (error) throw error;
    }else{
      const payload = {user_id:nalAccountUser.id,topic_id:null,reply_id:null};
      if (type === "topic") payload.topic_id = id;
      else payload.reply_id = id;
      const { error } = await client.from("forum_reactions").insert(payload);
      if (error && String(error.code || "") !== "23505") throw error;
    }
    await loadNalForumReactions();
  }catch(error){
    console.error("Unable to update NAL Forum reaction:",error);
    window.alert("Your like could not be updated. Please try again.");
  }finally{
    nalForumReactionPending.delete(pendingKey);
    renderNalForumThreadPost();
    renderNalForumReplies();
  }
}

async function submitNalForumReply(){
  if (!nalAccountUser){ await openFanAccount(); return; }
  if (!activeNalForumTopic) return;
  const input = document.getElementById("fanForumReplyBody");
  const submit = document.getElementById("fanForumReplySubmit");
  const status = document.getElementById("fanForumReplyStatus");
  const body = String(input?.value || "").trim();
  if (body.length < 2){ if(status){status.textContent="Write a reply before posting.";status.className="fan-forum-compose-status error";} return; }
  if (submit) submit.disabled = true;
  if (status){status.textContent="Posting reply…";status.className="fan-forum-compose-status";}
  try{
    const client = getNalAccountClient();
    const { error } = await client.from("forum_replies").insert({topic_id:activeNalForumTopic.id,user_id:nalAccountUser.id,body});
    if (error) throw error;
    if (input) input.value="";
    if (status){status.textContent="Reply posted.";status.className="fan-forum-compose-status success";}
    await loadNalForumReplies();
    await loadNalForumReactions();
    await loadNalForumTopics();
  }catch(error){
    console.error("Unable to post NAL Forum reply:",error);
    if (status){status.textContent=error?.message || "Reply could not be posted. Please try again.";status.className="fan-forum-compose-status error";}
  }finally{ if (submit) submit.disabled = false; }
}

async function openNalForumComposer(){
  if (!nalAccountUser){
    await openFanAccount();
    return;
  }
  const role = String(nalAccountProfile?.role || "fan").toLowerCase();
  if (activeNalForumCategory?.section === "ask-the-nal" && !["moderator","admin"].includes(role)){
    window.alert("Ask the NAL conversations are opened by NAL moderators and administrators.");
    return;
  }
  const composer = document.getElementById("fanForumComposer");
  if (composer){ composer.hidden = false; composer.scrollIntoView({behavior:"smooth",block:"nearest"}); }

function closeNalForumComposer(){
  const composer = document.getElementById("fanForumComposer");
  if (composer) composer.hidden = true;
  const status = document.getElementById("fanForumComposeStatus");
  if (status){ status.textContent=""; status.className="fan-forum-compose-status"; }
}

async function submitNalForumTopic(){
  if (!nalAccountUser || !activeNalForumCategory) return;
  const titleInput = document.getElementById("fanForumTopicTitle");
  const bodyInput = document.getElementById("fanForumTopicBody");
  const submit = document.getElementById("fanForumTopicSubmit");
  const status = document.getElementById("fanForumComposeStatus");
  const title = String(titleInput?.value || "").trim();
  const body = String(bodyInput?.value || "").trim();
  if (title.length < 4 || body.length < 2){
    if (status){ status.textContent="Add a topic title and post before submitting."; status.className="fan-forum-compose-status error"; }
    return;
  }
  if (submit) submit.disabled = true;
  if (status){ status.textContent="Posting conversation…"; status.className="fan-forum-compose-status"; }
  try{
    const client = getNalAccountClient();
    const payload = { category_id:activeNalForumCategory.id, author_id:nalAccountUser.id, title, body };
    const { error } = await client.from("forum_topics").insert(payload);
    if (error) throw error;
    if (titleInput) titleInput.value="";
    if (bodyInput) bodyInput.value="";
    if (status){ status.textContent="Conversation posted."; status.className="fan-forum-compose-status success"; }
    await loadNalForumTopics();
    setTimeout(closeNalForumComposer,500);
  }catch(error){
    console.error("Unable to create NAL Forum topic:", error);
    if (status){ status.textContent=error?.message || "Conversation could not be posted. Please try again."; status.className="fan-forum-compose-status error"; }
  }finally{
    if (submit) submit.disabled = false;
  }
}

/* =========================================================
   FAN PHOTOS
   Data source: data/fan-media.json
   The page keeps its built-in placeholder if the feed is
   unavailable or there is not yet an approved feature.
========================================================= */
const FAN_MEDIA_FEED = "data/fan-media.json";

function getFanMediaValue(item, keys, fallback = ""){
  for (const key of keys){
    const value = item?.[key];
    if (value !== undefined && value !== null && String(value).trim() !== ""){
      return String(value).trim();
    }
  }
  return fallback;
}

function normalizeFanMediaFeed(payload){
  if (Array.isArray(payload)) return payload;
  if (Array.isArray(payload?.items)) return payload.items;
  if (Array.isArray(payload?.media)) return payload.media;
  if (Array.isArray(payload?.submissions)) return payload.submissions;
  if (payload?.featured && typeof payload.featured === "object") return [payload.featured];
  return [];
}

let fanPhotos = [];
let fanPhotoIndex = 0;
let fanPhotoTimer = null;

function renderFanPhotoPlaceholder(){
  const imageHost = document.getElementById("fanPhotoWeekImage");
  const name = document.getElementById("fanPhotoWeekName");
  const team = document.getElementById("fanPhotoWeekTeam");
  const caption = document.getElementById("fanPhotoWeekCaption");

  if (team) team.textContent = "NAL FAN";
  if (name) name.textContent = "FAN PHOTO OF THE WEEK";
  if (caption) caption.textContent = "Submit your NAL fan photo for a chance to be featured.";

  if (imageHost) {
    imageHost.innerHTML = `
      <div class="fan-photo-placeholder">
        <div class="fan-photo-placeholder-icon">▣</div>
        <div class="fan-photo-placeholder-title">FAN PHOTO</div>
        <div class="fan-photo-placeholder-subtitle">FROM THE NAL COMMUNITY</div>
      </div>
    `;
  }
}

function renderFanPhoto(item){
  if (!item) {
    renderFanPhotoPlaceholder();
    return;
  }

  const imageHost = document.getElementById("fanPhotoWeekImage");
  const name = document.getElementById("fanPhotoWeekName");
  const team = document.getElementById("fanPhotoWeekTeam");
  const caption = document.getElementById("fanPhotoWeekCaption");

  const fanName = getFanMediaValue(item, ["name", "fanName", "fan_name"], "NAL FAN");
  const fanCaption = getFanMediaValue(item, ["caption", "story", "description"], "");
  const mediaUrl = getFanMediaValue(
    item,
    ["media", "imageUrl", "image_url", "photoUrl", "photo_url", "url", "image"]
  );
  const mediaType = getFanMediaValue(item, ["type", "mediaType", "media_type"], "Photo/Image").toLowerCase();

  if (name) name.textContent = fanName;
  if (team) team.textContent = "FAN PHOTO OF THE WEEK";
  if (caption) caption.textContent = fanCaption || "Featured from the NAL community.";

  if (!imageHost || !mediaUrl) {
    renderFanPhotoPlaceholder();
    return;
  }

  imageHost.innerHTML = "";

  if (mediaType.includes("video")) {
    const video = document.createElement("video");
    video.src = mediaUrl;
    video.controls = true;
    video.playsInline = true;
    video.preload = "metadata";
    video.style.width = "100%";
    video.style.height = "100%";
    video.style.objectFit = "contain";
    video.style.background = "#07172b";
    video.addEventListener("error", renderFanPhotoPlaceholder);
    imageHost.appendChild(video);
  } else {
    const img = document.createElement("img");
    img.src = mediaUrl;
    img.alt = `${fanName} — NAL Fan Photo of the Week`;
    img.loading = "eager";
    img.style.width = "100%";
    img.style.height = "100%";
    img.style.objectFit = "contain";
    img.style.background = "#07172b";
    img.addEventListener("error", renderFanPhotoPlaceholder);
    imageHost.appendChild(img);
  }
}

function isFanPhotoOfTheWeek(item){
  const featured = getFanMediaValue(item, ["featured"], "").trim().toLowerCase();
  return featured === "fan photo of the week";
}

async function loadFanPhotos(){
  try {
    const response = await fetch(`${FAN_MEDIA_FEED}?ts=${Date.now()}`, { cache: "no-store" });
    if (!response.ok) throw new Error("Fan media feed unavailable");

    const payload = await response.json();
    const approvedMedia = normalizeFanMediaFeed(payload).filter(item =>
      getFanMediaValue(item, ["media", "imageUrl", "image_url", "photoUrl", "photo_url", "url", "image"])
    );

    /* Exactly ONE weekly feature:
       only an approved item whose Monday "Featured" value is
       "Fan Photo of the Week" can appear here. No rotation. */
    const featuredItems = approvedMedia
      .filter(isFanPhotoOfTheWeek)
      .sort((a,b) => {
        const ad = Date.parse(getFanMediaValue(a, ["date"], "")) || 0;
        const bd = Date.parse(getFanMediaValue(b, ["date"], "")) || 0;
        return bd - ad;
      });

    fanPhotos = featuredItems;

    if (!featuredItems.length) {
      renderFanPhotoPlaceholder();
      return;
    }

    renderFanPhoto(featuredItems[0]);
  } catch (error) {
    console.warn("Fan Photo of the Week is using the built-in placeholder.", error);
    renderFanPhotoPlaceholder();
  }
}
