let nalFanMediaItems = [];

async function loadFanMediaGallery(){
  const gallery = document.getElementById("fanMediaGallery");
  if(!gallery) return;

  try{
    const response = await fetch("data/fan-media.json?ts=" + Date.now(), {cache:"no-store"});
    if(!response.ok) throw new Error("Fan media feed unavailable");

    const items = await response.json();
    nalFanMediaItems = Array.isArray(items) ? items : [];

    if(!nalFanMediaItems.length){
      gallery.innerHTML = '<div class="fan-gallery-empty">NO APPROVED FAN MEDIA YET.</div>';
      return;
    }

    gallery.innerHTML = nalFanMediaItems.map(item => {
      const media = String(item.media || "");
      const type = String(item.type || "").toLowerCase();
      const isVideo = type.includes("video") || /\.(mp4|webm|mov)(\?|$)/i.test(media);
      const safeName = escapeFanGalleryHTML(item.name || "NAL Fan");
      const safeCaption = escapeFanGalleryHTML(item.caption || "");
      const safeMedia = escapeFanGalleryHTML(media);

      const mediaHTML = isVideo
        ? `<video src="${safeMedia}" controls preload="metadata" playsinline></video>`
        : `<img src="${safeMedia}" alt="Fan submission from ${safeName}" loading="lazy">`;

      return `
        <article class="fan-media-item">
          <div class="fan-media-item-media">${mediaHTML}</div>
          <div class="fan-media-item-copy">
            <strong>${safeName}</strong>
            ${safeCaption ? `<p>${safeCaption}</p>` : ""}
          </div>
        </article>`;
    }).join("");
  }catch(error){
    gallery.innerHTML = '<div class="fan-gallery-empty">FAN MEDIA IS TEMPORARILY UNAVAILABLE.</div>';
  }
}

function escapeFanGalleryHTML(value){
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function getTeamFootballShiftId(team){
  if (!team) return "";

  if (team.slug && TEAM_FOOTBALLSHIFT_IDS[team.slug]) {
    return TEAM_FOOTBALLSHIFT_IDS[team.slug];
  }

  const candidates = [
    team.name,
    team.teamName,
    team.shortName,
    team.displayName
  ].filter(Boolean);

  for (const value of candidates) {
    const key = String(value).trim().toLowerCase();
    if (TEAM_FOOTBALLSHIFT_NAME_IDS[key]) {
      return TEAM_FOOTBALLSHIFT_NAME_IDS[key];
    }
  }

  return "";
}

function getTeamFootballShiftURL(team, destination){
  if (!team) return "";

  /* Standings is league-wide and should work from every Team Home page. */
  if (destination === "standings") return NAL_STANDINGS_URL;

  const id = getTeamFootballShiftId(team);
  if (!id) return "";

  const base = "https://www.thenationalarenaleague.com/stats#/1200/team/" + id;

  if (destination === "schedule") return base + "/schedule";
  if (destination === "roster") return base + "/roster";
  if (destination === "stats") return base + "/stats";

  return "";
}

    host.className = "fan-member-vote-empty";
    host.textContent = "Voting activity is temporarily unavailable.";

}

function renderNalFanProfile(){
  if (!nalAccountUser) return;

  const displayName =
    nalAccountProfile?.display_name ||
    nalAccountUser.user_metadata?.display_name ||
    "NAL FAN";

  const favoriteTeam =
    nalAccountProfile?.favorite_team ||
    nalAccountUser.user_metadata?.favorite_team ||
    "";

  const display = document.getElementById("fanProfileDisplayName");
  const email = document.getElementById("fanProfileEmail");
  const favorite = document.getElementById("fanProfileFavoriteTeam");
  const initial = document.getElementById("fanProfileInitial");

  if (display) display.textContent = displayName;
  if (email) email.textContent = nalAccountUser.email || "";
  if (favorite) favorite.textContent = favoriteTeam || "NOT SELECTED";
  if (initial) initial.textContent = (displayName.trim().charAt(0) || "N").toUpperCase();

  const memberDisplay = document.getElementById("fanMemberDisplayNameValue");
  const memberFavorite = document.getElementById("fanMemberFavoriteTeamValue");
  const avatarImage = document.getElementById("fanMemberAvatarImage");
  if (memberDisplay) memberDisplay.textContent = displayName;
  if (memberFavorite) memberFavorite.textContent = favoriteTeam || "NOT SELECTED";

  const adminArea = document.getElementById("fanAdminArea");

  if (adminArea) adminArea.hidden = !isAdmin;

  }
}

function updateHeaderAccountState(){

  }

  const name =

async function initializeNalFanAccount(){
  try{
    const client = getNalAccountClient();
    const { data } = await client.auth.getSession();

    nalAccountUser = data?.session?.user || null;

    if (nalAccountUser){
      await loadNalFanProfile(nalAccountUser);
      await loadNalAlerts();
    } else {
      updateHeaderAccountState();
      setNalNotificationBadge(0);
    }

    client.auth.onAuthStateChange(async (event, session) => {
      nalAccountUser = session?.user || null;

      if (nalAccountUser){
        setTimeout(async () => {
          await loadNalFanProfile(nalAccountUser);
          await loadNalAlerts();
        }, 0);
      } else {
        nalAccountProfile = null;
        nalNotifications = [];
        nalNotificationReadIds = new Set();
        updateHeaderAccountState();
        setNalNotificationBadge(0);
      }
    });
  } catch(error){
    console.error("NAL account initialization error:", error);
  }
}

document.getElementById("fanSignUpForm")?.addEventListener("submit", async function(event){
  event.preventDefault();
  setFanAccountMessage("");

  const displayName = document.getElementById("fanSignUpDisplayName").value.trim();
  const email = document.getElementById("fanSignUpEmail").value.trim();
  const password = document.getElementById("fanSignUpPassword").value;
  const confirmPassword = document.getElementById("fanSignUpPasswordConfirm").value;
  const favoriteTeam = document.getElementById("fanSignUpFavoriteTeam").value;
  const termsAccepted = document.getElementById("fanTermsAccepted").checked;
  const guidelinesAccepted = document.getElementById("fanGuidelinesAccepted").checked;
  const privacyAccepted = document.getElementById("fanPrivacyAccepted").checked;
  const submit = this.querySelector('button[type="submit"]');

  if (displayName.length < 3 || displayName.length > 30){
    setFanAccountMessage("Display Name must be between 3 and 30 characters.", true);
    return;
  }

  if (password.length < 8){
    setFanAccountMessage("Password must be at least 8 characters.", true);
    return;
  }

  if (password !== confirmPassword){
    setFanAccountMessage("The passwords do not match.", true);
    return;
  }

  if (!termsAccepted || !guidelinesAccepted || !privacyAccepted){
    setFanAccountMessage("Please accept the Terms of Use, Community Guidelines, and Privacy Policy.", true);
    return;
  }

  submit.disabled = true;
  submit.textContent = "CREATING ACCOUNT...";

  try{
    const client = getNalAccountClient();

    const { data: existingProfile, error: nameCheckError } = await client
      .from("profiles")
      .select("id")
      .ilike("display_name", displayName)
      .limit(1);

    if (nameCheckError) throw nameCheckError;

    if (existingProfile && existingProfile.length){
      setFanAccountMessage("That Display Name is already in use. Please choose another.", true);
      return;
    }

    const { data, error } = await client.auth.signUp({
      email,
      password,
      options:{
        emailRedirectTo: "https://mntr-lab.github.io/nal-mobile-app/",
        data:{
          display_name: displayName,
          favorite_team: favoriteTeam,
          terms_accepted: true,
          community_guidelines_accepted: true,
          privacy_policy_accepted: true
        }
      }
    });

    if (error) throw error;

    if (data?.session && data?.user){
      nalAccountUser = data.user;
      await loadNalFanProfile(data.user);
      setFanAccountView("profile");
    } else {
      setFanAccountView("checkemail");
    }

    this.reset();
  } catch(error){
    let message = error?.message || "We could not create your account.";
    if (/database error saving new user/i.test(message)){
      message = "We could not create that account. The Display Name may already be in use.";
    }
    setFanAccountMessage(message, true);
  } finally{
    submit.disabled = false;
    submit.textContent = "CREATE ACCOUNT";
  }
});

document.getElementById("fanDeleteAccountButton")?.addEventListener("click", async function(){
  if (!nalAccountUser){
    setFanAccountMessage("Please sign in before requesting account deletion.", true);
    return;
  }

  const displayName = nalAccountProfile?.display_name || "NAL Fan";
  const accountEmail = nalAccountUser?.email || "";

  const confirmed = window.confirm(
    "Request deletion of your NAL Fan Account?\n\n" +
    "This sends an account deletion request for review. Your account will NOT be deleted immediately. " +
    "After the request is recorded, your email app will open with a prepared message to NAL App Support."
  );
  if (!confirmed) return;

  const button = this;
  const originalText = button.textContent;
  button.disabled = true;
  button.textContent = "SUBMITTING REQUEST...";

  try{
    const client = getNalAccountClient();

    const { data: existing, error: existingError } = await client
      .from("account_deletion_requests")
      .select("id,status,requested_at")
      .eq("user_id", nalAccountUser.id)
      .maybeSingle();

    if (existingError) throw existingError;

    if (!existing){
      const { error: insertError } = await client
        .from("account_deletion_requests")
        .insert({
          user_id: nalAccountUser.id,
          status: "pending"
        });

      if (insertError) throw insertError;
    } else if (existing.status !== "pending"){
      throw new Error("A previous account deletion request already exists for this account.");
    }

    const subject = "NAL Fan Account Deletion Request";
    const body = [
      "NAL Fan Account Deletion Request",
      "",
      "Display Name: " + displayName,
      "Account Email: " + accountEmail,
      "",
      "I am requesting deletion of my NAL Fan Account.",
      "",
      "This request was initiated while signed in to the account."
    ].join("\n");

    setFanAccountMessage(
      existing
        ? "Your account deletion request is already pending. Opening your email app so you can contact NAL App Support."
        : "Your account deletion request has been recorded. Opening your email app so you can contact NAL App Support.",
      false
    );

    window.location.href =
      "mailto:appsupport@thenationalarenaleague.com?subject=" +
      encodeURIComponent(subject) +
      "&body=" +
      encodeURIComponent(body);

  } catch(error){
    console.error("NAL account deletion request error:", error);
    setFanAccountMessage(
      "We could not submit your account deletion request. Please try again.",
      true
    );
  } finally{
    button.disabled = false;
    button.textContent = originalText;
  }
});

(function(){
  const openButton=document.getElementById("fanAdminNotificationButton");
  const panel=document.getElementById("fanAdminNotificationPanel");

  const type=document.getElementById("fanAdminNotificationType");
  const audience=document.getElementById("fanAdminNotificationAudience");

  const previewButton=document.getElementById("fanAdminNotificationPreview");
  const previewBox=document.getElementById("fanAdminNotificationPreviewBox");
  const sendButton=document.getElementById("fanAdminNotificationSend");
  const status=document.getElementById("fanAdminNotificationMessageStatus");

  function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
  function setStatus(text,isError=false){if(!status)return;status.textContent=text||"";status.className="fan-admin-notify-message"+(text?(isError?" error":" success"):"");}
  function syncAudience(){if(teamField)teamField.hidden=audience?.value!=="team";}
  function values(){return {notificationType:type?.value||"league",targetType:audience?.value||"all",targetTeam:audience?.value==="team"?(team?.value||"").trim():null,title:(title?.value||"").trim(),message:(message?.value||"").trim(),actionUrl:(url?.value||"").trim()||null};}
  function validate(v){if(!v.title)return "Enter a notification title.";if(!v.message)return "Enter a notification message.";if(v.targetType==="team"&&!v.targetTeam)return "Select the team that should receive this alert.";if(v.actionUrl){try{const parsed=new URL(v.actionUrl);if(!/^https?:$/.test(parsed.protocol))throw new Error();}catch(e){return "Enter a valid http:// or https:// action link.";}}return "";}
  function renderPreview(){const v=values(),problem=validate(v);if(problem){setStatus(problem,true);previewBox?.classList.remove("show");return false;}setStatus("");const audienceText=v.targetType==="all"?"EVERYONE":"FANS OF "+v.targetTeam.toUpperCase();previewBox.innerHTML='<small>'+esc(v.notificationType.toUpperCase())+' • '+esc(audienceText)+'</small><b>'+esc(v.title)+'</b><p>'+esc(v.message)+'</p>'+(v.actionUrl?'<span>ACTION LINK: '+esc(v.actionUrl)+'</span>':'');previewBox.classList.add("show");return true;}

  audience?.addEventListener("change",syncAudience);
  previewButton?.addEventListener("click",renderPreview);
  [type,audience,team,title,message,url].forEach(el=>el?.addEventListener("input",()=>{setStatus("");previewBox?.classList.remove("show");}));

  openButton?.addEventListener("click",function(){
    if(document.getElementById("fanAdminArea")?.hidden||nalAccountProfile?.role!=="admin")return;
    document.getElementById("fanAdminUsersPanel")?.classList.remove("show");
    document.getElementById("fanAdminActivityPanel")?.classList.remove("show");
    panel?.classList.toggle("show");
    syncAudience();
    if(panel?.classList.contains("show"))setTimeout(()=>panel.scrollIntoView({behavior:"smooth",block:"nearest"}),50);
  });

  form?.addEventListener("submit",async function(event){
    event.preventDefault();
    if(nalAccountProfile?.role!=="admin"){setStatus("Only an active NAL Admin can send notifications.",true);return;}
    const v=values(),problem=validate(v);if(problem){setStatus(problem,true);return;}
    const audienceText=v.targetType==="all"?"ALL NAL App users":"fans of "+v.targetTeam;
    if(!window.confirm('Send this alert to '+audienceText+'?\
\
"'+v.title+'"\
\
This notification will publish immediately.'))return;
    const original=sendButton.textContent;sendButton.disabled=true;sendButton.textContent="SENDING...";setStatus("");
    try{
      const client=getNalAccountClient();
      const {error}=await client.rpc("admin_create_notification",{p_title:v.title,p_message:v.message,p_notification_type:v.notificationType,p_target_type:v.targetType,p_target_team:v.targetTeam,p_action_url:v.actionUrl});
      if(error)throw error;
      setStatus("Notification sent successfully.");
      form.reset();syncAudience();previewBox?.classList.remove("show");
      if(typeof loadNalAlerts==="function")await loadNalAlerts();
    }catch(error){
      console.error("NAL Admin notification error:",error);
      setStatus(error?.message?"Notification was not sent: "+error.message:"Notification was not sent. Please try again.",true);
    }finally{sendButton.disabled=false;sendButton.textContent=original;}
  });
  syncAudience();
})();


/* NAL ADMIN — activity log. */
(function(){
  const button=document.getElementById("fanAdminActivityButton");
  const panel=document.getElementById("fanAdminActivityPanel");
  const list=document.getElementById("fanAdminActivityList");
  const search=document.getElementById("fanAdminActivitySearch");
  let entries=[];

  function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
  function label(v){return ({role_changed:"ROLE CHANGED",account_suspended:"ACCOUNT SUSPENDED",account_restored:"ACCOUNT RESTORED",account_banned:"ACCOUNT BANNED",account_deleted:"ACCOUNT DELETED"})[v]||String(v||"ADMIN ACTION").replaceAll("_"," ").toUpperCase();}
  function when(v){const d=new Date(v);return Number.isNaN(d.getTime())?"":d.toLocaleString(undefined,{year:"numeric",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});}

  function render(){
    if(!list)return;
    const q=(search?.value||"").trim().toLowerCase();
    const rows=entries.filter(e=>!q||[e.target_display_name,e.target_email,e.action_type,e.old_value,e.new_value].some(v=>String(v||"").toLowerCase().includes(q)));
    if(!rows.length){list.innerHTML='<div class="fan-admin-empty">'+(q?"No activity matches your search.":"No administrator activity has been recorded yet.")+'</div>';return;}
    list.innerHTML=rows.map(e=>{
      const target=e.target_display_name||e.target_email||"Deleted member";
      const email=e.target_email&&e.target_email!==target?e.target_email:"";
      const change=(e.old_value||e.new_value)?[e.old_value,e.new_value].filter(Boolean).map(v=>String(v).toUpperCase()).join(" → "):"";
      const detail=[email,change].filter(Boolean).join(" • ");
      return '<div class="fan-admin-log-item"><div class="fan-admin-log-top"><span class="fan-admin-log-action">'+esc(label(e.action_type))+'</span><span class="fan-admin-log-time">'+esc(when(e.created_at))+'</span></div><span class="fan-admin-log-target">'+esc(target)+'</span>'+(detail?'<span class="fan-admin-log-detail">'+esc(detail)+'</span>':"")+'</div>';
    }).join("");
  }

  async function load(){
    if(!list||nalAccountProfile?.role!=="admin")return;
    list.innerHTML='<div class="fan-admin-loading">Loading administrator activity…</div>';
    try{
      const client=getNalAccountClient();
      const {data,error}=await client.from("admin_activity_log").select("id,target_display_name,target_email,action_type,old_value,new_value,details,created_at").order("created_at",{ascending:false}).limit(100);
      if(error)throw error;
      entries=Array.isArray(data)?data:[];
      render();
    }catch(error){
      console.error("NAL Admin activity log error:",error);
      list.innerHTML='<div class="fan-admin-error">Activity Log could not be loaded. Please try again.</div>';
    }
  }

  button?.addEventListener("click",async function(){
    if(document.getElementById("fanAdminArea")?.hidden)return;
    document.getElementById("fanAdminUsersPanel")?.classList.remove("show");
    document.getElementById("fanAdminNotificationPanel")?.classList.remove("show");
    panel?.classList.toggle("show");
    if(panel?.classList.contains("show")){
      await load();
      setTimeout(()=>panel.scrollIntoView({behavior:"smooth",block:"nearest"}),50);
    }
  });
  search?.addEventListener("input",render);
})();

/* NAL ADMIN — real admin-only member list. */
(function(){
  const button = document.getElementById("fanAdminUsersButton");
  const panel = document.getElementById("fanAdminUsersPanel");
  const list = document.getElementById("fanAdminUsersList");
  const search = document.getElementById("fanAdminUserSearch");
  const memberCount = document.getElementById("fanAdminMemberCount");
  let adminMembers = [];
  let loaded = false;
  let selectedAdminMember = null;

  function escapeAdminText(value){
    return String(value ?? "").replace(/[&<>"']/g, function(char){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[char];
    });
  }

  function formatAdminDate(value){
    if (!value) return "";
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return "";
    return date.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"});
  }

  function renderAdminMembers(){
    if (!list) return;
    const query = (search?.value || "").trim().toLowerCase();
    const members = adminMembers.filter(function(member){
      if (!query) return true;
      return String(member.display_name || "").toLowerCase().includes(query) ||
             String(member.email || "").toLowerCase().includes(query);
    });

    if (!members.length){
      list.innerHTML = '<div class="fan-admin-empty">' +
        (query ? "No members match your search." : "No registered members found.") +
        '</div>';
      return;
    }

    list.innerHTML = members.map(function(member){
      const name = member.display_name || "NAL FAN";
      const initial = (name.trim().charAt(0) || "N").toUpperCase();
      const role = String(member.role || "fan").toLowerCase();
      const status = String(member.account_status || "active").toLowerCase();
      const favorite = member.favorite_team || "No favorite team";
      const joined = formatAdminDate(member.created_at);
      const meta = [member.email || "", status.charAt(0).toUpperCase()+status.slice(1), favorite, joined ? "Joined "+joined : ""]
        .filter(Boolean).join(" • ");
      return '<div class="fan-admin-user" data-member-id="'+escapeAdminText(member.id)+'">' +
        '<div class="fan-admin-uavatar">'+escapeAdminText(initial)+'</div>' +
        '<div class="fan-admin-uinfo"><b>'+escapeAdminText(name)+'</b><span class="fan-admin-meta fan-admin-status-'+escapeAdminText(status)+'">'+escapeAdminText(meta)+'</span></div>' +
        '<span class="fan-admin-role '+escapeAdminText(role)+'">'+escapeAdminText(role.toUpperCase())+'</span>' +
        '<span class="fan-member-chev">›</span></div>';
    }).join("");
  }

  async function loadAdminMembers(){
    if (!list) return;
    if (nalAccountProfile?.role !== "admin"){
      list.innerHTML = '<div class="fan-admin-error">Administrator access required.</div>';
      return;
    }

    list.innerHTML = '<div class="fan-admin-loading">Loading registered members…</div>';

    try{
      const client = getNalAccountClient();
      const { data, error } = await client.rpc("admin_list_members");
      if (error) throw error;
      adminMembers = Array.isArray(data) ? data : [];
      loaded = true;
      if (memberCount) memberCount.textContent = String(adminMembers.length);
      renderAdminMembers();
    } catch(error){
      console.error("NAL Admin member list error:", error);
      list.innerHTML = '<div class="fan-admin-error">We could not load the member list. Please confirm you are signed in with an active Admin account.</div>';
    }
  }

  function openAdminMemberDetail(member){
    if (!member || nalAccountProfile?.role !== "admin") return;
    selectedAdminMember = member;
    const detail = document.getElementById("fanAdminMemberDetail");
    const name = member.display_name || "NAL FAN";
    const status = member.account_status || "active";
    const role = member.role || "fan";
    const set = function(id,value){
      const el=document.getElementById(id);
      if(el) el.textContent=value || "—";
    };
    set("fanAdminDetailInitial",(name.trim().charAt(0)||"N").toUpperCase());
    set("fanAdminDetailName",name);
    set("fanAdminDetailSummary",String(role).toUpperCase()+" • "+String(status).toUpperCase());
    set("fanAdminDetailDisplayName",name);
    set("fanAdminDetailEmail",member.email);
    set("fanAdminDetailFavorite",member.favorite_team || "Not selected");
    set("fanAdminDetailRole",String(role).toUpperCase());
    set("fanAdminDetailStatus",String(status).toUpperCase());
    set("fanAdminDetailJoined",formatAdminDate(member.created_at) || "—");

    const roleButton = document.getElementById("fanAdminRoleAction");
    const statusButton = document.getElementById("fanAdminStatusAction");
    const banButton = document.getElementById("fanAdminBanAction");
    const deleteButton = document.getElementById("fanAdminDeleteAction");
    const actionHelp = document.getElementById("fanAdminActionHelp");
    const actionMessage = document.getElementById("fanAdminActionMessage");
    if (actionMessage){ actionMessage.textContent = ""; actionMessage.className = "fan-admin-action-message"; }

    const isSelf = String(member.id) === String(nalAccountUser?.id || "");
    const normalizedStatus = String(status).toLowerCase();
    if (roleButton){
      roleButton.disabled = isSelf;
    }
    if (statusButton){
      statusButton.disabled = isSelf;
      statusButton.classList.remove("fan-admin-action-suspend","fan-admin-action-restore");
      if (normalizedStatus === "suspended" || normalizedStatus === "banned"){
        statusButton.textContent = "RESTORE ACCOUNT";
        statusButton.classList.add("fan-admin-action-restore");
      } else {
        statusButton.textContent = "SUSPEND ACCOUNT";
        statusButton.classList.add("fan-admin-action-suspend");
      }
    }

/* =========================================================
   NAL ALERTS / NOTIFICATION CENTER
========================================================= */
let nalNotifications = [];
let nalNotificationReadIds = new Set();
let nalAlertsReturnPageId = "homePage";

function getNalNotificationBadge(){
  return document.getElementById("nalNotificationBadge");
}

function setNalNotificationBadge(count){
  const badge = getNalNotificationBadge();
  const icon = document.getElementById("nalNotificationIcon");
  const safeCount = Math.max(0, Number(count) || 0);

  if (badge){
    badge.textContent = safeCount > 99 ? "99+" : String(safeCount);
    badge.hidden = safeCount === 0;
  }

  if (icon){
    const noNotificationSrc = icon.dataset.noNotificationSrc || icon.src;
    const hasNotificationSrc = icon.dataset.hasNotificationSrc || noNotificationSrc;
    icon.src = safeCount > 0 ? hasNotificationSrc : noNotificationSrc;
    icon.classList.toggle("has-notification", safeCount > 0);
  }
}

function formatNalAlertDate(value){
  if (!value) return "";
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return "";
  return new Intl.DateTimeFormat(undefined,{
    month:"short",
    day:"numeric",
    hour:"numeric",
    minute:"2-digit"
  }).format(date);
}

function getNalAlertTypeLabel(notification){
  const raw = String(notification?.notification_type || "league").trim();
  if (!raw) return "NAL ALERT";
  return raw.replace(/[_-]+/g," ").toUpperCase();
}

function nalNotificationMatchesFan(notification){
  if (!notification || notification.is_active === false) return false;

  const targetType = String(notification.target_type || "all").toLowerCase();
  if (targetType === "all" || targetType === "league" || !targetType) return true;

  if (targetType === "team"){
    const targetTeam = String(notification.target_team || "").trim().toLowerCase();
    const favoriteTeam = String(nalAccountProfile?.favorite_team || "").trim().toLowerCase();
    return !!targetTeam && !!favoriteTeam && targetTeam === favoriteTeam;
  }

  if (targetType === "user"){
    const targetUserId = String(notification.target_user_id || "").trim();
    const currentUserId = String(nalAccountUser?.id || "").trim();
    return !!targetUserId && !!currentUserId && targetUserId === currentUserId;
  }

  return false;
}

function renderNalAlerts(){
  const list = document.getElementById("nalAlertsList");
  const unreadLabel = document.getElementById("nalAlertsUnreadLabel");
  if (!list) return;

  const visibleNotifications = nalNotifications.filter(nalNotificationMatchesFan);
  const unreadCount = visibleNotifications.filter(item => !nalNotificationReadIds.has(String(item.id))).length;

  setNalNotificationBadge(unreadCount);
  if (unreadLabel){
    unreadLabel.textContent = `${unreadCount} UNREAD`;
  }

  if (!visibleNotifications.length){
    list.innerHTML = '<div class="nal-alerts-state">You’re all caught up. New NAL Alerts will appear here.</div>';
    return;
  }

  list.innerHTML = visibleNotifications.map(item => {
    const id = String(item.id);
    const unread = !nalNotificationReadIds.has(id);
    const title = escapeHTML(item.title || "NAL Alert");
    const message = escapeHTML(item.message || "");
    const type = escapeHTML(getNalAlertTypeLabel(item));
    const date = escapeHTML(formatNalAlertDate(item.created_at));
    const actionUrl = String(item.action_url || "").trim();
    const actionText = actionUrl ? '<span class="nal-alert-action">VIEW UPDATE →</span>' : "";

    return `
      <article class="nal-alert-card${unread ? " unread" : ""}" data-notification-id="${escapeHTML(id)}">
        <button type="button" class="nal-alert-card-button" data-notification-id="${escapeHTML(id)}">
          <div class="nal-alert-meta">
            <span class="nal-alert-type">${type}</span>
            <span class="nal-alert-date">${date}</span>
          </div>
          <h2 class="nal-alert-card-title">${title}</h2>
          <p class="nal-alert-message">${message}</p>
          ${actionText}
        </button>
      </article>
    `;
  }).join("");
}

async function loadNalAlerts(){
  if (!nalAccountUser){
    nalNotifications = [];
    nalNotificationReadIds = new Set();
    setNalNotificationBadge(0);
    return;
  }

  try{
    const client = getNalAccountClient();

    const [{data: notifications, error: notificationError}, {data: reads, error: readsError}] =
      await Promise.all([
        client
          .from("notifications")
          .select("*")
          .order("created_at",{ascending:false})
          .limit(100),
        client
          .from("notification_reads")
          .select("notification_id")
          .eq("user_id", nalAccountUser.id)
      ]);

    if (notificationError) throw notificationError;
    if (readsError) throw readsError;

    nalNotifications = Array.isArray(notifications) ? notifications : [];
    nalNotificationReadIds = new Set(
      (Array.isArray(reads) ? reads : []).map(row => String(row.notification_id))
    );

    renderNalAlerts();
  } catch(error){
    console.error("NAL alerts load error:", error);
    const list = document.getElementById("nalAlertsList");
    if (list && document.getElementById("nalAlertsPage")?.classList.contains("active")){
      list.innerHTML = '<div class="nal-alerts-state">NAL Alerts could not be loaded. Please try again.</div>';
    }
  }
}

async function markNalAlertRead(notificationId){
  if (!nalAccountUser || !notificationId) return;

  const id = String(notificationId);
  if (nalNotificationReadIds.has(id)) return;

  try{
    const client = getNalAccountClient();
    const { error } = await client
      .from("notification_reads")
      .insert({
        user_id: nalAccountUser.id,
        notification_id: notificationId
      });

    if (error && error.code !== "23505") throw error;

    nalNotificationReadIds.add(id);
    renderNalAlerts();
  } catch(error){
    console.error("NAL alert read error:", error);
  }
}

async function openNalAlerts(){
  if (!nalAccountUser){
    await openFanAccount();
    setFanAccountMessage("Sign in to view your NAL Alerts.");
    return;
  }

  nalAlertsReturnPageId = getCurrentVisibleAppPageId();
  if (nalAlertsReturnPageId === "nalAlertsPage") nalAlertsReturnPageId = "homePage";

  document.querySelectorAll(".app-page").forEach(page => {
    page.classList.remove("active");
    page.style.display = "none";
  });

  const page = document.getElementById("nalAlertsPage");
  if (page){
    page.style.display = "block";
    page.classList.add("active");
  }

  window.scrollTo(0,0);

  const list = document.getElementById("nalAlertsList");
  if (list) list.innerHTML = '<div class="nal-alerts-state">Loading NAL Alerts…</div>';
  await loadNalAlerts();
}

function closeNalAlerts(){
  const alertsPage = document.getElementById("nalAlertsPage");
  if (alertsPage){
    alertsPage.classList.remove("active");
    alertsPage.style.display = "none";
  }

  const previous = document.getElementById(nalAlertsReturnPageId) || document.getElementById("homePage");
  if (previous){
    previous.style.display = "block";
    previous.classList.add("active");
  }

  window.scrollTo(0,0);
}

document.addEventListener("click", async function(event){
  const bell = event.target.closest("#nalNotificationButton");
  if (bell){
    event.preventDefault();
    event.stopPropagation();
    await openNalAlerts();
    return;
  }

  const back = event.target.closest("#nalAlertsBack");
  if (back){
    event.preventDefault();
    closeNalAlerts();
    return;
  }

  const alertButton = event.target.closest(".nal-alert-card-button");
  if (alertButton){
    event.preventDefault();

    const notificationId = alertButton.dataset.notificationId;
    const notification = nalNotifications.find(item => String(item.id) === String(notificationId));

    await markNalAlertRead(notificationId);

    const actionUrl = String(notification?.action_url || "").trim();
    if (actionUrl){
      window.open(actionUrl,"_blank","noopener,noreferrer");
    }
  }
});

document.addEventListener("DOMContentLoaded", function(){
  setTimeout(() => {
    if (nalAccountUser) loadNalAlerts();
    else setNalNotificationBadge(0);
  }, 700);
});

// Temporary Lightcast API-driven in-app catalog test.
const LIGHTCAST_CATALOG_API = "https://qpavspvpdebtbbffdcmo.supabase.co/functions/v1/lightcast-catalog";
let lightcastTestChannels = [];
let lightcastTestMedia = [];
let lightcastTestActiveChannel = null;

function lightcastEscape(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function lightcastTestContent(){
  return document.getElementById("lightcastTestContent");
}

function lightcastLoading(message){
  const content=lightcastTestContent();
  if(!content) return;
  content.innerHTML=`
    <div class="lightcast-test-status">
      <div class="lightcast-test-spinner" aria-hidden="true"></div>
      <div>${lightcastEscape(message || "Loading MNTR+ content...")}</div>
    </div>`;
}

function lightcastError(message,retryFn){
  const content=lightcastTestContent();
  if(!content) return;
  content.innerHTML=`
    <div class="lightcast-test-status lightcast-test-error">
      <div><strong>Unable to load content</strong>${lightcastEscape(message || "Please try again.")}</div>
      <button type="button" class="lightcast-test-retry" id="lightcastRetryButton">TRY AGAIN</button>
    </div>`;
  const button=document.getElementById("lightcastRetryButton");
  if(button && typeof retryFn === "function") button.onclick=retryFn;
}

async function fetchLightcastCatalog(params){
  const url=new URL(LIGHTCAST_CATALOG_API);
  Object.entries(params || {}).forEach(([key,value])=>{
    if(value !== undefined && value !== null && value !== "") url.searchParams.set(key,String(value));
  });
  const response=await fetch(url.toString(),{method:"GET",headers:{Accept:"application/json"}});
  const payload=await response.json().catch(()=>null);
  if(!response.ok) throw new Error(payload?.error || `Request failed (${response.status}).`);
  if(!payload || payload.success !== true) throw new Error(payload?.error || "Lightcast returned an invalid response.");
  if(payload.data && !Array.isArray(payload.data) && payload.data.error) throw new Error(payload.data.error);
  return payload;
}

function renderLightcastChannels(){
  const content=lightcastTestContent();
  if(!content) return;
  if(!lightcastTestChannels.length){
    lightcastError("No Lightcast subchannels were returned.",loadLightcastChannels);
    return;
  }
  content.innerHTML=`
    <div class="lightcast-test-view-head">
      <div class="lightcast-test-view-title">
        <h2>Indoor/Arena Football</h2>
        <p>Select a Lightcast subchannel to browse its videos.</p>
      </div>
    </div>
    <div class="lightcast-channel-grid">
      ${lightcastTestChannels.map(channel=>{
        const image=channel.thumb_image_16x9_640w || channel.thumb_image_16x9_400w || channel.thumb_image_16x9_200w || "";
        return `<button type="button" class="lightcast-channel-card" data-lightcast-subid="${lightcastEscape(channel.id)}">
          ${image ? `<img src="${lightcastEscape(image)}" alt="${lightcastEscape(channel.name)}" loading="lazy">` : `<div class="lightcast-card-fallback">${lightcastEscape(channel.name)}</div>`}
          <div class="lightcast-card-copy"><strong>${lightcastEscape(channel.name)}</strong>${channel.description ? `<span>${lightcastEscape(channel.description)}</span>` : ""}</div>
        </button>`;
      }).join("")}
    </div>`;
  content.querySelectorAll("[data-lightcast-subid]").forEach(button=>{
    button.addEventListener("click",()=>loadLightcastMedia(button.dataset.lightcastSubid));
  });
}

async function loadLightcastChannels(){
  lightcastLoading("Loading Lightcast subchannels...");
  try{
    const payload=await fetchLightcastCatalog({view:"channels"});
    const channel=Array.isArray(payload.data) ? payload.data.find(item=>String(item.channel_id)==="72119") || payload.data[0] : null;
    lightcastTestChannels=Array.isArray(channel?.subchannels) ? channel.subchannels : [];
    renderLightcastChannels();
  }catch(error){
    lightcastError(error instanceof Error ? error.message : "Unable to load Lightcast subchannels.",loadLightcastChannels);
  }
}

function formatLightcastDuration(seconds){
  const total=Number(seconds);
  if(!Number.isFinite(total) || total <= 0) return "";
  const h=Math.floor(total/3600);
  const m=Math.floor((total%3600)/60);
  const s=Math.floor(total%60);
  return h ? `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}` : `${m}:${String(s).padStart(2,"0")}`;
}

function renderLightcastMedia(){
  const content=lightcastTestContent();
  if(!content) return;
  const channelName=lightcastTestActiveChannel?.name || "Lightcast Videos";
  content.innerHTML=`
    <div class="lightcast-test-view-head">
      <button type="button" class="lightcast-test-back" id="lightcastBackToChannels">‹ CHANNELS</button>
      <div class="lightcast-test-view-title">

      </div>
    </div>
    ${lightcastTestMedia.length ? `<div class="lightcast-media-grid">

        const image=item.poster_image_16x9_640w || item.poster_image_16x9_400w || item.poster_image_16x9_200w || "";
        const duration=formatLightcastDuration(item.duration);
        return `<button type="button" class="lightcast-media-card" data-lightcast-media-index="${index}">
          ${image ? `<img src="${lightcastEscape(image)}" alt="${lightcastEscape(item.title)}" loading="lazy">` : `<div class="lightcast-card-fallback">NAL NETWORK</div>`}
          <div class="lightcast-card-copy"><strong>${lightcastEscape(item.title || "Untitled Video")}</strong>${duration ? `<span>${lightcastEscape(duration)}</span>` : ""}</div>
        </button>`;
      }).join("")}
    </div>` : `<div class="lightcast-test-status">No videos are currently assigned to this subchannel.</div>`}`;
  document.getElementById("lightcastBackToChannels")?.addEventListener("click",renderLightcastChannels);
  content.querySelectorAll("[data-lightcast-media-index]").forEach(button=>{
    button.addEventListener("click",()=>openLightcastVideo(Number(button.dataset.lightcastMediaIndex)));
  });
}

async function loadLightcastMedia(subId){
  lightcastTestActiveChannel=lightcastTestChannels.find(channel=>String(channel.id)===String(subId)) || {id:subId,name:"Lightcast Videos"};
  lightcastLoading(`Loading ${lightcastTestActiveChannel.name || "videos"}...`);
  try{
    const payload=await fetchLightcastCatalog({view:"media",subId});
    lightcastTestMedia=Array.isArray(payload.data) ? payload.data : [];
    renderLightcastMedia();
  }catch(error){
    lightcastError(error instanceof Error ? error.message : "Unable to load videos.",()=>loadLightcastMedia(subId));
  }
}

function getLightcastEmbedSrc(item){
  const mediaId=String(item?.media_id || item?.id || "").trim();
  if(!mediaId) return "";
  return `https://www.lightcast.com/embed/player.php?id=${encodeURIComponent(mediaId)}&channelId=72119`;
}

function openLightcastVideo(index){

}

  function standingStreak(results){

    return `${win?"W":"L"}${n}`;
  }
  function calculateNalStandings(){
    const rows={};
    NAL_SCHEDULE_TEAMS.forEach(name=>rows[normalizeName(name)]={name,w:0,l:0,pf:0,pa:0,results:[]});
    [...nalLiveGames].filter(isFinalStandingsGame).sort((a,b)=>utcDate(a.start_time_utc)-utcDate(b.start_time_utc)).forEach(game=>{
      const m=parseMatchup(game.title),ak=normalizeName(m.awayName),hk=normalizeName(m.homeName);

      const as=Number(game.away_score),hs=Number(game.home_score);if(!Number.isFinite(as)||!Number.isFinite(hs))return;
      rows[ak].pf+=as;rows[ak].pa+=hs;rows[hk].pf+=hs;rows[hk].pa+=as;

  const NAL_SCHEDULE_TEAMS = [

  function easternDateParts(date){

  function easternWeekKey(game){

    const mondayOffset=(idx+6)%7;
    const monday=new Date(Date.UTC(p.year,p.month-1,p.day-mondayOffset,12));
    return monday.toISOString().slice(0,10);
  }

  function scheduleWeekGroups(){
    const sorted=[...nalLiveGames].filter(g=>utcDate(g.start_time_utc))
      .sort((a,b)=>utcDate(a.start_time_utc)-utcDate(b.start_time_utc));
    const map=new Map();
    sorted.forEach(g=>{const k=easternWeekKey(g);if(!map.has(k))map.set(k,[]);map.get(k).push(g);});
    return [...map.entries()].map(([key,games],i)=>({key,number:i+1,games}));
  }

  function formatScheduleWeekRange(key){
    const parts=String(key||"").split("-").map(Number);
    if(parts.length!==3||parts.some(Number.isNaN)) return "";
    const monday=new Date(Date.UTC(parts[0],parts[1]-1,parts[2],12));
    const sunday=new Date(monday);
    sunday.setUTCDate(sunday.getUTCDate()+6);
    const short=d=>`${String(d.getUTCMonth()+1).padStart(2,"0")}/${String(d.getUTCDate()).padStart(2,"0")}`;
    return `${short(monday)} – ${short(sunday)}`;
  }

  function scheduleDateLabel(game){
    const d=utcDate(game.start_time_utc); if(!d)return "";
    return d.toLocaleDateString("en-US",{timeZone:gameTimeZone(game),weekday:"long",month:"short",day:"numeric"}).toUpperCase();
  }

  function scheduleTimeOnly(game){
    const d=utcDate(game.start_time_utc); if(!d)return "TBA";
    return d.toLocaleTimeString("en-US",{timeZone:gameTimeZone(game),hour:"numeric",minute:"2-digit",timeZoneName:"short"}).toUpperCase();
  }

  function scheduleScoreMarkup(game){
    const a=game.away_score, h=game.home_score;
    if(a===undefined||a===null||h===undefined||h===null) return "";
    const state=eventState(game);
    const detail=state==="ended"?"FINAL":(game.period||"LIVE")+(game.clock?` • ${liveEscape(game.clock)}`:"");
    return `<div style="font-size:20px;font-weight:1000;color:#07172b;margin-top:6px">${liveEscape(a)} <span style="font-size:9px;color:#89919a;margin:0 8px">${liveEscape(detail)}</span> ${liveEscape(h)}</div>`;
  }

  function scheduleCard(game){
    const m=parseMatchup(game.title), state=eventState(game);
    const awayLogo=logoForTeam(m.awayName), homeLogo=logoForTeam(m.homeName);
    return `<article class="nal-schedule-card" data-schedule-event-id="${liveEscape(game.event_id)}">
      <div class="nal-schedule-bar ${state==="live"?"live":""}"></div>
      <div class="nal-schedule-match">
        <div><div class="nal-schedule-logo"><img src="${liveEscape(awayLogo)}" alt="${liveEscape(m.awayName)}"></div><div class="nal-schedule-teamname">${liveEscape(m.awayName)}</div></div>
        <div><div class="nal-schedule-at">@</div><div class="nal-schedule-away">AWAY</div></div>
        <div><div class="nal-schedule-logo"><img src="${liveEscape(homeLogo)}" alt="${liveEscape(m.homeName)}"></div><div class="nal-schedule-teamname">${liveEscape(m.homeName)}</div></div>
      </div>
      <div class="nal-schedule-meta"><div class="nal-schedule-time">${liveEscape(scheduleDateLabel(game))} • ${liveEscape(scheduleTimeOnly(game))}</div>
      <div class="nal-schedule-place">${liveEscape(game.description||"NAL FOOTBALL")}</div>${scheduleScoreMarkup(game)}</div>
      <div class="nal-schedule-actions"><div class="nal-schedule-status ${state==="live"?"live":""}">${state==="live"?"● ":""}${statusText(state)}</div>
      <button class="nal-schedule-action ${state==="live"?"live":""}" type="button" data-schedule-open="${liveEscape(game.event_id)}">${state==="live"?"▶ WATCH LIVE":state==="ended"?"GAME RECAP ›":"GAME DETAILS ›"}</button></div>
    </article>`;
  }

  function scheduleTeamView(groups){
    const teamButtons=NAL_SCHEDULE_TEAMS.map(name=>`<button class="nal-schedule-teamchoice ${name===nalScheduleTeam?"active":""}" type="button" data-schedule-team="${liveEscape(name)}">
      <div class="nal-schedule-mini"><img src="${liveEscape(logoForTeam(name))}" alt="${liveEscape(name)}"></div><small>${liveEscape(name.split(" ")[0])}</small></button>`).join("");
    const games=nalLiveGames.filter(g=>{const m=parseMatchup(g.title);return normalizeName(m.awayName)===normalizeName(nalScheduleTeam)||normalizeName(m.homeName)===normalizeName(nalScheduleTeam)})
      .sort((a,b)=>utcDate(a.start_time_utc)-utcDate(b.start_time_utc));
    const hero=`<div class="nal-schedule-teamstrip">${teamButtons}</div><div class="nal-schedule-teamhero"><div class="nal-schedule-big"><img src="${liveEscape(logoForTeam(nalScheduleTeam))}" alt=""></div><div><b>${liveEscape(nalScheduleTeam)}</b><span>2027 REGULAR SEASON SCHEDULE</span></div></div>`;
    if(!games.length)return hero+`<div class="nal-schedule-empty"><strong>NO GAMES LOADED YET</strong>Games will appear here as they are added to the NAL schedule feed.</div>`;
    return hero+games.map(g=>{const m=parseMatchup(g.title), home=normalizeName(m.homeName)===normalizeName(nalScheduleTeam), opp=home?m.awayName:m.homeName, d=utcDate(g.start_time_utc);
      const day=d.toLocaleDateString("en-US",{timeZone:gameTimeZone(g),day:"2-digit"}), mon=d.toLocaleDateString("en-US",{timeZone:gameTimeZone(g),month:"short"}).toUpperCase();
      return `<div class="nal-schedule-teamgame" data-schedule-event-id="${liveEscape(g.event_id)}"><div class="nal-schedule-datebox"><b>${day}</b><span>${mon}</span></div><div class="nal-schedule-opp"><small>${home?"HOME":"AWAY"}</small><b>${home?"vs":"@"} ${liveEscape(opp)}</b></div><div class="nal-schedule-gt">${liveEscape(scheduleTimeOnly(g))}</div></div>`}).join("");
  }

  window.openNalTeamSchedule = function(teamName){
    const requested = String(teamName || "").trim();
    if (requested) nalScheduleTeam = requested;
    nalScheduleView = "team";
    if (typeof showPage === "function") showPage("schedulePage");
    renderNalSchedule();
    window.scrollTo({top:0,left:0,behavior:"instant"});
  };

  function renderNalSchedule(){
    const root=document.getElementById("nalScheduleContent"); if(!root)return;
    document.querySelectorAll(".nal-schedule-tab").forEach(b=>b.classList.toggle("active",b.dataset.scheduleView===nalScheduleView));
    const groups=scheduleWeekGroups();
    if(!groups.length){root.innerHTML=`<div class="nal-schedule-empty"><strong>SCHEDULE COMING SOON</strong>Games will appear automatically as they are added to the connected NAL game feed.</div>`;return;}
    if(nalScheduleView==="team"){root.innerHTML=scheduleTeamView(groups);return;}
    if(nalScheduleView==="week"){
      nalScheduleWeekIndex=Math.max(0,Math.min(nalScheduleWeekIndex,groups.length-1));
      const group=groups[nalScheduleWeekIndex];
      const nums=groups.map((g,i)=>`<button class="nal-schedule-wn ${i===nalScheduleWeekIndex?"active":""}" type="button" data-schedule-week="${i}">${g.number}</button>`).join("");
      root.innerHTML=`<div class="nal-schedule-weekpicker"><div class="nal-schedule-weeknav"><button class="nal-schedule-arrow" type="button" data-schedule-step="-1">‹</button><div class="nal-schedule-center"><b>WEEK ${group.number}</b><span>${liveEscape(formatScheduleWeekRange(group.key))}</span></div><button class="nal-schedule-arrow" type="button" data-schedule-step="1">›</button></div><div class="nal-schedule-weeknums">${nums}</div></div>
      <div class="nal-schedule-weekhead"><b>WEEK ${group.number} GAMES</b><span>${group.games.length} GAME${group.games.length===1?"":"S"}</span></div>${group.games.map(scheduleCard).join("")}`;
      return;
    }
    root.innerHTML=groups.map(group=>`<div class="nal-schedule-weekhead"><b>WEEK ${group.number}</b><span>${liveEscape(formatScheduleWeekRange(group.key))}</span></div>${group.games.map(scheduleCard).join("")}`).join("");
  }

  document.addEventListener("click",event=>{
    const tab=event.target.closest("[data-schedule-view]");
    if(tab){nalScheduleView=tab.dataset.scheduleView;renderNalSchedule();return;}
    const wk=event.target.closest("[data-schedule-week]");
    if(wk){nalScheduleWeekIndex=Number(wk.dataset.scheduleWeek)||0;renderNalSchedule();return;}
    const step=event.target.closest("[data-schedule-step]");
    if(step){nalScheduleWeekIndex+=Number(step.dataset.scheduleStep)||0;renderNalSchedule();return;}
    const team=event.target.closest("[data-schedule-team]");
    if(team){nalScheduleTeam=team.dataset.scheduleTeam;renderNalSchedule();return;}
    const open=event.target.closest("[data-schedule-open],[data-schedule-event-id]");
    if(open){
      const id=open.dataset.scheduleOpen||open.dataset.scheduleEventId;
      const game=nalLiveGames.find(g=>String(g.event_id)===String(id));
      if(game && eventState(game)==="live"){openLiveGame(game);}
    }
  });



  /* =========================================================
     TEAM HOME — NEXT GAME FROM INTERNAL NAL SCHEDULE
     Uses the exact same data and timezone logic as Schedule.
  ========================================================= */
  function renderActiveTeamNextGame(){
    const card = document.getElementById("teamNextGameCard");
    const label = document.getElementById("teamNextGameLabel");
    const title = document.getElementById("teamNextGameTitle");
    const copy = document.getElementById("teamNextGameCopy");

    if (!card || !label || !title || !copy || !activeTeam) return;

    const activeNames = [
      activeTeam.name,
      activeTeam.teamName,
      activeTeam.shortName,
      activeTeam.displayName
    ].filter(Boolean).map(normalizeName);

    const activeSlug = activeTeam.slug || "";

    const belongsToActiveTeam = game => {
      const matchup = parseMatchup(game.title);
      const awaySlug = slugForTeam(matchup.awayName);
      const homeSlug = slugForTeam(matchup.homeName);

      if (activeSlug && (awaySlug === activeSlug || homeSlug === activeSlug)) return true;

      const away = normalizeName(matchup.awayName);
      const home = normalizeName(matchup.homeName);
      return activeNames.includes(away) || activeNames.includes(home);
    };

    const games = nalLiveGames
      .filter(belongsToActiveTeam)
      .filter(game => eventState(game) !== "ended")
      .filter(game => utcDate(game.start_time_utc))
      .sort((a,b) => utcDate(a.start_time_utc) - utcDate(b.start_time_utc));

    const game = games[0];

    if (!game) {
      label.textContent = "SEASON X";
      title.textContent = "NO UPCOMING GAME SCHEDULED";
      copy.innerHTML = "The next game will appear here automatically when it is added to the NAL schedule.";
      return;
    }

    const matchup = parseMatchup(game.title);
    const state = eventState(game);
    const awayLogo = logoForTeam(matchup.awayName);
    const homeLogo = logoForTeam(matchup.homeName);
    const kickoff = formatHomeKickoff(game);
    const venue = game.description || "NAL FOOTBALL";

    label.textContent = state === "live" ? "LIVE NOW" : "NEXT GAME";
    title.textContent = state === "live" ? "GAME IN PROGRESS" : kickoff;

    copy.innerHTML = `
      <div class="team-next-game-matchup">
        <div class="team-next-game-side">
          <div class="team-next-game-logo">
            <img src="${liveEscape(awayLogo)}" alt="${liveEscape(matchup.awayName)}">
          </div>
          <b>${liveEscape(matchup.awayName)}</b>
          <small>AWAY</small>
        </div>

        <div class="team-next-game-center">
          <div class="team-next-game-vs">VS</div>
        </div>

        <div class="team-next-game-side">
          <div class="team-next-game-logo">
            <img src="${liveEscape(homeLogo)}" alt="${liveEscape(matchup.homeName)}">
          </div>
          <b>${liveEscape(matchup.homeName)}</b>
          <small>HOME</small>
        </div>
      </div>

      <div class="team-next-game-date">${liveEscape(kickoff)}</div>
      <div class="team-next-game-place">${liveEscape(venue)}</div>
    `;
  }

  window.renderActiveTeamNextGame = renderActiveTeamNextGame;

  async function loadLiveGames(){
    const list = document.getElementById("nalLiveGamesList");
    const count = document.getElementById("nalLiveGameCount");

    try {
      const response = await fetch(`${LIVE_GAMES_FEED}?v=${Date.now()}`, { cache: "no-store" });
      if (!response.ok) throw new Error("Unable to load live-games.json");

      const data = await response.json();
      nalLiveGames = Array.isArray(data) ? data : (Array.isArray(data.games) ? data.games : []);
      renderLiveGames();
      renderHomeGameCarousel();
      renderNalSchedule();
      renderNalStandings();
      renderActiveTeamNextGame();
    } catch (error) {
      console.error("NAL Live Games could not be loaded:", error);
      if (count) count.textContent = "0 GAMES";
      if (list) {
        list.innerHTML = `
          <div class="nal-live-games-empty">
            <span>LIVE EVENTS CURRENTLY UNAVAILABLE</span>
          </div>`;
      }
    }
  }

  function iframeUrlFromGame(game){
    const markup = game.embed_code_adaptive || game.embed_code || "";
    const match = String(markup).match(/<iframe[^>]+src=["']([^"']+)["']/i);
    if (match && match[1]) {
      const textarea = document.createElement("textarea");
      textarea.innerHTML = match[1];
      return textarea.value;
    }
    return game.player_landing_url || "";
  }

  function openLiveGame(game){
    if (!game) return;

    const viewer = document.getElementById("liveGameViewerPage");
    const player = document.getElementById("liveGameViewerPlayer");
    const title = document.getElementById("liveGameViewerTitle");
    const status = document.getElementById("liveGameViewerStatus");
    const matchup = document.getElementById("liveGameViewerMatchup");
    const meta = document.getElementById("liveGameViewerMeta");
    if (!viewer || !player) return;

    const state = eventState(game);
    const playerUrl = iframeUrlFromGame(game);

    document.querySelectorAll(".app-page").forEach(page => {
      page.classList.remove("active");
      page.style.display = "none";
    });

    viewer.style.display = "block";
    viewer.classList.add("active");

    document.querySelectorAll(".bottom-nav .nav-button").forEach(button => button.classList.remove("active"));
    const networkNav = document.querySelector('.bottom-nav [data-page="watchPage"]');
    if (networkNav) networkNav.classList.add("active");

    if (title) title.textContent = game.title || "NAL LIVE GAME";
    if (status) {
      status.textContent = statusText(state);
      status.style.background = state === "live" ? "var(--nal-red)" : "#4b4b4b";
    }
    if (matchup) matchup.textContent = game.title || "";
    if (meta) meta.textContent = `${formatEventTime(game)}${game.description ? "\n" + game.description : ""}`;

    player.innerHTML = "";
    if (playerUrl) {
      const iframe = document.createElement("iframe");
      iframe.src = playerUrl;
      iframe.title = game.title || "NAL Live Game";
      iframe.setAttribute("frameborder", "0");
      iframe.setAttribute("allow", "fullscreen; picture-in-picture; autoplay");
      iframe.setAttribute("allowfullscreen", "");
      iframe.referrerPolicy = "no-referrer-when-downgrade";
      player.appendChild(iframe);
    } else {
      player.innerHTML = '<div style="height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:900;">PLAYER CURRENTLY UNAVAILABLE</div>';
    }

    window.scrollTo({ top: 0, behavior: "instant" });
  }

  function closeLiveGame(){
    const viewer = document.getElementById("liveGameViewerPage");
    const player = document.getElementById("liveGameViewerPlayer");
    const watch = document.getElementById("watchPage");

    if (player) player.innerHTML = "";
    if (viewer) {
      viewer.classList.remove("active");
      viewer.style.display = "none";
    }
    if (watch) {
      watch.style.display = "block";
      watch.classList.add("active");
    }

    document.querySelectorAll(".bottom-nav .nav-button").forEach(button => button.classList.remove("active"));
    const networkNav = document.querySelector('.bottom-nav [data-page="watchPage"]');
    if (networkNav) networkNav.classList.add("active");

    window.scrollTo({ top: 0, behavior: "instant" });
  }

  document.addEventListener("click", function(event){
    const liveButton = event.target.closest("[data-live-event-index]");
    if (liveButton) {
      const card = liveButton.closest("[data-live-event-id]");
      const id = card ? String(card.dataset.liveEventId || "") : "";
      const game = nalLiveGames.find(item => String(item.event_id) === id);
      if (game) { event.preventDefault(); openLiveGame(game); }
      return;
    }
    const homeWatch = event.target.closest("[data-home-live-event-id]");
    if (homeWatch) {
      const id = String(homeWatch.dataset.homeLiveEventId || "");
      const game = nalLiveGames.find(item => String(item.event_id) === id);
      if (game) { event.preventDefault(); openLiveGame(game); }
      return;
    }
    const dot = event.target.closest("[data-home-game-dot]");
    if (dot) { showHomeGame(Number(dot.dataset.homeGameDot)); return; }
    if (event.target.closest("#homeGamePrev")) { showHomeGame(homeGameIndex - 1); return; }
    if (event.target.closest("#homeGameNext")) { showHomeGame(homeGameIndex + 1); return; }
  });

  const homeCarousel = document.getElementById("homeGameCarousel");
  homeCarousel?.addEventListener("touchstart", event => {
    homeTouchStartX = event.changedTouches[0]?.clientX ?? null;
    stopHomeGameRotation();
  }, {passive:true});
  homeCarousel?.addEventListener("touchend", event => {
    if (homeTouchStartX === null) return startHomeGameRotation();
    const endX = event.changedTouches[0]?.clientX ?? homeTouchStartX;
    const delta = endX - homeTouchStartX;
    homeTouchStartX = null;
    if (Math.abs(delta) > 40) showHomeGame(homeGameIndex + (delta < 0 ? 1 : -1));
    else startHomeGameRotation();
  }, {passive:true});

  document.getElementById("liveGameViewerBack")?.addEventListener("click", closeLiveGame);

  document.addEventListener("DOMContentLoaded", loadLiveGames);
  if (document.readyState !== "loading") loadLiveGames();

  window.loadNALLiveGames = loadLiveGames;
})();


/* =========================================================
   NATIVE NAL TEAM ROSTERS
   Source: data/rosters/{season}/rosters.json
========================================================= */
(function(){
  let rosterSeason = "2026";
  let rosterView = "players";
  let rosterTeam = "";
  let rosterData = [];
  let rosterLoadedSeason = "";

  const ROSTER_TEAM_SLUGS = {
    "amarillo warbirds":"amarillo-warbirds",
    "colorado spartans":"colorado-spartans",
    "dallas apex":"dallas-apex",
    "louisiana rouxgaroux":"louisiana-rouxgaroux",
    "omaha beef":"omaha-beef",
    "pueblo punishers":"pueblo-punishers",
    "salina liberty":"salina-liberty",
    "sioux city bandits":"sioux-city-bandits",
    "southwest kansas storm":"southwest-kansas-storm",
    "wheeling miners":"wheeling-miners"
  };

  function rosterEscape(value){
    if (typeof escapeHTML === "function") return escapeHTML(String(value ?? ""));
    return String(value ?? "")
      .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
      .replaceAll('"',"&quot;").replaceAll("'","&#039;");
  }

  function rosterNormalize(value){
    return String(value || "").trim().toLowerCase().replace(/\s+/g," ");
  }

  function rosterLogo(name){
    const slug = ROSTER_TEAM_SLUGS[rosterNormalize(name)] || "";
    return (slug && typeof TEAM_LOGO_OVERRIDES !== "undefined" && TEAM_LOGO_OVERRIDES[slug])
      || (typeof NAL_LOGO !== "undefined" ? NAL_LOGO : "");
  }

  function rosterShortName(name){
    return String(name || "").replace(/^(Southwest Kansas|Sioux City|Louisiana|Colorado|Amarillo|Pueblo|Salina|Omaha|Wheeling|Dallas)\s+/,"");
  }

  function rosterTeams(){
    return Array.isArray(rosterData) ? rosterData : [];
  }

  function findRosterTeam(name){
    const wanted = rosterNormalize(name);
    return rosterTeams().find(team => rosterNormalize(team?.team) === wanted)
      || rosterTeams().find(team => rosterNormalize(team?.slug) === wanted)
      || null;
  }

  function renderRosterTeamStrip(){
    const strip = document.getElementById("nalRosterTeamStrip");
    if (!strip) return;
    const teams = rosterTeams();
    strip.innerHTML = teams.map(team => `
      <button type="button" class="nal-roster-teamchoice${team.team===rosterTeam?" active":""}" data-roster-team="${rosterEscape(team.team)}">
        <span class="nal-roster-mini"><img src="${rosterEscape(rosterLogo(team.team))}" alt="${rosterEscape(team.team)} logo"></span>
        <small>${rosterEscape(rosterShortName(team.team))}</small>
      </button>
    `).join("");
  }

  function playerRows(players){
    return players.map(player => `
      <tr>
        <td class="nal-roster-number">${rosterEscape(player?.number || "—")}</td>
        <td class="nal-roster-name">${rosterEscape(player?.name || "")}</td>
        <td class="nal-roster-pos">${rosterEscape(player?.position || "—")}</td>
        <td>${rosterEscape(player?.height || "—")}</td>
        <td>${rosterEscape(player?.weight || "—")}</td>
        <td>${rosterEscape(player?.college || "—")}</td>
      </tr>
    `).join("");
  }

  function renderRoster(){
    const content = document.getElementById("nalRosterContent");
    if (!content) return;

    document.querySelectorAll("[data-roster-view]").forEach(btn => {
      btn.classList.toggle("active",btn.dataset.rosterView === rosterView);
    });

    const teams = rosterTeams();
    if (!teams.length) {
      document.getElementById("nalRosterTeamStrip").innerHTML = "";
      content.innerHTML = `<div class="nal-roster-empty"><strong>ROSTERS UNAVAILABLE</strong>No ${rosterEscape(rosterSeason)} roster records are currently available.</div>`;
      return;
    }

    if (!rosterTeam || !findRosterTeam(rosterTeam)) rosterTeam = teams[0].team;
    renderRosterTeamStrip();

    const team = findRosterTeam(rosterTeam);
    if (!team) return;

    const players = Array.isArray(team.players) ? team.players : [];
    const staff = Array.isArray(team.staff) ? team.staff : [];
    const logo = rosterLogo(team.team);
    const count = rosterView === "staff" ? staff.length : players.length;

    let body = "";
    if (rosterView === "players") {
      body = players.length ? `
        <div class="nal-roster-tablewrap">
          <table class="nal-roster-table">
            <thead><tr><th>#</th><th>NAME</th><th>POS</th><th>HT</th><th>WT</th><th>COLLEGE</th></tr></thead>
            <tbody>${playerRows(players)}</tbody>
          </table>
        </div>` :
        `<div class="nal-roster-empty"><strong>ROSTER COMING SOON</strong>No player roster has been posted for ${rosterEscape(team.team)} yet.</div>`;
    } else {
      body = staff.length ? `
        <div class="nal-roster-staffgrid">
          ${staff.map(person => `
            <article class="nal-roster-staffcard">
              <b>${rosterEscape(person?.name || "")}</b>
              <span>${rosterEscape(person?.position || "Team Staff")}</span>
            </article>
          `).join("")}
        </div>` :
        `<div class="nal-roster-empty"><strong>STAFF COMING SOON</strong>No team staff has been posted for ${rosterEscape(team.team)} yet.</div>`;
    }

    content.innerHTML = `
      <div class="nal-roster-banner">
        <div class="nal-roster-banner-logo"><img src="${rosterEscape(logo)}" alt="${rosterEscape(team.team)} logo"></div>
        <div class="nal-roster-banner-copy">
          <small>OFFICIAL TEAM ROSTER</small>
          <b>${rosterEscape(team.team)}</b>
          <span>${players.length} PLAYER${players.length===1?"":"S"} • ${staff.length} STAFF</span>
        </div>
      </div>
      <div class="nal-roster-summary">
        <b>${rosterView === "staff" ? "TEAM STAFF" : "ACTIVE ROSTER"}</b>
        <span>${count} ${rosterView === "staff" ? "STAFF" : "PLAYER"+(count===1?"":"S")}</span>
      </div>
      ${body}
    `;
  }

  async function loadRoster(season=rosterSeason){
    rosterSeason = String(season || "2026");
    const content = document.getElementById("nalRosterContent");
    if (content) content.innerHTML = `<div class="nal-roster-empty"><strong>LOADING ROSTER</strong>Connecting to the official NAL roster archive…</div>`;
