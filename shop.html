<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#061426">
  <title>NAL Shop</title>
  <meta http-equiv="refresh" content="0; url=https://nalshop.com/">
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #061426;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .shop-launch {
      max-width: 360px;
    }
    .shop-launch strong {
      display: block;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: .5px;
      text-transform: uppercase;
    }
    .shop-launch span {
      display: block;
      margin-top: 8px;
      color: rgba(255,255,255,.72);
      font-size: 12px;
      line-height: 1.5;
    }
    .shop-launch a {
      display: inline-block;
      margin-top: 18px;
      padding: 11px 18px;
      border-radius: 8px;
      background: #d71920;
      color: #fff;
      text-decoration: none;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .5px;
    }
  </style>
</head>
<body>
  <div class="shop-launch">
    <strong>Opening NAL Shop</strong>
    <span>If the store does not open automatically, tap the button below.</span>
    <a href="https://nalshop.com/">ENTER NAL SHOP</a>
  </div>

  <script>
    window.location.replace("https://nalshop.com/");
  </script>
</body>
</html>
